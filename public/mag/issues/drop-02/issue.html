<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#f4efe6; --ink:#141414; --mute:#6d675e; --rule:rgba(20,20,20,.18);
  --cy:#f59ad6; --cy2:#b3337f; --red:#d23a26; --kraft:#c49a63; --kraft2:#a97d47; --night:#0f1724; --pink:#ef9fb4;
  --mono:'IBM Plex Mono',monospace; --serif:'Noto Serif KR',Georgia,serif; --sans:'Noto Sans KR',system-ui,sans-serif; --it:'Instrument Serif',Georgia,serif; --slab:'Archivo Black',serif;
  --rd-bg:#f6f1e7; --rd-ink:#1b1a18; --rd-accent:#b3337f; --rd-rule:rgba(20,20,20,.14); --rd-on:#fff; --rd-hit:#f59ad638;
}
/* ── 지면 ── */
.x2{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size;font-family:var(--serif);-webkit-font-smoothing:antialiased}
.x2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.x2 *{box-sizing:border-box}
.x2 :is(h1,h2,h3){color:inherit;text-align:left}
.x2 .x-in{position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:12cqw;display:flex;flex-direction:column}
.x2 .x-rh{position:absolute;left:7cqw;right:7cqw;top:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:.2cqw solid var(--rule);padding-bottom:1.6cqw}
.x2 .x-rh b{color:var(--cy2);font-weight:600}
.x2 .x-folio{position:absolute;left:7cqw;right:7cqw;bottom:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.x2 .x-kick{font:600 2.6cqw/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cy2)}
.x2 .x-h{font:900 8cqw/1.18 var(--serif);letter-spacing:-.03em;margin:2.4cqw 0 0;word-break:keep-all}
.x2 .x-h2{font:900 5.6cqw/1.25 var(--serif);letter-spacing:-.02em;margin:0;word-break:keep-all}
.x2 .x-en{font:italic 400 4.4cqw/1.1 var(--it);color:var(--mute)}
.x2 .x-dek{font:500 3.3cqw/1.6 var(--sans);color:#3a3631;margin:2.6cqw 0 0;word-break:keep-all}
.x2 .x-by{font:400 2.5cqw/1.4 var(--mono);color:var(--mute);margin-top:2cqw;letter-spacing:.04em}
.x2 .x-txt{font-size:3.5cqw;line-height:1.72;word-break:keep-all;color:#1f1d1a}
.x2 .x-txt p{margin:0 0 2.4cqw}
.x2 .x-txt .alb,.x2r .alb{font-feature-settings:"palt"}
.x2 .x-txt .note{font-family:var(--sans);font-size:3cqw;color:var(--mute)}
.x2 .x-txt ul{margin:0;padding:0;list-style:none}
.x2 .x-txt li{padding:2cqw 0;border-top:.2cqw solid var(--rule);font-family:var(--sans);font-size:3.1cqw;line-height:1.55}
.x2 .x-drop>p:first-child::first-letter{float:left;font:900 12cqw/.86 var(--serif);padding:1.2cqw 1.8cqw 0 0;color:var(--cy2)}
.x2 .x-more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:1.6cqw;border:.35cqw solid var(--cy2);border-radius:99cqw;background:none;color:var(--cy2);font:700 3.2cqw/1 var(--sans);padding:3.2cqw 4.6cqw;cursor:pointer;min-height:11cqw}
.x2 .x-more i{font-style:normal;font-size:2.4cqw}
.x2 .x-more:focus-visible{outline:.5cqw solid var(--red);outline-offset:.8cqw}
.x2 .x-dark .x-more,.x2.x-dark .x-more{border-color:#9fe0f2;color:#9fe0f2}
.x2 .x-pull{font:900 4.6cqw/1.45 var(--serif);letter-spacing:-.02em;word-break:keep-all;color:var(--ink);padding:3cqw 0;border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink)}
.x2 .x-pull p{margin:0}
.x2 .x-cap{font:400 2.5cqw/1.5 var(--sans);color:var(--mute);word-break:keep-all}
.x2 .x-cap b{color:var(--ink);font-weight:700}
.x2 .x-tag{display:inline-block;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;padding:1.2cqw 1.8cqw;border:.25cqw solid currentColor;border-radius:.6cqw}
/* 리소 판 어긋남: 같은 글자를 하늘색으로 한 번 더 찍고 살짝 민다 */
.x2 .x-riso{position:relative;display:inline-block}
.x2 .x-riso::before{content:attr(data-t);position:absolute;left:.7cqw;top:.45cqw;color:var(--cy);mix-blend-mode:multiply;white-space:pre-line;z-index:-1}
.x2 .x-dots{background-image:radial-gradient(circle,var(--ink) 34%,transparent 36%);background-size:1.8cqw 1.8cqw}

/* 0 표지 — 신발 상자 끝면 라벨 */
.x2.x-cover{background:linear-gradient(180deg,#cfa86f 0,#c49a63 46%,#b88c55 100%)}
.x2.x-cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(80,50,20,.05) 0 .3cqw,transparent .3cqw 1.9cqw),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 .2cqw,transparent .2cqw 3cqw)}
.x2 .x-lid{position:absolute;left:0;right:0;top:36cqw;height:2.4cqw;background:linear-gradient(180deg,rgba(60,35,10,.38),rgba(60,35,10,0));border-top:.3cqw solid rgba(255,240,215,.45)}
.x2 .x-mast{position:absolute;left:4.5cqw;top:1cqw;font:400 21.5cqw/1 var(--slab);letter-spacing:-.045em;color:var(--cy);text-shadow:.7cqw .7cqw 0 rgba(20,20,20,.9)}
.x2 .x-issue{position:absolute;left:6cqw;right:6cqw;top:29.5cqw;display:flex;justify-content:space-between;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;color:#2b1d0d}
.x2 .x-stamp{position:absolute;right:6cqw;top:44cqw;width:19cqw;height:19cqw;border-radius:50%;border:.7cqw solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font:900 3.6cqw/1.15 var(--sans);transform:rotate(12deg);mix-blend-mode:multiply;z-index:3}
.x2 .x-label{position:absolute;left:7cqw;right:13cqw;top:42cqw;background:#fbf8f1;color:#1a1612;padding:3cqw 3.6cqw 2.6cqw;transform:rotate(-1.4deg);box-shadow:0 .5cqw 1.4cqw rgba(60,35,10,.35)}
.x2 .x-label .r{display:flex;gap:2.4cqw;align-items:baseline;border-bottom:.25cqw solid #1a1612;padding:1cqw 0}
.x2 .x-label .r span{font:400 2.1cqw/1 var(--mono);letter-spacing:.12em;color:#6b6157;width:12cqw;flex:0 0 auto}
.x2 .x-label .r b{font:400 5.6cqw/1 var(--slab);letter-spacing:-.01em}
.x2 .x-label .g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-top:1.8cqw}
.x2 .x-label .g div{font:400 1.9cqw/1.35 var(--mono);color:#6b6157;letter-spacing:.06em}
.x2 .x-label .g b{display:block;font:600 2.6cqw/1.2 var(--mono);color:#1a1612;letter-spacing:0}
.x2 .x-bar{height:6.4cqw;margin-top:2.2cqw;background:repeating-linear-gradient(90deg,#1a1612 0 .35cqw,transparent .35cqw .7cqw,#1a1612 .7cqw .9cqw,transparent .9cqw 1.5cqw,#1a1612 1.5cqw 2.2cqw,transparent 2.2cqw 2.6cqw,#1a1612 2.6cqw 2.8cqw,transparent 2.8cqw 3.6cqw)}
.x2 .x-barn{display:flex;justify-content:space-between;font:400 1.9cqw/1 var(--mono);margin-top:1cqw;letter-spacing:.08em}
.x2 .x-cvh{position:absolute;left:7cqw;right:7cqw;top:90cqw;margin:0;font:900 11.4cqw/1.12 var(--serif);letter-spacing:-.045em;color:#141414}
.x2 .x-cvdek{position:absolute;left:7cqw;right:22cqw;top:117.5cqw;margin:0;font:700 3cqw/1.5 var(--sans);color:#2b1d0d;word-break:keep-all}
.x2 .x-cvl{position:absolute;left:7cqw;right:7cqw;bottom:6cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw 4cqw;border-top:.35cqw solid #2b1d0d;padding-top:2.4cqw}
.x2 .x-cvl div{font:500 2.5cqw/1.35 var(--sans);color:#2b1d0d}
.x2 .x-cvl b{display:block;font:600 2cqw/1.2 var(--mono);letter-spacing:.12em;color:#5b3d17}
.x2 .x-lp{position:absolute;right:6cqw;top:116cqw;width:14cqw;height:14cqw;border-radius:50%;background:radial-gradient(circle,#f4efe6 0 8%,var(--cy) 8% 32%,#141414 32% 36%,#2a2a2a 36% 40%,#141414 40%);display:flex;align-items:center;justify-content:center;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.35)}
.x2 .x-lp span{position:absolute;bottom:-4.4cqw;left:-4cqw;right:-4cqw;text-align:center;font:600 2cqw/1 var(--mono);color:#2b1d0d;letter-spacing:.06em}

/* 1 차례 */
.x2 .x-toc{list-style:none;margin:3cqw 0 0;padding:0}
.x2 .x-toc li{display:grid;grid-template-columns:10cqw 1fr;gap:2cqw;padding:1.25cqw 0;border-top:.2cqw solid var(--rule);align-items:baseline}
.x2 .x-toc li b{font:400 5cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-toc li span{font:700 3.1cqw/1.3 var(--sans)}
.x2 .x-toc li small{display:block;font:400 2.6cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-how{margin-top:2.4cqw;background:#e6f4f8;border-left:1cqw solid var(--cy);padding:3cqw 3.4cqw;font:500 2.8cqw/1.55 var(--sans);color:#1f3a42}
.x2 .x-how b{color:var(--cy2)}

/* 2 편집장의 글 */
.x2 .x-knob{width:30cqw;height:30cqw;margin:0 auto 1cqw;display:block}

/* 4 커버 스토리 첫 쪽 */
.x2 .x-room{position:absolute;left:7cqw;right:7cqw;top:12cqw;height:52cqw;border:1.2cqw solid var(--ink)}
.x2 .x-room::before{content:"";position:absolute;inset:0;opacity:.13}
.x2 .x-room .d{position:absolute;bottom:-1.2cqw;left:12%;width:16%;height:1.2cqw;background:var(--paper)}
.x2 .x-room .p{position:absolute;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--ink)}
.x2 .x-room .p.g{background:none;border:.5cqw dashed var(--ink)}
.x2 .x-room .t{position:absolute;right:2.4cqw;top:2cqw;font:600 2.2cqw/1.4 var(--mono);text-align:right;color:var(--mute)}

/* 지도 · 평면도 · 집 */
.x2 svg text{font-family:var(--sans)}
.x2 .x-fig{display:block;width:100%;height:auto;flex:0 0 auto;margin:2cqw 0 1.6cqw;border:.25cqw solid var(--ink);background:#efe8da}

/* 5 사실 상자 */
.x2 .x-facts{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 3cqw;font:400 2.7cqw/1.45 var(--sans);border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink);padding:2.4cqw 0;margin:2.4cqw 0}
.x2 .x-facts dt{font:600 2.3cqw/1.6 var(--mono);color:var(--mute);letter-spacing:.08em}
.x2 .x-facts dd{margin:0;font-weight:500}
.x2 .x-say{font:900 6.6cqw/1.3 var(--serif);letter-spacing:-.03em;margin:1cqw 0 3cqw;word-break:keep-all}
.x2 .x-say em{font-style:normal;color:var(--cy2)}

/* 8 연표 */
.x2 .x-tl{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.x2 .x-tl::before{content:"";position:absolute;left:19.2cqw;top:1cqw;bottom:1cqw;width:.5cqw;background:var(--ink)}
.x2 .x-tl li{display:grid;grid-template-columns:17cqw 1fr;gap:5cqw;padding:1.15cqw 0;position:relative}
.x2 .x-tl li::before{content:"";position:absolute;left:18cqw;top:2.2cqw;width:2.9cqw;height:2.9cqw;border-radius:50%;background:var(--paper);border:.5cqw solid var(--ink)}
.x2 .x-tl li.rm::before{background:var(--cy);border-color:var(--ink)}
.x2 .x-tl li.end::before{background:var(--red)}
.x2 .x-tl b{font:600 2.5cqw/1.5 var(--mono);text-align:right;white-space:nowrap}
.x2 .x-tl span{font:500 2.9cqw/1.45 var(--sans);word-break:keep-all}
.x2 .x-tl small{display:block;font-size:2.4cqw;color:var(--mute);font-weight:400}
.x2 .x-key{display:flex;gap:4cqw;font:400 2.3cqw/1 var(--sans);color:var(--mute);margin-top:2cqw}
.x2 .x-key i{display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;border:.4cqw solid var(--ink);vertical-align:-.3cqw;margin-right:1cqw}

/* 10 곡 목록 */
.x2 .x-tracks{list-style:none;margin:2cqw 0;padding:0;counter-reset:t}
.x2 .x-tracks li{display:grid;grid-template-columns:9cqw 1fr;align-items:baseline;padding:1.5cqw 0;border-bottom:.2cqw solid var(--rule)}
.x2 .x-tracks li::before{counter-increment:t;content:"0" counter(t);font:400 3.8cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-tracks li b{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-tracks li small{display:block;font:400 2.5cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-tracks li.hl b{color:var(--red)}

/* 11 끝 */
.x2 .x-when{background:var(--ink);color:#f4efe6;padding:3.4cqw 3.8cqw;margin:2cqw 0;font:500 3.1cqw/1.55 var(--sans)}
.x2 .x-when b{display:block;font:600 2.3cqw/1 var(--mono);letter-spacing:.14em;color:#9fe0f2;margin-bottom:1.6cqw}
.x2 .x-wx{font:italic 400 4cqw/1.35 var(--it);color:var(--mute);border-left:.6cqw solid var(--cy);padding-left:3cqw}

/* 12 밤 */
.x2.x-dark{background:var(--night);color:#e8edf2}
.x2.x-dark::after{opacity:.25;mix-blend-mode:screen}
.x2.x-dark .x-rh,.x2.x-dark .x-folio{color:#8b97a8;border-color:rgba(232,237,242,.2)}
.x2.x-dark .x-rh b{color:#9fe0f2}
.x2 .x-clock{font:400 22cqw/1 var(--slab);letter-spacing:-.04em;color:#9fe0f2;margin:0}
.x2 .x-meta{display:grid;grid-template-columns:auto 1fr;gap:1cqw 3cqw;font:400 2.8cqw/1.45 var(--sans);margin:2cqw 0 3cqw;color:#c9d2dd}
.x2 .x-meta dt{font:600 2.3cqw/1.65 var(--mono);color:#8b97a8;letter-spacing:.1em}
.x2 .x-meta dd{margin:0}
.x2.x-dark .x-txt{color:#dfe5ec}
.x2 .x-three{list-style:none;margin:0 0 2.4cqw;padding:0;border-top:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li{display:flex;gap:3cqw;align-items:baseline;padding:2cqw 0;border-bottom:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li b{font:400 3.4cqw/1 var(--slab);color:#9fe0f2}
.x2 .x-three li span{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-three li small{margin-left:auto;font:400 2.3cqw/1.3 var(--mono);color:#8b97a8;text-align:right}

/* 13 연재 */
.x2.x-pinkp{background:#f7e9ea}
.x2 .x-ser{display:flex;align-items:flex-end;gap:3cqw}
.x2 .x-ser b{font:400 17cqw/.85 var(--slab);color:var(--pink);-webkit-text-stroke:.35cqw var(--ink)}
.x2 .x-ser span{font:600 2.5cqw/1.5 var(--mono);letter-spacing:.12em;color:var(--mute);padding-bottom:1cqw}

/* 14 앞줄 */
.x2 .x-front{display:inline-block;background:#ffe14d;color:var(--ink);font:900 5.2cqw/1 var(--sans);padding:1.6cqw 3cqw;transform:rotate(-3deg);box-shadow:.6cqw .6cqw 0 var(--ink);margin-bottom:2.4cqw}
.x2 .x-band{border-top:.6cqw solid var(--ink);padding:2cqw 0 1.4cqw}
.x2 .x-band h3{margin:0;font:900 4.6cqw/1.2 var(--serif);letter-spacing:-.02em}
.x2 .x-band h3 small{font:500 2.7cqw/1 var(--sans);color:var(--mute);margin-left:1.4cqw;letter-spacing:0}
.x2 .x-band p{margin:1cqw 0 0;font:400 2.9cqw/1.6 var(--sans);word-break:keep-all}
.x2 .x-live{background:#ece5d6;padding:2.6cqw 3.4cqw 0;margin-top:1.6cqw}
.x2 .x-live .x-kick{color:var(--red)}
.x2 .x-live .x-txt li{font-size:2.6cqw;padding:1.4cqw 0}

/* 15 편집 노트 */
.x2 .x-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:3cqw 0;border-top:.6cqw solid var(--ink)}
.x2 .x-nums div{padding:2.6cqw 1cqw 2.4cqw;border-bottom:.2cqw solid var(--rule);border-right:.2cqw solid var(--rule)}
.x2 .x-nums div:nth-child(3n){border-right:0}
.x2 .x-nums b{display:block;font:400 9cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-nums span{display:block;font:500 2.5cqw/1.4 var(--sans);margin-top:1.2cqw;word-break:keep-all}
.x2 .x-colo{margin-top:auto;font:400 2.4cqw/1.7 var(--mono);color:var(--mute);border-top:.2cqw solid var(--rule);padding-top:2.4cqw}
.x2 .x-colo b{color:var(--ink);font-weight:600}

/* 16 부록 싱글 (single7 구조는 mag.js가 LP 그림으로 바꿔 끼운다) */
.x2 .single7{position:absolute;width:var(--w);aspect-ratio:1;transform:rotate(var(--r));cursor:pointer}
.x2 .single7 .sl{position:absolute;inset:0;background:#d4bf9e}
.x2 .single7 .bg{position:absolute;inset:-4% -4% -7%}
.x2 .single7 .tp{position:absolute;height:calc(var(--w)*.16);background:rgba(255,248,214,.55);border-left:1px dashed rgba(200,190,150,.6);border-right:1px dashed rgba(200,190,150,.6)}
.x2 .single7 .c2{position:absolute;left:-4cqw;right:-4cqw;top:calc(100% + 3cqw);text-align:center;font:700 3cqw/1.4 var(--sans);color:var(--ink)}
.x2 .single7 .c2 small{display:block;color:var(--mute);font-weight:400;font-size:2.5cqw}
.x2 .x-lpl{list-style:none;margin:2cqw 0 0;padding:0;columns:2;column-gap:5cqw}
.x2 .x-lpl li{break-inside:avoid;padding:1.2cqw 0;border-top:.2cqw solid var(--rule);font:400 2.5cqw/1.35 var(--sans)}
.x2 .x-lpl li b{display:block;font:600 2.2cqw/1.3 var(--mono);color:var(--cy2)}
.x2 .x-lpl li i{font:italic 400 3.6cqw/1.15 var(--it)}

/* ── 읽기 모드 (mag.js 읽기 창 안) ── */
.x2r{font-family:var(--serif);color:var(--rd-ink)}
.x2r :is(h1,h2){text-align:left}
.x2r .rhead{margin:0 0 1.8em;padding-bottom:1.2em;border-bottom:3px solid var(--rd-ink)}
.x2r h1{font:900 1.65em/1.3 var(--serif);letter-spacing:-.03em;margin:0;word-break:keep-all}

<template class="pg"><div class="x2" data-art="letter" data-at="a">
  <div class="x-rh"><b>편집장의 글</b><span>Drop Vol.02</span></div>

    <h2 class="x-h2" style="margin-top:1.4cqw">토요일에 나온 금요일 호</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="a.1">이번 호는 금요일이 아니라 토요일에 나온다. 정기 순번은 다음 주 금요일인데, 독자 한 사람이 세 잡지를 한꺼번에 받아 보고 싶다고 했다. 레코드 가게에서 일할 때 배운 게 하나 있다. 손님이 "지금" 이라고 하면 창고에서 꺼내 오는 게 맞다. 그래서 특별판이다. 순번은 그대로 돌아가고, 다음 정기 호도 예정대로 나온다.</p><p data-p="a.2">이번 주의 한 장은 스노 알레그라의 네 번째 정규 <span class="alb">[Legendary Love]</span>다. 2021년 이후 처음 내는 정규이고, 곡은 열세 개, 다 합쳐 43분 47초다. 우리는 이 판을 들을 수 없다. 대신 이 판이 어떻게 만들어졌는지, 무엇에 기대고 있는지를 기록으로 따라갔다. 점수는 없다. Drop이 점수를 버린 뒤 처음 쓰는 커버라 나도 손이 조금 어색했다.</p></div>

    <h2 class="x-h2" style="margin-top:1.4cqw">토킹 헤즈, 원본이 박스로 돌아왔다</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="b0.1">토킹 헤즈 <span class="alb">[Fear of Music (Super Deluxe Edition)]</span> (Rhino). 1979년 세 번째 앨범을 새로 마스터링하고, 미공개 녹음과 1979년 투어 공연 두 개를 통째로 묶었다. 공연은 그해 8월 24일 보스턴 버클리 퍼포먼스 센터, 11월 17일 뉴저지 패세익 캐피톨 시어터 녹음이다. 3CD에 블루레이 한 장, LP로는 6장짜리와 2장짜리가 같은 날 나왔다.</p><p data-p="b0.2">첫 곡은 여전히 'I Zimbra'다. 지난 호 '원본을 들어라'에서 U2의 신보가 기대고 있다고 짚은 바로 그 곡이다. 원판의 A면 여섯 곡, B면 다섯 곡 배치도 박스의 첫 LP에 그대로 남았다. 해설은 『Love Goes to Buildings on Fire』를 쓴 윌 허미스가 맡았다.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="s1.1"><span class="alb">[Legendary Love]</span>는 11월 13일 금요일에 나왔다. 곡은 열세 개, 다 합쳐 43분 47초다. 멜론에 올라온 정보로는 기획사 이름이 Feels Run Free, 유통은 FUGA이고, 발매를 알린 기사들은 유통사를 Stem으로 적었다. 2021년 <span class="alb">[Temporary Highs in the Violet Skies]</span> 이후 처음 내는 정규다.</p><p data-p="s1.2">사이에 아무것도 없었던 건 아니다. 2023년에 싱글 세 곡('Be My Summer', 'Sweet Tea', 'Wait a Little Longer')이 나왔다. 그 뒤 3년이 비었다. 올해 10월 8일 'Run Free'를 소셜 미디어에 먼저 들려주었고, 이어 'Karma'가 3년 만의 정식 싱글로 나왔다. 10월 21일에는 앨범 발표와 함께 'I Love You'가 나왔다.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="s2.1">스노 알레그라의 본명은 샤흐르자드 풀라디다. 1987년 9월 13일 스웨덴 웁살라에서 태어났고 스톡홀름에서 컸다. 페르시아어와 스웨덴어, 영어를 한다. 한동안 런던에 살다가 2012년부터 로스앤젤레스에 산다.</p><p data-p="s2.2">이름은 두 번 바뀌었다. 2015년에 법적인 이름을 스노 노우로지로 바꿨다고 밝혔고, 무대 이름에는 'Aalegra'를 붙였다. 이탈리아어로 '즐거운'이라는 뜻의 allegra를 자기 식으로 고쳐 쓴 것이고, 같은 이름의 가수가 이미 있었던 사정도 있었다.</p></div>

<template class="pg"><div class="x2" data-art="cover" data-at="s3">
  <div class="x-rh"><b>이번 주의 한 장</b><span>Drop Vol.02</span></div>

    <h2 class="x-h2" style="margin-top:1.4cqw">프린스가 남긴 것</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s3.1">경력에서 가장 자주 불려 나오는 이름은 프린스다. 알레그라의 말로는, 프린스가 온라인에서 그의 노래를 먼저 찾아 듣고 연락해 왔다. 그 뒤 미니애폴리스의 페이즐리 파크로 그를 불렀고, 로스앤젤레스에 오면 호텔 방에 피아노를 두고 함께 연주했다고 한다. 두 사람의 관계는 프린스가 세상을 떠난 2016년까지 3년 남짓 이어졌다.</p><p data-p="s3.2">그가 거기서 들고 나온 것은 두 가지로 요약된다. 하나는 남을 위해 자기를 바꾸지 말라는 말이다. 한 인터뷰에서 그는 프린스에게 배운 가장 중요한 것으로 이걸 꼽았다. 다른 하나는 연습이다. 다른 인터뷰에서 그는 프린스가 전성기가 아니었던 때에도 하루 세 번씩 리허설을 했다고 기억했다.</p></div>

<template class="pg"><div class="x2" data-art="cover" data-at="s4">
  <div class="x-rh"><b>이번 주의 한 장</b><span>Drop Vol.02</span></div>
  <div class="x-in">
    <div class="x-kick">이번 주의 한 장</div>
    <h2 class="x-h2" style="margin-top:1.4cqw">정규 세 장</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s4.1">첫 정규 <span class="alb">[Feels]</span>는 2017년에 나왔다. 노 아이디가 프로듀스했고, 그는 훗날 알레그라에게 필요했던 건 창작자가 마음 놓고 놀 수 있는 울타리였다고 회고했다. 노 아이디를 거쳐 빈스 스테이플스, 보이 원다, DJ 다히 같은 협업자들과 이어진 것도 이 시기다.</p><p data-p="s4.2">2019년 두 번째 정규 <span class="alb">[- Ugh, those feels again]</span>도 노 아이디가 총괄 프로듀서를 맡았다. 'I Want You Around', 'Find Someone Like You' 같은 곡이 이 판에서 나왔다. 세 번째 정규 <span class="alb">[Temporary Highs in the Violet Skies]</span>는 2021년 7월에 나왔고, 이듬해 그래미 최우수 R&amp;B 앨범 후보에 올랐다. 수록곡 'Lost You'도 같은 해 R&amp;B 퍼포먼스 부문 후보였고, 2023년에는 싱글 'Do 4 Love'가 전통 R&amp;B 퍼포먼스 부문 후보에 올랐다.</p></div>

  </div>
  <div class="x-folio"><span>8</span><span>이번 주의 한 장</span></div>
</div></template>
<template class="pg"><div class="x2" data-art="cover" data-at="s5">
  <div class="x-rh"><b>이번 주의 한 장</b><span>Drop Vol.02</span></div>
  <div class="x-in">

    <h2 class="x-h2" style="margin-top:1.4cqw">[Legendary Love]가 만들어진 방식</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s5.1">이번 판은 2년 반에 걸쳐 쓰고 녹음했다. 발표문은 이 기간을, 끝내 이뤄지지 않은 어떤 관계 안에서 그가 자라 간 시간이라고 설명한다. 알레그라는 이렇게 썼다. 가장 위대한 사랑 이야기는 얼마나 오래 갔는지로 재는 게 아니라, 그 사랑이 나를 어떤 사람이 되게 했는지로 잰다고. 그리고 곡마다 예전의 나와 지금의 나, 앞으로의 내가 한 조각씩 들어 있다고.</p><p data-p="s5.2">'I Love You'의 크레딧은 이렇다. 알레그라와 조엘 컴퍼스가 함께 썼고, 알레그라·컴퍼스·조시 그랜트가 프로듀스했다. 기타는 나일 로저스, 베이스는 라파엘 사딕이다. 두 사람은 노래를 하지 않는다. 악기만 연주했다. 뮤직비디오는 알프레드 마로킨이 찍었는데, 'Run Free'의 영상도 같은 감독이다.</p></div>

  </div>

    <h2 class="x-h2" style="margin-top:1.4cqw">아쉬움에 대하여</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s6.1">이 판에 대한 가장 쉬운 반론은 이것이다. 과거를 그리워한다는 판은 많고, 그리움만으로는 새 판이 되지 않는다. 옛 신시사이저와 전설의 세션 연주자를 불러 모으는 일은 듣는 사람보다 만드는 사람을 더 즐겁게 하기 쉽다.</p><p data-p="s6.2">우리가 할 수 있는 대답은 기록 안에 있다. 알레그라는 데뷔 때부터 지금까지 같은 것을 말해 왔다. 첫 정규 이름이 '느낌'이었고, 둘째는 '또 그 느낌'이었다. 이번 판의 그리움은 갑자기 생긴 유행이 아니라 그가 열두 해 동안 붙들어 온 주제다. 그리고 그는 협업자 이름을 앞세우지 않았다. 나일 로저스와 라파엘 사딕은 첫 싱글에서 악기만 잡았고, 나머지 이름들은 곡 표시조차 없다.</p></div>

    <h2 class="x-h2" style="margin-top:1.4cqw">그가 지키는 것</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s7.1">Drop의 창간 선언에는 앨범은 처음부터 끝까지 듣는 물건이라는 문장이 있다. 알레그라의 두 번째 정규는 사랑에 빠졌다가 빠져나오는 여정을 처음부터 끝까지 따라가는 판이라는 평을 받았다. 이번 판도 2년 반 동안의 관계 하나를 열세 곡에 담았다고 스스로 밝혔다.</p><p data-p="s7.2">그가 지키는 건 두 가지로 보인다. 하나는 시간이다. 이 판은 5년 만의 정규이고, 그 5년 동안 그는 싱글 세 곡만 냈다. 다른 하나는 거리다. 그는 자기 음악을 '시네마틱 소울'이라고 불러 왔다. 노래 안의 사람과 노래하는 사람 사이에 화면 한 장만큼의 거리를 둔다는 뜻으로 우리는 읽는다.</p></div>

<template class="art" data-id="letter" data-title="토요일에 나온 금요일 호"><div class="x2r"><header class="rhead"><h1>토요일에 나온 금요일 호</h1><p class="by">글 고한석</p></header><span data-p="a"></span><p data-p="a.1">이번 호는 금요일이 아니라 토요일에 나온다. 정기 순번은 다음 주 금요일인데, 독자 한 사람이 세 잡지를 한꺼번에 받아 보고 싶다고 했다. 레코드 가게에서 일할 때 배운 게 하나 있다. 손님이 "지금" 이라고 하면 창고에서 꺼내 오는 게 맞다. 그래서 특별판이다. 순번은 그대로 돌아가고, 다음 정기 호도 예정대로 나온다.</p><p data-p="a.2">이번 주의 한 장은 스노 알레그라의 네 번째 정규 <span class="alb">[Legendary Love]</span>다. 2021년 이후 처음 내는 정규이고, 곡은 열세 개, 다 합쳐 43분 47초다. 우리는 이 판을 들을 수 없다. 대신 이 판이 어떻게 만들어졌는지, 무엇에 기대고 있는지를 기록으로 따라갔다. 점수는 없다. Drop이 점수를 버린 뒤 처음 쓰는 커버라 나도 손이 조금 어색했다.</p><span data-p="b"></span><p data-p="b.1">연재 '정전 해부'도 이번 호에서 시작한다. 첫 회는 디안젤로의 <span class="alb">[Voodoo]</span>다. 커버의 첫 싱글에서 베이스를 친 사람이 그 판에도 손을 댄 사람이라서 골랐다. 한 장의 신보가 정전 한 장을 불러내는 방식, 앞으로 이 연재는 그렇게 이어 갈 생각이다.</p><p data-p="b.2">단평은 한 장만 실었다. 이번 주 금요일 목록에서 출처를 두 곳 넘게 확인할 수 있고 우리 정전과 이어지는 판이 그것뿐이었다. 지난 호 '원본을 들어라'에서 짚은 곡이 들어 있는 판이라 반가웠다는 건 숨기지 않겠다.</p></div></template>
<template class="art" data-id="briefs" data-title="이번 주 단평"><div class="x2r"><header class="rhead"><h1>이번 주 단평</h1><p class="by">글 단평 데스크</p></header><span data-p="b0"></span><p data-p="b0.1">토킹 헤즈 <span class="alb">[Fear of Music (Super Deluxe Edition)]</span> (Rhino). 1979년 세 번째 앨범을 새로 마스터링하고, 미공개 녹음과 1979년 투어 공연 두 개를 통째로 묶었다. 공연은 그해 8월 24일 보스턴 버클리 퍼포먼스 센터, 11월 17일 뉴저지 패세익 캐피톨 시어터 녹음이다. 3CD에 블루레이 한 장, LP로는 6장짜리와 2장짜리가 같은 날 나왔다.</p><p data-p="b0.2">첫 곡은 여전히 'I Zimbra'다. 지난 호 '원본을 들어라'에서 U2의 신보가 기대고 있다고 짚은 바로 그 곡이다. 원판의 A면 여섯 곡, B면 다섯 곡 배치도 박스의 첫 LP에 그대로 남았다. 해설은 『Love Goes to Buildings on Fire』를 쓴 윌 허미스가 맡았다.</p><p class="note" data-p="b0.3">이럴 때 들을 것: 지난 호를 다시 펼친 날, 원본을 원본으로 듣고 싶을 때.</p></div></template>
<template class="art" data-id="cover" data-title="오래 가는 사랑의 기록 — 스노 알레그라"><div class="x2r"><header class="rhead"><h1>오래 가는 사랑의 기록 — 스노 알레그라</h1><p class="by">글 고한석</p></header><span data-p="s0"></span><p data-p="s0.1">이건 내가 그려 본 장면이다. 스톡홀름 교외의 어느 거실, 일곱 살 여자아이가 비디오테이프로 <span class="alb">[보디가드]</span>를 본다. 화면 속 휘트니 휴스턴이 'I Have Nothing'을 부르고, 아이는 그 노래가 끝나기도 전에 자기가 가수가 되리라고 정해 버린다. 자막 달린 영어 영화로 영어를 배우던 아이였다.</p><p data-p="s0.2">장면은 상상이지만 뼈대는 사실이다. 스노 알레그라는 2019년 한 인터뷰에서, 일곱 살에 그 영화를 보고 그 노래를 들은 순간 운명이 정해졌다고 말했다. 이란 출신 부모 아래 스웨덴에서 자랐고, <span class="alb">[보디가드]</span>와 자막 달린 미국 시트콤이 영어 선생이었다고도 했다. 그로부터 서른 해쯤 지나, 그는 이번 판을 두고 이렇게 썼다. 이 사랑이 자기를 어릴 때 사랑에 빠졌던 시절의 음악으로 데려다 놓았다고.</p><h2 data-p="s1">왜 지금</h2><p data-p="s1.1"><span class="alb">[Legendary Love]</span>는 11월 13일 금요일에 나왔다. 곡은 열세 개, 다 합쳐 43분 47초다. 멜론에 올라온 정보로는 기획사 이름이 Feels Run Free, 유통은 FUGA이고, 발매를 알린 기사들은 유통사를 Stem으로 적었다. 2021년 <span class="alb">[Temporary Highs in the Violet Skies]</span> 이후 처음 내는 정규다.</p><p data-p="s1.2">사이에 아무것도 없었던 건 아니다. 2023년에 싱글 세 곡('Be My Summer', 'Sweet Tea', 'Wait a Little Longer')이 나왔다. 그 뒤 3년이 비었다. 올해 10월 8일 'Run Free'를 소셜 미디어에 먼저 들려주었고, 이어 'Karma'가 3년 만의 정식 싱글로 나왔다. 10월 21일에는 앨범 발표와 함께 'I Love You'가 나왔다.</p><p data-p="s1.3">Drop이 이 판을 고른 이유는 하나다. 판 스스로 과거를 향해 있다고 말하기 때문이다. 이 판이 기대는 원본을 짚는 게 우리 일인데, 이번엔 아티스트가 먼저 원본 쪽을 가리켰다. 그 손가락이 정확히 어디를 가리키는지 따라가 보기로 했다.</p><h2 data-p="s2">웁살라에서 로스앤젤레스까지</h2><p data-p="s2.1">스노 알레그라의 본명은 샤흐르자드 풀라디다. 1987년 9월 13일 스웨덴 웁살라에서 태어났고 스톡홀름에서 컸다. 페르시아어와 스웨덴어, 영어를 한다. 한동안 런던에 살다가 2012년부터 로스앤젤레스에 산다.</p><p data-p="s2.2">이름은 두 번 바뀌었다. 2015년에 법적인 이름을 스노 노우로지로 바꿨다고 밝혔고, 무대 이름에는 'Aalegra'를 붙였다. 이탈리아어로 '즐거운'이라는 뜻의 allegra를 자기 식으로 고쳐 쓴 것이고, 같은 이름의 가수가 이미 있었던 사정도 있었다.</p><p data-p="s2.3">2013년 프로듀서 노 아이디(No I.D.)의 레이블 ARTium과 계약했다. 2014년 커먼의 앨범 <span class="alb">[Nobody's Smiling]</span>의 'Hustle Harder'에 목소리를 얹었고, 2015년 2월 RZA가 프로듀스한 'Emotional'로 스노 알레그라라는 이름을 처음 세상에 내놓았다. 같은 해 빈스 스테이플스의 데뷔 앨범 <span class="alb">[Summertime '06]</span>에도 참여했다.</p><blockquote class="pull" data-p="s2.4">일곱 살에 들은 노래 한 곡이, 서른아홉 살의 판 한 장을 정했다.</blockquote><h2 data-p="s3">프린스가 남긴 것</h2><p data-p="s3.1">경력에서 가장 자주 불려 나오는 이름은 프린스다. 알레그라의 말로는, 프린스가 온라인에서 그의 노래를 먼저 찾아 듣고 연락해 왔다. 그 뒤 미니애폴리스의 페이즐리 파크로 그를 불렀고, 로스앤젤레스에 오면 호텔 방에 피아노를 두고 함께 연주했다고 한다. 두 사람의 관계는 프린스가 세상을 떠난 2016년까지 3년 남짓 이어졌다.</p><p data-p="s3.2">그가 거기서 들고 나온 것은 두 가지로 요약된다. 하나는 남을 위해 자기를 바꾸지 말라는 말이다. 한 인터뷰에서 그는 프린스에게 배운 가장 중요한 것으로 이걸 꼽았다. 다른 하나는 연습이다. 다른 인터뷰에서 그는 프린스가 전성기가 아니었던 때에도 하루 세 번씩 리허설을 했다고 기억했다.</p><p data-p="s3.3">그 첫 만남의 기억도 그는 자세히 남겼다. 페이즐리 파크로 가는 차에 오르자 마중 나온 사람이 그의 찢어진 검은 청바지를 보고, 그분이 좋아하지 않을 거라고 걱정스럽게 말했다고 한다. 프린스는 그때 여성 연주자들로 꾸린 밴드 3RDEYEGIRL과 하루 서너 시간씩 리허설을 하고 있었다. 프린스는 그 자리에서도 더 나아지려고 애쓰는 사람이었다고 그는 기억한다.</p><p data-p="s3.4">그 기준은 다른 선배에게도 이어졌다. 같은 인터뷰에 따르면 그 한 해 전 런던 브릭스턴 아카데미 공연 때 재닛 잭슨이 객석 위층에서 노래하고 춤추는 모습이 목격됐고, 공연이 끝난 뒤 대기실 앞까지 찾아와 직접 꽃을 건넸다. 그는 재닛 잭슨이 공연 내내 객석에 있었다고 말했다. 일곱 살 때 텔레비전으로 보던 세대가 이제 그의 공연을 보러 온다.</p><p data-p="s3.5">알레그라에게 이 일은 일화가 아니라 기준처럼 보인다. 2023년 영국 잡지 인터뷰에서 그는 프린스에게서 받은 세 가지 선물을 차례로 꼽았고, 그 첫째를 '인정'이라고 했다. 자기 본능이 이미 말하던 것을 프린스가 말로 해 주었다는 것이다.</p><h2 data-p="s4">정규 세 장</h2><p data-p="s4.1">첫 정규 <span class="alb">[Feels]</span>는 2017년에 나왔다. 노 아이디가 프로듀스했고, 그는 훗날 알레그라에게 필요했던 건 창작자가 마음 놓고 놀 수 있는 울타리였다고 회고했다. 노 아이디를 거쳐 빈스 스테이플스, 보이 원다, DJ 다히 같은 협업자들과 이어진 것도 이 시기다.</p><p data-p="s4.2">2019년 두 번째 정규 <span class="alb">[- Ugh, those feels again]</span>도 노 아이디가 총괄 프로듀서를 맡았다. 'I Want You Around', 'Find Someone Like You' 같은 곡이 이 판에서 나왔다. 세 번째 정규 <span class="alb">[Temporary Highs in the Violet Skies]</span>는 2021년 7월에 나왔고, 이듬해 그래미 최우수 R&amp;B 앨범 후보에 올랐다. 수록곡 'Lost You'도 같은 해 R&amp;B 퍼포먼스 부문 후보였고, 2023년에는 싱글 'Do 4 Love'가 전통 R&amp;B 퍼포먼스 부문 후보에 올랐다.</p><p data-p="s4.3">2020년 1월에는 퍼렐과 채드 휴고의 넵튠스와 함께 스튜디오에 있었다는 보도가 있다. 그 작업이 어디로 갔는지는 확인할 수 없었다. 이번 판의 크레딧에 넵튠스의 이름은 보이지 않는다.</p><p data-p="s4.4">이 시기의 판들은 모두 노 아이디의 울타리 안에서 나왔다. 그 울타리가 이번 판에서는 보이지 않는다. 발표 자료와 첫 싱글 크레딧 어디에도 노 아이디의 이름은 없고, 기획사 이름은 Feels Run Free다. 이름의 유래는 우리가 확인하지 못했다. 다만 데뷔 판의 제목 <span class="alb">[Feels]</span>와 이번 첫 곡의 제목 'Run Free'가 한 이름 안에 나란히 있다는 것만은 적어 둔다.</p><h2 data-p="s5"><span class="alb">[Legendary Love]</span>가 만들어진 방식</h2><p data-p="s5.1">이번 판은 2년 반에 걸쳐 쓰고 녹음했다. 발표문은 이 기간을, 끝내 이뤄지지 않은 어떤 관계 안에서 그가 자라 간 시간이라고 설명한다. 알레그라는 이렇게 썼다. 가장 위대한 사랑 이야기는 얼마나 오래 갔는지로 재는 게 아니라, 그 사랑이 나를 어떤 사람이 되게 했는지로 잰다고. 그리고 곡마다 예전의 나와 지금의 나, 앞으로의 내가 한 조각씩 들어 있다고.</p><p data-p="s5.2">'I Love You'의 크레딧은 이렇다. 알레그라와 조엘 컴퍼스가 함께 썼고, 알레그라·컴퍼스·조시 그랜트가 프로듀스했다. 기타는 나일 로저스, 베이스는 라파엘 사딕이다. 두 사람은 노래를 하지 않는다. 악기만 연주했다. 뮤직비디오는 알프레드 마로킨이 찍었는데, 'Run Free'의 영상도 같은 감독이다.</p><p data-p="s5.3">앨범 발표 자료에는 이름이 더 있다. 베이비페이스, 지미 잼과 테리 루이스, 무스타파, 다히, 대니얼 시저. 다만 누가 어느 곡에 참여했는지는 발표되지 않았다. 녹음에는 옛 신시사이저와 드럼 머신, 기타를 그대로 썼다고 한다. 'Run Free'를 처음 소개한 기사는 그 곡에서 프린스와 80년대 팝의 영향이 들린다고 썼다. 우리는 그 문장을 옮길 뿐, 확인할 귀가 없다.</p><p data-p="s5.4">곡 순서를 보자. 앞의 세 곡이 먼저 공개된 싱글 셋이다. 'Run Free', 'I Love You', 'Karma'. 공개된 순서는 'Run Free', 'Karma', 'I Love You'였는데 판에서는 둘째와 셋째가 자리를 바꿨다. 넷째 곡 'Danger'는 1분 54초로 판에서 가장 짧다. 그리고 판은 가장 긴 두 곡, 타이틀곡 'Legendary Love'(4분 16초)와 'Greatest Of All Time'(4분 22초)으로 끝난다.</p><h2 data-p="s6">아쉬움에 대하여</h2><p data-p="s6.1">이 판에 대한 가장 쉬운 반론은 이것이다. 과거를 그리워한다는 판은 많고, 그리움만으로는 새 판이 되지 않는다. 옛 신시사이저와 전설의 세션 연주자를 불러 모으는 일은 듣는 사람보다 만드는 사람을 더 즐겁게 하기 쉽다.</p><p data-p="s6.2">우리가 할 수 있는 대답은 기록 안에 있다. 알레그라는 데뷔 때부터 지금까지 같은 것을 말해 왔다. 첫 정규 이름이 '느낌'이었고, 둘째는 '또 그 느낌'이었다. 이번 판의 그리움은 갑자기 생긴 유행이 아니라 그가 열두 해 동안 붙들어 온 주제다. 그리고 그는 협업자 이름을 앞세우지 않았다. 나일 로저스와 라파엘 사딕은 첫 싱글에서 악기만 잡았고, 나머지 이름들은 곡 표시조차 없다.</p><p data-p="s6.3">다만 아쉬운 점도 기록으로 남긴다. 이번 판의 곡별 크레딧은 발매 이틀 뒤인 지금도 공식적으로 다 나오지 않았다. 열세 곡 가운데 누가 무엇을 했는지 우리가 확인한 건 한 곡뿐이다. 판을 작품으로 읽으려는 사람에게 이건 작은 문제가 아니다. 크레딧이 나오면 다음 Drop에서 다시 적겠다.</p><p data-p="s6.4">먼저 나온 싱글 셋에 대한 반응도 기록해 둔다. 'Karma'를 다룬 R&amp;B 매체 Rated R&amp;B는 이 곡이 여러 생을 건너 이어지는 인연, 끝내 이뤄지지 않은 관계를 다룬다고 소개하며, 편곡은 어쿠스틱 발라드에 가깝다고 썼다. 'I Love You'를 두고 캐나다 매체 Exclaim!은 목소리와 펑크 리듬, 두 객원 연주자의 악기가 맞물리는 지점을 짚었다고 한다. 영국 잡지 Clash는 같은 곡을 얼터너티브 소울의 직설적인 순간이라고 불렀다. 우리는 이 문장들을 옮길 뿐, 이들이 들은 것을 우리가 확인할 길은 없다.</p><h2 data-p="s7">그가 지키는 것</h2><p data-p="s7.1">Drop의 창간 선언에는 앨범은 처음부터 끝까지 듣는 물건이라는 문장이 있다. 알레그라의 두 번째 정규는 사랑에 빠졌다가 빠져나오는 여정을 처음부터 끝까지 따라가는 판이라는 평을 받았다. 이번 판도 2년 반 동안의 관계 하나를 열세 곡에 담았다고 스스로 밝혔다.</p><p data-p="s7.2">그가 지키는 건 두 가지로 보인다. 하나는 시간이다. 이 판은 5년 만의 정규이고, 그 5년 동안 그는 싱글 세 곡만 냈다. 다른 하나는 거리다. 그는 자기 음악을 '시네마틱 소울'이라고 불러 왔다. 노래 안의 사람과 노래하는 사람 사이에 화면 한 장만큼의 거리를 둔다는 뜻으로 우리는 읽는다.</p><p data-p="s7.3">열 해 뒤에도 이 판을 꺼낼지는 지금 말할 수 없다. 우리가 말할 수 있는 건, 이 판이 기대는 원본이 무엇인지 그가 정확히 알고 있다는 것이다. 그건 Drop이 판을 믿기 시작하는 첫 조건이다.</p><h2 data-p="s8">다시, 거실</h2><p data-p="s8.1">처음의 거실로 돌아간다. 이것도 내가 그려 본 장면이다. 일곱 살 아이가 본 비디오테이프는 아마 지금쯤 어느 창고에 있을 것이다. 서른아홉 살의 그는 그 테이프 대신 옛 신시사이저와 드럼 머신을 꺼냈다. 그리고 판의 마지막 곡 제목을 '역대 최고'라고 붙였다. 사랑이 끝났어도 그 사랑은 최고였다고 말하는 사람의 제목이다.</p><p data-p="s8.2">판을 다 돌린 뒤 바늘을 들어 올리는 손을 상상해 본다. 판 뒷면에 적힌 이름들이 아직 다 채워지지 않았다는 것만 빼면, 이 판은 꽤 오래 꺼내 볼 준비가 된 물건처럼 보인다.</p></div></template>
<template class="art" data-id="origin" data-title="원본을 들어라 — 시크와 토니! 토니! 토네!"><div class="x2r"><header class="rhead"><h1>원본을 들어라 — 시크와 토니! 토니! 토네!</h1><p class="by">글 고한석</p></header><span data-p="o0"></span><p data-p="o0.1">이번 판의 첫 싱글에서 기타와 베이스를 맡은 두 사람에게는 각자의 원본이 있다. 나일 로저스는 버나드 에드워즈와 함께 시크(Chic)를 세운 사람이다. 'Le Freak'와 'Good Times'가 그 밴드의 곡이다. 그 뒤로 다이애나 로스, 데이비드 보위, 마돈나, 다프트 펑크의 판에 이름을 남겼다.</p><p data-p="o0.2">라파엘 사딕은 토니! 토니! 토네!와 루시 펄을 거쳤고, 2002년 솔로 앨범 <span class="alb">[Instant Vintage]</span>를 냈다. 그의 이력에서 Drop이 가장 먼저 짚는 건 디안젤로의 <span class="alb">[Voodoo]</span>에 참여했다는 사실이다. 그 판은 우리 정전 목록에 있다.</p><span data-p="o1"></span><p data-p="o1.1">'원본을 들어라'는 신보가 기대고 있는 과거 판 한 장을 권하는 꼭지다. 이번엔 한 장 대신 두 이름을 권한다. 시크의 'Good Times'에서 나일 로저스의 기타가 어떤 자리에 서는지, 그리고 <span class="alb">[Voodoo]</span>에서 라파엘 사딕이 어떤 곡에 이름을 올렸는지. <span class="alb">[Voodoo]</span> 쪽은 이번 호 연재가 이어 받는다. 'I Love You'를 들은 뒤 이 두 곡으로 거슬러 올라가 보기를 권한다.</p></div></template>
<template class="art" data-id="serial" data-title="연재 &#x27;정전 해부&#x27; 1회 — [Voodoo], 일렉트릭 레이디의 3년"><div class="x2r"><header class="rhead"><h1>연재 '정전 해부' 1회 — <span class="alb">[Voodoo]</span>, 일렉트릭 레이디의 3년</h1><p class="by">글 고한석</p></header><span data-p="r0"></span><p data-p="r0.1">연재를 시작한다. '정전 해부'는 Drop의 정전 목록에 있는 판 한 장이 어떻게 만들어졌는지를 기록으로 되짚는 꼭지다. 듣고 쓰는 감상이 아니라 만든 과정의 기록이다. 첫 회는 디안젤로의 2000년 앨범 <span class="alb">[Voodoo]</span>다. 이번 호 커버의 첫 싱글에서 베이스를 친 라파엘 사딕이 이 판의 크레딧에도 있다.</p><span data-p="r1"></span><p data-p="r1.1">1995년 데뷔 앨범 <span class="alb">[Brown Sugar]</span>로 이름을 얻은 디안젤로는 두 번째 판을 준비하며 처음엔 다른 스튜디오에서 작업했다. 소리 울림과 방 구조가 마음에 들지 않았다고 한다. 엔지니어 러셀 엘레바도가 그의 레코드 더미에서 스티비 원더의 <span class="alb">[Music of My Mind]</span>와 <span class="alb">[Talking Book]</span>을 꺼내, 이 판들이 일렉트릭 레이디 스튜디오에서 녹음됐다는 크레딧을 보여 주었다. 엘레바도는 훗날, 디안젤로가 그 스튜디오가 아직 운영 중인지도 몰랐다고 회고했다.</p><p data-p="r1.2">일렉트릭 레이디는 지미 헨드릭스가 뉴욕 그리니치빌리지에 지은 스튜디오다. 원래는 '더 제너레이션'이라는 클럽 자리였다. 녹음은 1997년에 시작됐다. 엘레바도는 그해에만 테이프 릴 200개 넘게 썼다고 말했다. 퀘스트러브는 1996년과 1997년 대부분을 옛날 영상을 보고 잼을 하며 보냈다고 기억한다. 공연 녹화를 가져와 복사하고, 한 주 동안 공부하고, 그다음 주에 곡 작업을 시작하는 식이었다.</p><span data-p="r2"></span><p data-p="r2.1">이 방에서 판 네 장이 동시에 만들어졌다. 디안젤로의 <span class="alb">[Voodoo]</span>, 더 루츠의 <span class="alb">[Things Fall Apart]</span>, 에리카 바두의 <span class="alb">[Mama's Gun]</span>, 커먼의 <span class="alb">[Like Water for Chocolate]</span>. 이 무리는 나중에 소울쿼리언스라는 이름으로 불린다. 퀘스트러브, 제임스 포이저, 제이 딜라, 피노 팔라디노, 큐팁이 그 안에 있었다.</p><p data-p="r2.2">엘레바도는 이 판의 85퍼센트가 라이브로 녹음됐고 전부 테이프에 담았다고 말했다. 'Untitled (How Does It Feel)'를 빼면 덧입힌 녹음이 없다는 기록도 있다. 'Left &amp; Right'는 원래 다른 래퍼가 맡기로 했다가 메소드 맨과 레드맨으로 바뀌었다. 녹음과 믹스 기간은 기록마다 2년에서 3년으로 엇갈린다. 판은 2000년에 나왔다.</p><p data-p="r2.3">엇갈리는 기록을 하나로 고르지 않고 그대로 둔다. 이 연재의 원칙이다. 방 하나에 판 네 장, 3년 가까운 시간, 200개 넘는 릴. <span class="alb">[Voodoo]</span>를 정전으로 남게 한 건 소리보다 먼저 그 시간을 버틴 방이었다.</p><p class="note" data-p="r2.4">다음 회 예고: 2회는 정전 목록의 다른 한 장, 그 주 커버와 이어지는 판으로 고른다. 녹음 장소와 기간이 기록으로 확인되는 판만 다룬다.</p></div></template>

<template class="art" data-id="desk" data-title="편집 노트"><div class="x2r"><header class="rhead"><h1>편집 노트</h1><p class="by">글 편집부</p></header><span data-p="d0"></span><p data-p="d0.1">이번 호는 정기 순번 밖에서 독자의 요청으로 만든 특별판이다. 출처 29곳에서 사실을 모았고, 커버 출처는 15곳이다. 초고에서 네 가지를 지웠다(가사 사이트에만 나온 싱글 발매일 하나, 출처가 한 곳뿐인 다른 가수의 샘플 이야기 하나, 확인되지 않은 공연 일정 하나, 출처가 엇갈린 <span class="alb">[Voodoo]</span>의 발매 월 하나). 소리를 묘사한 문장은 두 개이고, 둘 다 원래 쓴 매체를 문장 안에 밝혔다. 상상한 장면은 두 개(커버의 처음과 끝)이고 본문에 상상이라고 적었다. 가사 인용은 없고, 직접 인용은 모두 우리말로 옮겨 요약했다.</p><span data-p="d1"></span><p data-p="d1.1">사진: 표지 사진 Knar Bedian / CC BY-SA 2.0(위키미디어 커먼스, 2016년 4월). 커버 여는 쪽 사진 Rene Passet from Den Haag, Holland / CC BY-SA 2.0(위키미디어 커먼스, 2016년). 두 장 모두 색을 바꾸고 잘랐다. 앨범 표지 원본은 쓰지 않았다.</p><h2 data-p="d2">출처</h2><ul><li data-p="d2.1">The Line of Best Fit — Snoh Aalegra announces new album, Legendary Love <a href="https://www.thelineofbestfit.com/news/snoh-aalegra-announces-new-album-legendary-love" target="_blank" rel="noopener">https://www.thelineofbestfit.com/news/snoh-aalegra-announces-new-album-legendary-love</a></li><li data-p="d2.2">Clash — Snoh Aalegra Announces New Album ‘Legendary Love’ <a href="https://www.clashmusic.com/?p=464278" target="_blank" rel="noopener">https://www.clashmusic.com/?p=464278</a></li><li data-p="d2.3">Hypebeast — Snoh Aalegra Teases Her Return With New Single “Run Free” <a href="https://hypebeast.com/2026/10/snoh-aalegra-teases-her-return-with-new-single-run-free" target="_blank" rel="noopener">https://hypebeast.com/2026/10/snoh-aalegra-teases-her-return-with-new-single-run-free</a></li><li data-p="d2.4">KarloBag — Snoh Aalegra's 'I Love You' with Nile Rodgers and Raphael Saadiq <a href="https://karlobag.eu/en/music/snoh-aalegra-s-i-love-you-with-nile-rodgers-and-raphael-saadiq-ahead-of-her-new-yfa9a/" target="_blank" rel="noopener">https://karlobag.eu/en/music/snoh-aalegra-s-i-love-you-with-nile-rodgers-and-raphael-saadiq-ahead-of-her-new-yfa9a/</a></li><li data-p="d2.5">Ratings Game Music — Snoh Aalegr
