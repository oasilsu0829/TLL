/* 10 곡 길이 그래프 */
.iss-drop-02 .x2 .d-bars{position:relative;margin:2cqw 0 1.4cqw}

.iss-drop-02 .x2 .d-strip i.f{background:var(--pink2)}
.iss-drop-02 .x2 .d-strip i.l{background:var(--orange)}
.iss-drop-02 .x2 .d-strip::after{content:"";position:absolute;left:50%;top:-1.6cqw;bottom:-1.6cqw;width:.5cqw;background:var(--blue)}
.iss-drop-02 .x2 .d-sl{display:flex;justify-content:space-between;font:400 2cqw/1.3 var(--mono);color:var(--mute)}

<template class="art" data-id="letter" data-title="숫자를 떼어 낸 첫 금요일"><div class="x2r"><header class="rhead"><h1>숫자를 떼어 낸 첫 금요일</h1><p class="by">글 고한석</p></header><span data-p="a"></span><p data-p="a.1">지난주까지 이 지면은 판마다 소수 한 자리 숫자를 달았다. 6.5, 7.1 같은 것들이다. 이번 호부터 그 숫자를 뗀다.</p><p data-p="a.2">이유는 하나다. 이 편집부는 음악을 귀로 듣지 못한다. 손에 쥔 것은 크레딧, 녹음 날짜, 만든 사람이 한 말, 다른 귀들이 남긴 기록이다. 그것으로 점수를 매기면 들은 척하는 셈이 된다. 들은 척은 이 잡지가 가장 싫어하는 일이다.</p><span data-p="b"></span><p data-p="b.1">깐깐함은 그대로 둔다. 화제가 되면 누가 무엇을 근거로 박수를 쳤는지 따진다. 모든 판에는 그 판이 기대는 원본을 하나씩 짚는다. 판정 대신 사실을 쓴다. 이 판은 무엇을 빌렸고, 무엇이 다른가.</p><p data-p="b.2">'이번 주 필청'도 이름을 바꾼다. 이제 '이번 주의 한 장'이다. 편집부가 고른 판 한 장을 길게 해설한다. '이번 주 실망'은 없앤다. 듣지 않고 실망할 수는 없다.</p><p data-p="b.3">새 연재도 하나 연다. '정전 해부'. 이 잡지가 기준으로 삼는 정전 앨범이 어떻게 만들어졌는지를 기록으로 되짚는다. 첫 회는 라디오헤드다. 이번 주의 한 장과 노래 한 곡으로 이어져 있다.</p><p data-p="b.4">이번 주의 한 장은 피아노 한 대로 만든 판이다. 숫자를 뗀 첫 호에 어울리는 조용한 판이다.</p></div></template>
<template class="art" data-id="briefs" data-title="이번 주 단평"><div class="x2r"><header class="rhead"><h1>이번 주 단평</h1><p class="by">글 단평 데스크</p></header><span data-p="b0"></span><p data-p="b0.1">래디 핏 — <span class="alb">[No Human Tongue Can Tell]</span> (Rough Trade)</p><p data-p="b0.2">아일랜드 포크 밴드 랭컴의 보컬 래디 핏이 첫 솔로 앨범을 냈다. 아홉 곡, 포크 전통의 노래를 다시 부른 모음이다. 첫 곡은 'Hares on the Mountain'. 더 라인 오브 베스트 핏에 따르면 이 판은 사랑 노래를 여성의 자립과 자기 결정의 쪽에서 다시 들려주는 모음이다.</p><p data-p="b0.3">시작은 15년 전이었다. 핏은 마이크 올드필드가 <span class="alb">[Tubular Bells]</span>를 만드는 다큐멘터리를 보고, 엇갈리는 모든 파트를 혼자 쓰고 연주하는 녹음을 해 보고 싶어졌다고 말했다. 함께 만든 사람은 존 '스퍼드' 머피. 핏이 꼽은 영향은 셜리·돌리 콜린스, 엔야, 랄 워터슨, 카렌 돌턴 등이다.</p><p class="note" data-p="b0.4">이 판을 들을 이유: 원본은 이 노래들 자체다. 핏은 수백 년 동안 다른 사람들의 경험이 노래에 스며들었다고 말했다. 그 노래를 모든 파트를 혼자 쌓는 방식으로 다시 녹음하려 한 판이다.</p><span data-p="b1"></span><p data-p="b1.1">스노 알레그라 — <span class="alb">[Legendary Love]</span></p><p data-p="b1.2">이란계 스웨덴 가수이자 프로듀서인 스노 알레그라가 2021년 <span class="alb">[Temporary Highs in the Violet Skies]</span> 이후 처음으로 정규를 냈다. 더 라인 오브 베스트 핏에 따르면 앨범은 두 해 반에 걸쳐 쓰고 녹음했고, 끝내 이뤄지지 않은 한 관계를 따라간다.</p><p data-p="b1.3">미리 공개한 'I Love You'는 알레그라와 조엘 컴퍼스가 함께 썼고 조시 그랜트가 프로듀스했다. 기타는 나일 로저스, 베이스는 라파엘 사딕이 쳤다. 알레그라는 이 사랑이 자신이 자라며 반했던 시대의 음악으로 데려갔다고 말했다.</p><p class="note" data-p="b1.4">이 판을 들을 이유: 크레딧에 나일 로저스와 라파엘 사딕이 나란히 있다. 원본을 연주한 세대가 직접 와서 친 곡이다.</p></div></template>
<template class="art" data-id="cover" data-title="빈 홀의 피아노 — 브래드 멜다우"><div class="x2r"><header class="rhead"><h1>빈 홀의 피아노 — 브래드 멜다우</h1><p class="by">글 고한석</p></header><span data-p="s0"></span><p data-p="s0.1">크레딧 한 줄로 시작한다. 2025년 12월 11일과 12일, 독일 크론베르크, 카살스 포룸. 함부르크 스타인웨이 D. 준비와 조율 다니엘 브레히.</p><p data-p="s0.2">여기서부터는 그 한 줄로 그려 본 장면이다. 프랑크푸르트 북쪽 타우누스 산자락의 12월. 550석 홀에 관객은 없다. 무대 한가운데 피아노가 한 대 있고, 조율사가 먼저 와서 건반을 하나씩 누른다. 엔지니어는 객석 어딘가에 마이크를 세운다. 그리고 한 사람이 들어와 앉는다. 이틀 동안 그는 자기가 쓴 곡만 친다.</p><p data-p="s0.3">11월 13일 논서치에서 나온 <span class="alb">[Fantasy &amp; Reveries]</span>는 그 이틀의 기록이다.</p><h2 data-p="s1">왜 이 판인가</h2><p data-p="s1.1">판은 두 작품으로 되어 있다. 11분 11초짜리 'Fantasy for Piano' 한 곡, 그리고 짧은 곡 열네 개를 묶은 'Fourteen Reveries'. 트랙은 열다섯, 애플 뮤직의 곡 길이를 더하면 49분 55초다.</p><p data-p="s1.2">이 지면에는 오래된 규칙이 있다. 50분을 넘는 앨범에는 뺄 곡을 묻는다. 이 판은 5초 모자라게 그 선 안에 들어온다. 우연일 것이다. 그래도 적어 둔다.</p><p data-p="s1.3">고른 이유는 셋이다. 첫째, 남의 곡이 한 곡도 없다. 멜다우의 최근 몇 년은 남의 노래와 대화하는 판이 많았다. 비틀스 곡을 친 <span class="alb">[Your Mother Should Know]</span>(2023), 바흐와 포레를 자기 곡과 엮은 <span class="alb">[After Bach II]</span>와 <span class="alb">[Après Fauré]</span>(2024), 엘리엇 스미스의 노래책 <span class="alb">[Ride into the Sun]</span>(2025). 이번 판은 처음부터 끝까지 자기가 쓴 악보다.</p><p data-p="s1.4">둘째, 판의 모양이 처음부터 앨범이다. 긴 곡 하나와 짧은 곡 열넷. 무겁게 열고 잘게 이어 가는 구성은 곡을 모아 놓은 것이 아니라 순서를 설계한 것이다. 셋째, 이 판에는 원본이 분명하다. 멜다우 자신의 2020년 판이다. 아래에서 차례로 쓴다.</p><h2 data-p="s2">1970, 그리고 옮겨 적기</h2><p data-p="s2.1">브래드 멜다우는 1970년 8월 23일 플로리다 잭슨빌에서 태어났다. 열 살 때 가족이 코네티컷 웨스트하트퍼드로 옮겼다. 위키백과에 정리된 그의 이력에 따르면 그전까지는 쉬운 팝 곡과 교본 연습만 쳤는데, 이사한 곳의 새 피아노 선생이 클래식을 가르쳤다.</p><p data-p="s2.2">고등학교에서 그는 재즈 밴드에 들었고, 음반 속 재즈 솔로를 귀로 듣고 악보로 옮겨 적기 시작했다. 듣는 귀를 기르고 즉흥 연주의 속을 들여다보려는 연습이었다. 열다섯 살부터는 동네 클럽에 매주 나갔다.</p><p data-p="s2.3">1988년 그는 뉴욕으로 가 뉴스쿨에서 재즈를 공부했다. 선생 명단이 길다. 피아니스트 프레드 허시, 주니어 맨스, 케니 워너, 그리고 드러머 지미 콥. 멜다우는 훗날 솔로 피아노에서 가장 큰 영향을 준 사람으로 허시를 꼽았다.</p><blockquote class="pull" data-p="s2.4">혼자 치는 법은 혼자 배우지 않았다. 선생 명단 맨 끝에 <span class="alb">[Kind of Blue]</span>의 드러머가 있다.</blockquote><h2 data-p="s3">트리오의 시대</h2><p data-p="s3.1">1994년 멜다우는 베이스 래리 그레나디어, 드럼 호르헤 로시와 첫 장기 트리오를 꾸렸다. 이듬해 워너 브러더스에서 <span class="alb">[Introducing Brad Mehldau]</span>를 냈다. 두 번째 판 <span class="alb">[The Art of the Trio Volume One]</span>은 1996년에 녹음했다. 이 거창한 제목은 프로듀서 맷 피어슨이 눈길을 끌려고 고른 것이었다.</p><p data-p="s3.2">시리즈는 이어졌다. 빌리지 뱅가드 실황, 그리고 1998년 스튜디오 판 <span class="alb">[Songs: The Art of the Trio Volume Three]</span>. 이 판에 닉 드레이크의 'River Man'과 라디오헤드의 'Exit Music (For a Film)'이 실렸다. 원곡이 나온 지 한 해 남짓 지났을 때다. 이 잡지가 이번 호부터 시작하는 연재 '정전 해부'의 첫 회가 바로 그 원곡이 실린 판이다.</p><p data-p="s3.3">모두가 반긴 것은 아니다. 평론가 네이트 치넨은 그가 직접 쓴 라이너 노트의 철학적인 말들과 빌 에번스와 비교되는 데 대한 불평 때문에 멜다우에게 허세가 있다는 평판이 오래 남았다고 적었다. 이 평판은 이 판을 읽을 때도 기억해 둘 만하다. 이번에도 그는 라이너 노트를 길게 썼다.</p><p data-p="s3.4">박자 이야기도 해 둔다. 그는 <span class="alb">[Art of the Trio 4]</span>에서 'All the Things You Are'를 7/4박으로, <span class="alb">[Art of the Trio 1]</span>에서 'I Didn't Know What Time It Was'를 5/4박으로 쳤다. 이 홀수 박자를 몸에 붙이는 데 로시와 함께 한 해쯤 걸렸다고 한다. 7이라는 숫자는 이번 판에도 나온다.</p><h2 data-p="s4">혼자 친 판들</h2><p data-p="s4.1">첫 솔로 판은 1999년에 녹음한 <span class="alb">[Elegiac Cycle]</span>이다. 브람스, 슈베르트, 슈만 같은 19세기 독일 낭만주의 작곡가들에 대한 관심이 바탕이었다. 트리오 판이 이어지던 흐름을 처음 끊은 판이기도 하다.</p><p data-p="s4.2">논서치로 옮긴 첫 판도 솔로였다. 2003년 공연을 담은 <span class="alb">[Live in Tokyo]</span>(2004). 이 판에서 그의 연주에 서정성이 더 짙어졌다는 평이 있었다. 그 뒤로 솔로 실황은 <span class="alb">[Live in Marciac]</span>(2011), 열 해치 유럽 공연을 모은 <span class="alb">[10 Years Solo Live]</span>(2015)로 이어졌다.</p><p data-p="s4.3">2015년에는 여러 공연장이 바흐에서 영감을 받은 곡을 그에게 의뢰했다. 그는 그 곡과 바흐 원곡을 함께 치는 공연을 했고, 이것이 <span class="alb">[After Bach]</span>(2018)가 됐다. 이번 판의 'Fantasy for Piano'는 레이블 설명에 따르면 그 무렵, <span class="alb">[Three Pieces After Bach]</span>와 같은 시기에 쓴 곡이다. 의뢰한 사람은 피아니스트 제러미 덴크다. 덴크와 멜다우는 2020년 랜디 뉴먼 등과 함께 <span class="alb">[I Still Play]</span>에 이름을 올린 사이다.</p><h2 data-p="s5">원본은 2020년 4월에 있다</h2><p data-p="s5.1">이 판이 기대는 원본은 멀리 있지 않다. 멜다우 자신의 <span class="alb">[Suite: April 2020]</span>이다. 레이블은 이번 'Fourteen Reveries'를 두고 그 판처럼 짧은 곡들의 모음이라고 소개했다.</p><p data-p="s5.2"><span class="alb">[Suite: April 2020]</span>의 사정은 이렇다. 팬데믹 초기 그는 암스테르담 집에 가족과 함께 있었다. 2020년 4월 그때의 경험을 바탕으로 열두 곡을 썼고, 4월 23일과 24일 암스테르담의 파워 사운드 스튜디오에서 녹음했다. 남의 곡 셋을 더해 열다섯 트랙. 4분을 넘는 곡이 하나도 없었다. 마지막 곡은 해결되지 않은 화음에서 끝냈다고 재즈 저널은 적었다.</p><p data-p="s5.3">이번 판과 나란히 놓으면 닮은 점과 다른 점이 바로 보인다. 둘 다 열다섯 트랙이다. 둘 다 짧은 곡을 묶었다. 다른 점은 셋이다. 이번 판에는 남의 곡이 없다. 앞에 11분짜리 긴 곡을 세웠다. 그리고 짧은 곡 가운데 둘이 5분을 넘는다. 2020년의 판이 갇힌 집에서 쓴 일기였다면, 이번 판은 일기를 다시 정서해 큰 홀로 들고 간 것에 가깝다. 이 비유는 편집부의 것이다.</p><h2 data-p="s6">열다섯 트랙의 배치</h2><p data-p="s6.1">이 잡지의 버릇대로 곡 배치를 따로 읽는다. 이 판이 LP로 어떻게 면이 나뉘는지는 확인하지 못했다. 그래서 길이로 나눴다. 49분 55초의 한가운데는 시작에서 24분 57초 되는 지점이다.</p><p data-p="s6.2">그 지점은 여섯 번째 몽상 'Reverie 6' 안에 떨어진다. 6분 5초로 열네 몽상 가운데 가장 긴 곡이다. 판의 허리에 가장 긴 몽상이 놓였다. 두 번째로 긴 몽상은 마지막 'Reverie 14'로 5분 50초다. 가장 짧은 것은 'Reverie 5', 1분 9초다.</p><p data-p="s6.3">정리하면 이렇다. 앞쪽 절반은 11분짜리 판타지와 1~3분짜리 몽상 다섯, 그리고 가장 긴 몽상의 앞부분이다. 뒤쪽 절반은 1~4분짜리 몽상 일곱이 이어지다 5분 50초짜리 마지막 곡으로 닫힌다. 무겁게 열고, 허리에 한 번 길게 머물고, 길게 닫는다. 곡 길이만 보고 한 독해다. 소리는 이 지면이 말할 수 없다.</p><p data-p="s6.4">글라이드 매거진의 평은 이 배치에 소리를 붙였다. 판타지 11분 동안 두세 분마다 힘찬 연주와 가벼운 터치가 오간다고 썼고, 'Reverie 6'에서 영화 같은 기운이, 바로 뒤 'Reverie 7'에서 쉬는 기운이 나온다고 적었다. 마지막 서너 곡에서는 해방감이 퍼진다고 했다. 모두 그 매체의 귀다.</p><h2 data-p="s7">판타지, 7/4</h2><p data-p="s7.1">'Fantasy for Piano'에 대해서는 멜다우 자신의 설명이 가장 정확하다. 라이너 노트에서 그는 이 곡이 <span class="alb">[Three Pieces After Bach]</span>와 같은 집착을 공유한다고 썼다. 길게 끄는 페달 포인트, 맑은 3화음과 극단적인 불협화음을 날카롭게 맞붙이기, 그리고 자유롭게 쪼갠 7/4박.</p><p data-p="s7.2">페달 포인트는 낮은 음 하나를 오래 붙잡아 두고 그 위에서 화음을 바꾸는 방법이다. 7/4박은 한 마디에 박이 일곱이다. 자유롭게 쪼갠다는 말은 그 일곱을 2+2+3이나 3+2+2처럼 그때그때 다르게 묶는다는 뜻으로 읽힌다. 1999년 그가 스탠더드를 7/4로 고쳐 치던 그 박자다.</p><p data-p="s7.3">그는 이렇게 덧붙였다. "아주 빽빽하게 쓴 곡이라, 아주 두꺼운 짜임 안에서 선율의 줄거리를 전하는 것이 자주 과제가 된다." 직접 쓴 곡을 직접 치면서도 그는 그것을 과제라고 불렀다.</p><h2 data-p="s8">몽상, 혼자</h2><p data-p="s8.1">'Fourteen Reveries'에 대해서는 이렇게 썼다. 큰 규모의 전개를 피하고 짧게 가기로 했다. 한 곡 한 곡은 감정을 증류한 것에 가깝다. 몽상이라는 이름처럼, 깨어 있는 동안 바깥에서 물러나는 순간에 어울리는 음악이다.</p><p data-p="s8.2">그다음 문장이 이 판의 열쇠다. 몽상은 언제나 내면의 경험이고, 자기 의식 안에만 있으며, 다른 사람과 상관이 없다. 그래서 이 음악은 고독을 표현한다고 그는 말했다. 때로는 황홀하게, 잔잔하게, 초조하게, 외롭게, 혹은 들뜨게.</p><p data-p="s8.3">2003년 한 인터뷰에서 그는 오르페우스 신화를 꺼낸 적이 있다. 저승에서 아내를 데리고 나오다 끝내 뒤를 돌아보는 순간, 그는 음악이 바로 그 순간이라고 했다. 사랑하는 것을 보는 동시에 영영 잃는 순간. 얻음과 잃음을 한데 묶는 것이 음악이라는 말이었다. 스물세 해 뒤의 라이너 노트에서 그 생각은 고독이라는 말로 바뀌어 있다.</p><h2 data-p="s9">녹음, 카살스 포룸</h2><p data-p="s9.1">녹음한 곳은 크론베르크 아카데미의 카살스 포룸이다. 2022년 9월 23일 문을 연 실내악 홀로, 550석이다. 건물은 베를린의 폴커 슈타프가 설계했고 음향 설계는 네덜란드의 마르테인 페르캄먼이 맡았다.</p><p data-p="s9.2">녹음·믹스·마스터링은 모두 라이너 마이야르가 했다. 믹스와 마스터링은 베를린의 에밀 베를리너 스튜디오에서 했다. 피아노는 함부르크 스타인웨이 D, 준비와 조율은 다니엘 브레히. 프로듀서는 멜다우 자신이다. 표지 디자인은 존 갈, 사진은 에르베 에스카리오가 찍었다. 레이블이 공개한 크레딧에 연주자는 단 한 줄이다. 브래드 멜다우, 피아노, 1~15.</p><p data-p="s9.3">두 판의 녹음을 나란히 둔다. 2020년은 봉쇄된 도시의 스튜디오에서 이틀. 2025년은 텅 빈 550석 홀에서 이틀. 둘 다 혼자다. 다른 것은 방의 크기다. 고독을 주제로 한 판을 큰 홀에서 녹음했다는 사실은, 고독이 좁은 방의 일만은 아니라는 말처럼 읽힌다.</p><h2 data-p="s10">반론</h2><p data-p="s10.1">반론은 분명하다. 또 솔로 피아노 소품집이다. 2020년과 같은 틀을 다시 썼다. 라이너 노트는 여전히 길고 철학적이다. 허세라는 오래된 평판에 다시 기름을 붓는 판일 수 있다.</p><p data-p="s10.2">답도 사실로 한다. 같은 틀을 썼지만 같은 판은 아니다. 2020년의 판에는 남의 곡이 셋 있었고 이번에는 없다. 2020년의 판은 4분을 넘는 곡이 없었고 이번에는 11분짜리 곡이 맨 앞에 있다. 덴크의 의뢰로 쓴 빽빽한 곡 하나를 짧은 곡 열넷과 한 판에 묶은 결정은 틀을 반복한 것이 아니라 틀을 시험한 것이다.</p><p data-p="s10.3">라이너 노트에 대해서는 이렇게 말해 두겠다. 이번 노트는 곡이 무엇을 하려 했는지를 쓴 설명서에 가깝다. 페달 포인트, 7/4, 짜임의 두께. 이 지면처럼 음악을 듣지 못하는 독자에게도 판의 설계도를 건넨다. 허세인지 친절인지는 그 문장들을 읽고 판단하면 된다.</p><h2 data-p="s11">다시, 빈 홀</h2><p data-p="s11.1">이 판이 10년 뒤에도 꺼낼 판인지는 이 지면이 판정할 수 없다. 판정은 귀의 일이다. 대신 확인한 것을 적는다. 남의 곡이 없는 열다섯 트랙. 긴 곡 하나로 열고, 판의 허리에 가장 긴 몽상을 두고, 길게 닫는 배치. 2020년의 판이라는 분명한 원본, 그리고 그 원본과 다른 세 가지.</p><p data-p="s11.2">이번 주 수백 장의 판 가운데 이 판을 '이번 주의 한 장'으로 올린 것은 이 때문이다. 처음부터 끝까지 순서대로 듣게 만든 판이다. 이 잡지는 그런 판을 앨범이라고 부른다.</p><p data-p="s11.3">처음 장면으로 돌아간다. 이것도 그려 본 장면이다. 둘째 날 저녁, 마지막 몽상을 치고 그는 건반에서 손을 뗀다. 550개의 빈 의자가 소리를 다 먹을 때까지 잠깐 그대로 앉아 있는다. 조율사가 뚜껑을 덮는다. 홀의 불이 꺼진다.</p><p class="note" data-p="s11.4">이 판의 면 배치(고한석의 버릇): 앞쪽 절반은 긴 판타지와 짧은 몽상 다섯. 뒤쪽 절반은 가장 긴 몽상의 뒷부분부터 끝까지. LP의 실제 면 나눔은 확인하지 못해 길이로 나눴다.</p></div></template>
<template class="art" data-id="origin" data-title="원본을 들어라 — 마일스 데이비스 [Kind of Blue]"><div class="x2r"><header class="rhead"><h1>원본을 들어라 — 마일스 데이비스 <span class="alb">[Kind of Blue]</span></h1><p class="by">글 고한석</p></header><span data-p="o0"></span><p data-p="o0.1">이번 주의 한 장이 혼자 친 판이라면, 원본으로는 정반대의 판을 고른다. 여섯이 한 방에서, 거의 연습 없이 녹음한 판이다. 이어진 끈은 사람 하나다. 멜다우가 뉴스쿨에서 배운 드러머 지미 콥은 이 판의 드러머였다.</p><p data-p="o0.2"><span class="alb">[Kind of Blue]</span>는 1959년 3월 2일과 4월 22일 두 번의 세션으로 뉴욕 컬럼비아 레코드의 30번가 스튜디오에서 3트랙 테이프에 녹음했다. 3월 2일에 'So What', 'Freddie Freeloader', 'Blue in Green'을 녹음해 원래 LP의 첫 면이 됐다. 4월 22일의 'All Blues'와 'Flamenco Sketches'가 둘째 면이다.</p><span data-p="o1"></span><p data-p="o1.1">녹음 방식이 이 판의 전부다. 빌 에번스가 쓴 원래 라이너 노트에 따르면 데이비스는 녹음 몇 시간 전에야 곡의 틀을 구상했고, 연주자들에게는 음계와 선율의 스케치만 건넸다. 코드 진행 대신 음계를 주는 방식, 곧 모달 재즈다. 다만 판 전체를 한 번에 녹음했다는 전설은 사실이 아니다. 첫 시도에 끝까지 간 것은 'Flamenco Sketches' 하나였다.</p><p data-p="o1.2">피아노는 에번스가 쳤다. 다만 블루스 색이 가장 짙은 'Freddie Freeloader'만은 새로 밴드에 들어온 윈턴 켈리가 쳤다. 프로듀서는 컬럼비아의 어빙 타운센드다. 테오 마세로의 이름이 붙은 판도 있지만 그것은 잘못된 표기다.</p><span data-p="o2"></span><p data-p="o2.1">멜다우의 판과 나란히 두면 이렇다. 1959년, 여섯 명, 스케치 몇 장, 3트랙 테이프. 2025년, 한 명, 빽빽하게 쓴 악보, 550석의 빈 홀. 한쪽은 쓰지 않은 것을 연주했고 다른 쪽은 쓴 것을 연주했다. 그 사이 66년이다.</p><p class="note" data-p="o2.2">들을 순서: 첫 면을 먼저. 'So What'부터 'Blue in Green'까지가 3월 2일 하루다.</p></div></template>
<template class="art" data-id="serial" data-title="연재 &#x27;정전 해부&#x27; 1회 — [OK Computer], 집 한 채를 빌린 판"><div class="x2r"><header class="rhead"><h1>연재 '정전 해부' 1회 — <span class="alb">[OK Computer]</span>, 집 한 채를 빌린 판</h1><p class="by">글 고한석</p></header><span data-p="c0"></span><p data-p="c0.1">새 연재를 연다. 이 잡지가 기준으로 삼는 정전 열한 장을 한 회에 한 장씩, 만들어진 과정으로 되짚는다. 듣고 쓰는 감상은 없다. 장소, 사람, 기간, 당시의 반응만 쓴다. 첫 회는 1997년의 라디오헤드다. 이번 주의 한 장을 만든 피아니스트가 이듬해 이 판의 한 곡을 자기 트리오 판에 실었다.</p><h2 data-p="c1">오두막</h2><p data-p="c1.1">시작은 1995년 9월 4일이다. 브라이언 이노가 전쟁 피해 아동을 돕는 자선 앨범을 하루 만에 녹음하자고 했고, 라디오헤드는 엔지니어 나이절 고드리치와 다섯 시간 만에 'Lucky'를 녹음했다. 그 경험이 다음 앨범의 방향과 사람을 정했다.</p><p data-p="c1.2">레이블 팔로폰은 녹음 장비를 사라고 10만 파운드를 줬다. 밴드는 스스로 프로듀스하기로 했고 고드리치를 곁에 뒀다. 1996년 7월 그들은 옥스퍼드셔 디드콧 근처의 개조한 헛간, '캔드 어플로즈'에서 녹음을 시작했다. 집에서 너무 가까웠고, 먹고 씻을 시설이 없었다. 밴드는 이곳이 만족스럽지 않다고 판단했다.</p><h2 data-p="c2">저택</h2><p data-p="c2.1">그사이 한 곡이 먼저 나왔다. 바즈 루어만이 영화 <span class="alb">[로미오와 줄리엣]</span>에 쓸 노래를 청했고, 밴드는 영화의 마지막 30분을 보고 'Exit Music (For a Film)'을 썼다. 노래는 영화의 엔딩 크레딧에 흐르지만 밴드의 요청으로 사운드트랙 앨범에서는 빠졌다.</p><p data-p="c2.2">1996년 9월 그들은 배스 근처의 저택 세인트 캐서린스 코트로 옮겼다. 배우 제인 시모어가 가진, 평소 비어 있던 집이다. 밴드는 집의 방마다 다른 울림을 썼다. 'Exit Music'의 보컬은 돌계단에서 녹음해 자연 잔향을 얻었고, 'Let Down'은 새벽 3시 무도회장에서 녹음했다. 에드 오브라이언은 앨범의 80퍼센트를 함께 라이브로 녹음했다고 어림했다.</p><h2 data-p="c3">끝내기</h2><p data-p="c3.1">크리스마스 무렵 곡 목록은 열네 곡으로 줄었다. 런던 크라우치 엔드의 처치에서 추가 녹음을 했고, 현악은 1997년 1월 애비 로드에서 녹음했다. 마스터링을 마친 날은 1997년 3월 6일. 밴드는 곡 순서를 정하는 데만 두 주를 썼다. 앨범은 5월 21일에 나왔다.</p><p data-p="c3.2">EMI는 이 판에 기대가 낮았다. 상업성이 없고 팔기 어렵다고 봤다. 판은 영국 앨범 차트 1위에 올랐다. 미국 빌보드 200에는 21위로 들어갔는데, 그때까지 라디오헤드가 미국에서 낸 가장 높은 기록이었다. 이듬해 그래미에서 올해의 앨범 후보에 올랐고 최우수 얼터너티브 음악 앨범상을 받았다.</p><p data-p="c3.3">당시 비평가들은 이 판에서 70년대 프로그레시브 록의 빚을 읽었고, 밴드는 그 영향을 부인했다. 앨범 제목은 밴드가 1996년 투어 버스에서 듣던 라디오 드라마 <span class="alb">[은하수를 여행하는 히치하이커를 위한 안내서]</span>의 대사에서 따왔다. 2014년 미국 의회도서관은 이 판을 국가 녹음 등록부에 올렸다.</p><p class="note" data-p="c3.4">다음 회 예고: Talk Talk <span class="alb">[Spirit of Eden]</span> (1988). 정전 목록에서 다음 한 장.</p></div></template>
<template class="art" data-id="live" data-title="공연 · 발매 소식"><div class="x2r"><header class="rhead"><h1>공연 · 발매 소식</h1><p class="by">글 편집부</p></header><span data-p="l0"></span><p data-p="l0.1">확인된 것만 싣는다.</p><ul><li data-p="l0.2">래디 핏 — 2026년 12월 2일 런던 러프 트레이드 이스트, 2027년 3월 바비컨 공연 예정(더 라인 오브 베스트 핏)</li><li data-p="l0.3">브래드 멜다우 — 네덜란드 에디슨 클라식 시상식에서 재즈 공로상(Jazz Oeuvreprijs)을 받았다(논서치). 시상식은 NPO 2로 생중계됐고, 그는 바흐 골드베르크 주제에 의한 즉흥 변주로 방송을 닫았다</li><li data-p="l0.4">브래드 멜다우 — 신보의 모든 곡에 악보가 흐르는 영상이 함께 공개됐다. 'Reverie 7' 연주 영상도 있다(논서치)</li><li data-p="l0.5">스노 알레그라 <span class="alb">[Legendary Love]</span>, 래디 핏 <span class="alb">[No Human Tongue Can Tell]</span> — 모두 11월 13일 발매(NPR 뉴 뮤직 프라이데이 목록)</li></ul></div></template>
<template class="art" data-id="desk" data-title="편집 노트"><div class="x2r"><header class="rhead"><h1>편집 노트</h1><p class="by">글 편집부</p></header><span data-p="d0"></span><p data-p="d0.1">점수를 뗀 첫 호다. 그 밖의 규칙은 그대로다. 사실마다 출처를 달았고, 출처가 하나뿐인 숫자와 일화는 문장 안에 출처를 밝혔다. 소리 묘사는 커버 스토리의 한 문단에만 있고, 모두 글라이드 매거진의 귀라고 문장 안에 적었다.</p><span data-p="d1"></span><p data-p="d1.1">데스크에서 지운 것은 여섯이다. 녹음이 이틀 동안 몇 번의 테이크였는지(근거 없음), 표지 사진이 무엇을 찍었는지(편집부가 표지를 보지 못함), 'Three Pieces After Bach'의 정확한 첫 공연 해(출처끼리 엇갈림), 카살스 포룸이 세계 최고의 실내악 홀이라는 말(홍보 자료의 표현), 이 판의 LP 면 나눔(확인 못 함), 래디 핏 앨범의 곡별 연주자(확인 못 함). 곡 길이는 애플 뮤직 목록에서 옮겨 더했다.</p><h2 data-p="d2">출처</h2><ul><li data-p="d2.1">논서치 — Fantasy &amp; Reveries 앨범 페이지(크레딧) <a href="https://www.nonesuch.com/albums/fantasy-reveries" target="_blank" rel="noopener">https://www.nonesuch.com/albums/fantasy-reveries</a></li><li data-p="d2.2">논서치 — 발매 발표(2026.09.08) <a href="https://www.nonesuch.com/journal/brad-mehldau-fantasy-reveries-comprising-his-fantasy-piano-fourteen-reveries-out-november-13-2026-09-08" target="_blank" rel="noopener">https://www.nonesuch.com/journal/brad-mehldau-fantasy-reveries-comprising-his-fantasy-piano-fourteen-reveries-out-november-13-2026-09-08</a></li><li data-p="d2.3">논서치 — 'Fantasy for Piano' 공개(2026.10.13) <a href="https://www.nonesuch.com/journal/watch-brad-mehldau-fantasy-piano-album-fantasy-reveries-2026-10-13" target="_blank" rel="noopener">https://www.nonesuch.com/journal/watch-brad-mehldau-fantasy-piano-album-fantasy-reveries-2026-10-13</a></li><li data-p="d2.4">애플 뮤직 — 곡 목록과 길이 <a href="https://music.apple.com/ug/album/fantasy-reveries/6803109717" target="_blank" rel="noopener">https://music.apple.com/ug/album/fantasy-reveries/6803109717</a></li><li data-p="d2.5">글라이드 매거진 — 앨범 평 <a href="https://glidemagazine.com/332928/brad-mehldau-explores-the-dynamic-interplay-of-intensity-restraint-on-fantasy-reveries-album-review/" target="_blank" rel="noopener">https://glidemagazine.com/332928/brad-mehldau-explores-the-dynamic-interplay-of-i
