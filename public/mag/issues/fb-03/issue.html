<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#f4efe6; --ink:#141414; --mute:#6d675e; --rule:rgba(20,20,20,.18);
  --cy:#2bb3d9; --cy2:#137a99; --red:#d23a26; --kraft:#c49a63; --kraft2:#a97d47; --night:#0f1724; --pink:#ef9fb4;
  --mono:'IBM Plex Mono',monospace; --serif:'Noto Serif KR',Georgia,serif; --sans:'Noto Sans KR',system-ui,sans-serif; --it:'Instrument Serif',Georgia,serif; --slab:'Alfa Slab One',serif;
  --rd-bg:#f6f1e7; --rd-ink:#1b1a18; --rd-accent:#137a99; --rd-rule:rgba(20,20,20,.14); --rd-on:#fff; --rd-hit:#2bb3d938;
}
/* ── 지면 ── */
.x2{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size;font-family:var(--serif);-webkit-font-smoothing:antialiased}
.x2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.x2 *{box-sizing:border-box}
.x2 :is(h1,h2,h3){color:inherit;text-align:left}
.x2 .x-in{position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:12cqw;display:flex;flex-direction:column}
.x2 .x-rh{position:absolute;left:7cqw;right:7cqw;top:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:.2cqw solid var(--rule);padding-bottom:1.6cqw}
.x2 .x-rh b{color:var(--cy2);font-weight:600}
.x2 .x-folio{position:absolute;left:7cqw;right:7cqw;bottom:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.x2 .x-kick{font:600 2.6cqw/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cy2)}
.x2 .x-h{font:900 8cqw/1.18 var(--serif);letter-spacing:-.03em;margin:2.4cqw 0 0;word-break:keep-all}
.x2 .x-h2{font:900 5.6cqw/1.25 var(--serif);letter-spacing:-.02em;margin:0;word-break:keep-all}
.x2 .x-en{font:italic 400 4.4cqw/1.1 var(--it);color:var(--mute)}
.x2 .x-dek{font:500 3.3cqw/1.6 var(--sans);color:#3a3631;margin:2.6cqw 0 0;word-break:keep-all}
.x2 .x-by{font:400 2.5cqw/1.4 var(--mono);color:var(--mute);margin-top:2cqw;letter-spacing:.04em}
.x2 .x-txt{font-size:3.5cqw;line-height:1.72;word-break:keep-all;color:#1f1d1a}
.x2 .x-txt p{margin:0 0 2.4cqw}
.x2 .x-txt .alb,.x2r .alb{font-feature-settings:"palt"}
.x2 .x-txt .note{font-family:var(--sans);font-size:3cqw;color:var(--mute)}
.x2 .x-txt ul{margin:0;padding:0;list-style:none}
.x2 .x-txt li{padding:2cqw 0;border-top:.2cqw solid var(--rule);font-family:var(--sans);font-size:3.1cqw;line-height:1.55}
.x2 .x-drop>p:first-child::first-letter{float:left;font:900 12cqw/.86 var(--serif);padding:1.2cqw 1.8cqw 0 0;color:var(--cy2)}
.x2 .x-more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:1.6cqw;border:.35cqw solid var(--cy2);border-radius:99cqw;background:none;color:var(--cy2);font:700 3.2cqw/1 var(--sans);padding:3.2cqw 4.6cqw;cursor:pointer;min-height:11cqw}
.x2 .x-more i{font-style:normal;font-size:2.4cqw}
.x2 .x-more:focus-visible{outline:.5cqw solid var(--red);outline-offset:.8cqw}
.x2 .x-dark .x-more,.x2.x-dark .x-more{border-color:#9fe0f2;color:#9fe0f2}
.x2 .x-pull{font:900 4.6cqw/1.45 var(--serif);letter-spacing:-.02em;word-break:keep-all;color:var(--ink);padding:3cqw 0;border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink)}
.x2 .x-pull p{margin:0}
.x2 .x-cap{font:400 2.5cqw/1.5 var(--sans);color:var(--mute);word-break:keep-all}
.x2 .x-cap b{color:var(--ink);font-weight:700}
.x2 .x-tag{display:inline-block;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;padding:1.2cqw 1.8cqw;border:.25cqw solid currentColor;border-radius:.6cqw}
/* 리소 판 어긋남: 같은 글자를 하늘색으로 한 번 더 찍고 살짝 민다 */
.x2 .x-riso{position:relative;display:inline-block}
.x2 .x-riso::before{content:attr(data-t);position:absolute;left:.7cqw;top:.45cqw;color:var(--cy);mix-blend-mode:multiply;white-space:pre-line;z-index:-1}
.x2 .x-dots{background-image:radial-gradient(circle,var(--ink) 34%,transparent 36%);background-size:1.8cqw 1.8cqw}

/* 0 표지 — 신발 상자 끝면 라벨 */
.x2.x-cover{background:linear-gradient(180deg,#cfa86f 0,#c49a63 46%,#b88c55 100%)}
.x2.x-cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(80,50,20,.05) 0 .3cqw,transparent .3cqw 1.9cqw),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 .2cqw,transparent .2cqw 3cqw)}
.x2 .x-lid{position:absolute;left:0;right:0;top:36cqw;height:2.4cqw;background:linear-gradient(180deg,rgba(60,35,10,.38),rgba(60,35,10,0));border-top:.3cqw solid rgba(255,240,215,.45)}
.x2 .x-mast{position:absolute;left:4.5cqw;top:1cqw;font:400 21.5cqw/1 var(--slab);letter-spacing:-.045em;color:var(--cy);text-shadow:.7cqw .7cqw 0 rgba(20,20,20,.9)}
.x2 .x-issue{position:absolute;left:6cqw;right:6cqw;top:29.5cqw;display:flex;justify-content:space-between;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;color:#2b1d0d}
.x2 .x-stamp{position:absolute;right:6cqw;top:44cqw;width:19cqw;height:19cqw;border-radius:50%;border:.7cqw solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font:900 3.6cqw/1.15 var(--sans);transform:rotate(12deg);mix-blend-mode:multiply;z-index:3}
.x2 .x-label{position:absolute;left:7cqw;right:13cqw;top:42cqw;background:#fbf8f1;color:#1a1612;padding:3cqw 3.6cqw 2.6cqw;transform:rotate(-1.4deg);box-shadow:0 .5cqw 1.4cqw rgba(60,35,10,.35)}
.x2 .x-label .r{display:flex;gap:2.4cqw;align-items:baseline;border-bottom:.25cqw solid #1a1612;padding:1cqw 0}
.x2 .x-label .r span{font:400 2.1cqw/1 var(--mono);letter-spacing:.12em;color:#6b6157;width:12cqw;flex:0 0 auto}
.x2 .x-label .r b{font:400 5.6cqw/1 var(--slab);letter-spacing:-.01em}
.x2 .x-label .g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-top:1.8cqw}
.x2 .x-label .g div{font:400 1.9cqw/1.35 var(--mono);color:#6b6157;letter-spacing:.06em}
.x2 .x-label .g b{display:block;font:600 2.6cqw/1.2 var(--mono);color:#1a1612;letter-spacing:0}
.x2 .x-bar{height:6.4cqw;margin-top:2.2cqw;background:repeating-linear-gradient(90deg,#1a1612 0 .35cqw,transparent .35cqw .7cqw,#1a1612 .7cqw .9cqw,transparent .9cqw 1.5cqw,#1a1612 1.5cqw 2.2cqw,transparent 2.2cqw 2.6cqw,#1a1612 2.6cqw 2.8cqw,transparent 2.8cqw 3.6cqw)}
.x2 .x-barn{display:flex;justify-content:space-between;font:400 1.9cqw/1 var(--mono);margin-top:1cqw;letter-spacing:.08em}
.x2 .x-cvh{position:absolute;left:7cqw;right:7cqw;top:90cqw;margin:0;font:900 11.4cqw/1.12 var(--serif);letter-spacing:-.045em;color:#141414}
.x2 .x-cvdek{position:absolute;left:7cqw;right:22cqw;top:117.5cqw;margin:0;font:700 3cqw/1.5 var(--sans);color:#2b1d0d;word-break:keep-all}
.x2 .x-cvl{position:absolute;left:7cqw;right:7cqw;bottom:6cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw 4cqw;border-top:.35cqw solid #2b1d0d;padding-top:2.4cqw}
.x2 .x-cvl div{font:500 2.5cqw/1.35 var(--sans);color:#2b1d0d}
.x2 .x-cvl b{display:block;font:600 2cqw/1.2 var(--mono);letter-spacing:.12em;color:#5b3d17}
.x2 .x-lp{position:absolute;right:6cqw;top:116cqw;width:14cqw;height:14cqw;border-radius:50%;background:radial-gradient(circle,#f4efe6 0 8%,var(--cy) 8% 32%,#141414 32% 36%,#2a2a2a 36% 40%,#141414 40%);display:flex;align-items:center;justify-content:center;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.35)}
.x2 .x-lp span{position:absolute;bottom:-4.4cqw;left:-4cqw;right:-4cqw;text-align:center;font:600 2cqw/1 var(--mono);color:#2b1d0d;letter-spacing:.06em}

/* 1 차례 */
.x2 .x-toc{list-style:none;margin:3cqw 0 0;padding:0}
.x2 .x-toc li{display:grid;grid-template-columns:10cqw 1fr;gap:2cqw;padding:1.25cqw 0;border-top:.2cqw solid var(--rule);align-items:baseline}
.x2 .x-toc li b{font:400 5cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-toc li span{font:700 3.1cqw/1.3 var(--sans)}
.x2 .x-toc li small{display:block;font:400 2.6cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-how{margin-top:2.4cqw;background:#e6f4f8;border-left:1cqw solid var(--cy);padding:3cqw 3.4cqw;font:500 2.8cqw/1.55 var(--sans);color:#1f3a42}
.x2 .x-how b{color:var(--cy2)}

/* 2 편집장의 글 */
.x2 .x-knob{width:30cqw;height:30cqw;margin:0 auto 1cqw;display:block}

/* 4 커버 스토리 첫 쪽 */
.x2 .x-room{position:absolute;left:7cqw;right:7cqw;top:12cqw;height:52cqw;border:1.2cqw solid var(--ink)}
.x2 .x-room::before{content:"";position:absolute;inset:0;opacity:.13}
.x2 .x-room .d{position:absolute;bottom:-1.2cqw;left:12%;width:16%;height:1.2cqw;background:var(--paper)}
.x2 .x-room .p{position:absolute;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--ink)}
.x2 .x-room .p.g{background:none;border:.5cqw dashed var(--ink)}
.x2 .x-room .t{position:absolute;right:2.4cqw;top:2cqw;font:600 2.2cqw/1.4 var(--mono);text-align:right;color:var(--mute)}

/* 지도 · 평면도 · 집 */
.x2 svg text{font-family:var(--sans)}
.x2 .x-fig{display:block;width:100%;height:auto;flex:0 0 auto;margin:2cqw 0 1.6cqw;border:.25cqw solid var(--ink);background:#efe8da}

/* 5 사실 상자 */
.x2 .x-facts{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 3cqw;font:400 2.7cqw/1.45 var(--sans);border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink);padding:2.4cqw 0;margin:2.4cqw 0}
.x2 .x-facts dt{font:600 2.3cqw/1.6 var(--mono);color:var(--mute);letter-spacing:.08em}
.x2 .x-facts dd{margin:0;font-weight:500}
.x2 .x-say{font:900 6.6cqw/1.3 var(--serif);letter-spacing:-.03em;margin:1cqw 0 3cqw;word-break:keep-all}
.x2 .x-say em{font-style:normal;color:var(--cy2)}

/* 8 연표 */
.x2 .x-tl{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.x2 .x-tl::before{content:"";position:absolute;left:19.2cqw;top:1cqw;bottom:1cqw;width:.5cqw;background:var(--ink)}
.x2 .x-tl li{display:grid;grid-template-columns:17cqw 1fr;gap:5cqw;padding:1.15cqw 0;position:relative}
.x2 .x-tl li::before{content:"";position:absolute;left:18cqw;top:2.2cqw;width:2.9cqw;height:2.9cqw;border-radius:50%;background:var(--paper);border:.5cqw solid var(--ink)}
.x2 .x-tl li.rm::before{background:var(--cy);border-color:var(--ink)}
.x2 .x-tl li.end::before{background:var(--red)}
.x2 .x-tl b{font:600 2.5cqw/1.5 var(--mono);text-align:right;white-space:nowrap}
.x2 .x-tl span{font:500 2.9cqw/1.45 var(--sans);word-break:keep-all}
.x2 .x-tl small{display:block;font-size:2.4cqw;color:var(--mute);font-weight:400}
.x2 .x-key{display:flex;gap:4cqw;font:400 2.3cqw/1 var(--sans);color:var(--mute);margin-top:2cqw}
.x2 .x-key i{display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;border:.4cqw solid var(--ink);vertical-align:-.3cqw;margin-right:1cqw}

/* 10 곡 목록 */
.x2 .x-tracks{list-style:none;margin:2cqw 0;padding:0;counter-reset:t}
.x2 .x-tracks li{display:grid;grid-template-columns:9cqw 1fr;align-items:baseline;padding:1.5cqw 0;border-bottom:.2cqw solid var(--rule)}
.x2 .x-tracks li::before{counter-increment:t;content:"0" counter(t);font:400 3.8cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-tracks li b{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-tracks li small{display:block;font:400 2.5cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-tracks li.hl b{color:var(--red)}

/* 11 끝 */
.x2 .x-when{background:var(--ink);color:#f4efe6;padding:3.4cqw 3.8cqw;margin:2cqw 0;font:500 3.1cqw/1.55 var(--sans)}
.x2 .x-when b{display:block;font:600 2.3cqw/1 var(--mono);letter-spacing:.14em;color:#9fe0f2;margin-bottom:1.6cqw}
.x2 .x-wx{font:italic 400 4cqw/1.35 var(--it);color:var(--mute);border-left:.6cqw solid var(--cy);padding-left:3cqw}

/* 12 밤 */
.x2.x-dark{background:var(--night);color:#e8edf2}
.x2.x-dark::after{opacity:.25;mix-blend-mode:screen}
.x2.x-dark .x-rh,.x2.x-dark .x-folio{color:#8b97a8;border-color:rgba(232,237,242,.2)}
.x2.x-dark .x-rh b{color:#9fe0f2}
.x2 .x-clock{font:400 22cqw/1 var(--slab);letter-spacing:-.04em;color:#9fe0f2;margin:0}
.x2 .x-meta{display:grid;grid-template-columns:auto 1fr;gap:1cqw 3cqw;font:400 2.8cqw/1.45 var(--sans);margin:2cqw 0 3cqw;color:#c9d2dd}
.x2 .x-meta dt{font:600 2.3cqw/1.65 var(--mono);color:#8b97a8;letter-spacing:.1em}
.x2 .x-meta dd{margin:0}
.x2.x-dark .x-txt{color:#dfe5ec}
.x2 .x-three{list-style:none;margin:0 0 2.4cqw;padding:0;border-top:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li{display:flex;gap:3cqw;align-items:baseline;padding:2cqw 0;border-bottom:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li b{font:400 3.4cqw/1 var(--slab);color:#9fe0f2}
.x2 .x-three li span{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-three li small{margin-left:auto;font:400 2.3cqw/1.3 var(--mono);color:#8b97a8;text-align:right}

/* 13 연재 */
.x2.x-pinkp{background:#f7e9ea}
.x2 .x-ser{display:flex;align-items:flex-end;gap:3cqw}
.x2 .x-ser b{font:400 17cqw/.85 var(--slab);color:var(--pink);-webkit-text-stroke:.35cqw var(--ink)}
.x2 .x-ser span{font:600 2.5cqw/1.5 var(--mono);letter-spacing:.12em;color:var(--mute);padding-bottom:1cqw}

/* 14 앞줄 */
.x2 .x-front{display:inline-block;background:#ffe14d;color:var(--ink);font:900 5.2cqw/1 var(--sans);padding:1.6cqw 3cqw;transform:rotate(-3deg);box-shadow:.6cqw .6cqw 0 var(--ink);margin-bottom:2.4cqw}
.x2 .x-band{border-top:.6cqw solid var(--ink);padding:2cqw 0 1.4cqw}
.x2 .x-band h3{margin:0;font:900 4.6cqw/1.2 var(--serif);letter-spacing:-.02em}
.x2 .x-band h3 small{font:500 2.7cqw/1 var(--sans);color:var(--mute);margin-left:1.4cqw;letter-spacing:0}
.x2 .x-band p{margin:1cqw 0 0;font:400 2.9cqw/1.6 var(--sans);word-break:keep-all}
.x2 .x-live{background:#ece5d6;padding:2.6cqw 3.4cqw 0;margin-top:1.6cqw}
.x2 .x-live .x-kick{color:var(--red)}
.x2 .x-live .x-txt li{font-size:2.6cqw;padding:1.4cqw 0}

/* 15 편집 노트 */
.x2 .x-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:3cqw 0;border-top:.6cqw solid var(--ink)}
.x2 .x-nums div{padding:2.6cqw 1cqw 2.4cqw;border-bottom:.2cqw solid var(--rule);border-right:.2cqw solid var(--rule)}
.x2 .x-nums div:nth-child(3n){border-right:0}
.x2 .x-nums b{display:block;font:400 9cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-nums span{display:block;font:500 2.5cqw/1.4 var(--sans);margin-top:1.2cqw;word-break:keep-all}
.x2 .x-colo{margin-top:auto;font:400 2.4cqw/1.7 var(--mono);color:var(--mute);border-top:.2cqw solid var(--rule);padding-top:2.4cqw}
.x2 .x-colo b{color:var(--ink);font-weight:600}

/* 16 부록 싱글 (single7 구조는 mag.js가 LP 그림으로 바꿔 끼운다) */
.x2 .single7{position:absolute;width:var(--w);aspect-ratio:1;transform:rotate(var(--r));cursor:pointer}
.x2 .single7 .sl{position:absolute;inset:0;background:#d4bf9e}
.x2 .single7 .bg{position:absolute;inset:-4% -4% -7%}
.x2 .single7 .tp{position:absolute;height:calc(var(--w)*.16);background:rgba(255,248,214,.55);border-left:1px dashed rgba(200,190,150,.6);border-right:1px dashed rgba(200,190,150,.6)}
.x2 .single7 .c2{position:absolute;left:-4cqw;right:-4cqw;top:calc(100% + 3cqw);text-align:center;font:700 3cqw/1.4 var(--sans);color:var(--ink)}
.x2 .single7 .c2 small{display:block;color:var(--mute);font-weight:400;font-size:2.5cqw}
.x2 .x-lpl{list-style:none;margin:2cqw 0 0;padding:0;columns:2;column-gap:5cqw}
.x2 .x-lpl li{break-inside:avoid;padding:1.2cqw 0;border-top:.2cqw solid var(--rule);font:400 2.5cqw/1.35 var(--sans)}
.x2 .x-lpl li b{display:block;font:600 2.2cqw/1.3 var(--mono);color:var(--cy2)}
.x2 .x-lpl li i{font:italic 400 3.6cqw/1.15 var(--it)}

/* ── 읽기 모드 (mag.js 읽기 창 안) ── */
.x2r{font-family:var(--serif);color:var(--rd-ink)}
.x2r :is(h1,h2){text-align:left}
.x2r .rhead{margin:0 0 1.8em;padding-bottom:1.2em;border-bottom:3px solid var(--rd-ink)}
.x2r h1{font:900 1.65em/1.3 var(--serif);letter-spacing:-.03em;margin:0;word-break:keep-all}

<template class="pg"><div class="x2" data-art="letter" data-at="a">

    <h2 class="x-h2" style="margin-top:1.4cqw">월요일이 아닌데 나왔다</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="a.1">이번 호는 월요일이 아니라 토요일에 나온다. 월요일은 한 주 중 가장 무거운 날이라 우리가 그날 나온다고 창간 선언에 거창하게 써 놓고, 토요일에 한 권을 더 낸다. 독자 한 분이 세 잡지를 한꺼번에 보고 싶다고 했다. 편집장이라는 사람은 이런 부탁 앞에서 원칙을 읊다가 결국 원고를 쓴다. 나도 그렇다. 정기 호는 순번대로 그대로 나온다.</p><p data-p="a.2">커버는 시카고 밴드 슬립워크(Sleepwalk)의 네 번째 정규 <span class="alb">[View From The Outside]</span>다. 일리노이 시골 마을의 스튜디오에서 열이틀 만에 녹음한 판이다. 그 스튜디오 주인이 90년대에 내 방 벽을 울리던 밴드의 기타리스트라서, 솔직히 말하면 커버를 고를 때 마음이 조금 기울었다. 그래도 고른 이유는 그것만이 아니다. 이 판은 방 하나가 밴드 소리에 무엇을 하는지 묻게 만드는 판이고, 우리 연재 이름이 마침 '방'이다.</p></div>
    <button type="button" class="x-more" data-read="letter" data-at="a.1"><i>▶</i> 계속 읽기</button>
  </div>
  <div class="x-folio"><span>2</span><span>편집장의 글</span></div>
</div></template>

    <h2 class="x-h2" style="margin-top:1.4cqw">10년 만의 크릴, 마침내 나온 웨이브스</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="b0.1">크릴 <span class="alb">[Secret Language]</span> (Exploding In Sound). 보스턴 DIY 신에서 2010년에 결성해 2015년에 해산한 3인조가 10년 만에 낸 정규다. 2020년 멤버들이 낸 노트(Knot)의 앨범은 이후 스트리밍에서 크릴의 판으로 이름이 바뀌었다. 지금은 조나 퍼먼, 이언 베커에 새 멤버 앤드루 클링크먼이 시카고에서 활동한다. 아홉 곡이고, 타이틀곡에 대해 퍼먼은 아들을 재우는 이야기라고 했다. 처음 몇 절의 가사를 그림책 『잘 자요, 달님』을 거꾸로 읽은 것으로 썼다고 한다.</p><p class="note" data-p="b0.2">이럴 때 들을 것: 아이를 재우고 나서 겨우 내 시간이 생긴 밤.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="s1.1"><span class="alb">[View From The Outside]</span>는 11월 13일에 나왔다. 슬립워크의 네 번째 정규이고, 앞선 정규 이후 5년 만이다. 레이블은 MNRK Heavy, 이 밴드가 MNRK에서 내는 첫 판이다. 곡은 열 개. 'Point Break'로 열고 'Pushback'으로 닫는다.</p><p data-p="s1.2">녹음은 일리노이 톨로노의 어스 아날로그(Earth Analog)에서 했다. 열이틀 걸렸다. 그 스튜디오 주인이 험(Hum)의 기타리스트이자 보컬 맷 탤벗이다. 프로듀서는 잭 몬테즈인데, 위르(Whirr)와 클로크룸 작업으로 이름이 알려졌고 슬립워크의 전작 <span class="alb">[Underneath The Shade]</span>도 맡았던 사람이다.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="s2.1">밴드 소개 자료에 따르면 슬립워크는 2015년 시카고에서 시작했다. 2021년 4월 30일 세 번째 정규 <span class="alb">[Underneath The Shade]</span>를 냈다. 그 판을 낼 무렵 바깥 매체들은 이들을 멜로딕한 슈게이즈 얼터너티브 록 밴드라고 불렀다.</p><p data-p="s2.2">2024년에는 EP <span class="alb">[Out Of Focus]</span>를 냈다. 미국 음악 매체 스테레오검은 그때 이 밴드를 슈게이즈와 포스트하드코어를 다급하게 섞는 팀이라고 소개하며, 밴드가 스스로를 '가벼운 마음을 위한 무거운 음악'이라고 부른다고 옮겼다. 솔직히 이 문장은 마음에 든다. 마케팅 문구 중에 이렇게 겸손한 건 드물다.</p></div>

<template class="pg"><div class="x2" data-art="cover" data-at="s3">
  <div class="x-rh"><b>커버 스토리</b><span>feedback vol.03</span></div>
  <div class="x-in">

    <h2 class="x-h2" style="margin-top:1.4cqw">험의 방</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s3.1">어스 아날로그 이야기를 하려면 험부터 해야 한다. 험은 일리노이 섐페인의 4인조다. 대략 1990년에 결성해 지역 레이블 12-Inch Records에서 독립 앨범 두 장을 내고, 1994년 메이저 레이블 RCA와 계약했다. 멤버는 제프 딤프시, 팀 래시, 브라이언 세인트 피어, 맷 탤벗.</p><p data-p="s3.2">그 뒤 험은 오래 조용했다. 2018년 자기들 레이블 어스 아날로그 레코즈에서 <span class="alb">[Downward is Heavenward]</span>를 LP 두 장으로 다시 냈고, 2020년 6월 23일 1998년 이후 처음으로 새 곡을 담은 <span class="alb">[Inlet]</span>을 냈다. <span class="alb">[Inlet]</span>은 어스 아날로그와 ELL에서 녹음했고, 엔지니어로 탤벗과 래시, 제임스 트라이클러의 이름이 올라 있다. 믹스는 래시가 했다.</p></div>
    <button type="button" class="x-more" data-read="cover" data-at="s3.1"><i>▶</i> 계속 읽기</button>
  </div>

</div></template>
<template class="pg"><div class="x2" data-art="cover" data-at="s4">
  <div class="x-rh"><b>커버 스토리</b><span>feedback vol.03</span></div>
  <div class="x-in">
    <div class="x-kick">커버 스토리</div>
    <h2 class="x-h2" style="margin-top:1.4cqw">열이틀</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s4.1">그 방의 소리에 대해 내가 아는 건 남이 한 말뿐이다. 한 엔지니어는 섐페인·어배너 지역 매체 인터뷰에서 탤벗에게 메일을 보내 어스 아날로그에서 작업해도 되겠냐고 물었던 일을 자기 경력의 전환점으로 꼽았다. 그는 그곳 테이프 머신이 깨끗한 편이고, 초당 15인치로 돌리면 소리의 날카로운 앞머리를 살짝 눌러 주고 저음을 두툼하게 만든다고 설명했다. 이번 판이 그 테이프를 거쳤는지는 확인하지 못했다. 그 방에 그런 기계가 있다는 것까지만 적는다.</p><p data-p="s4.2">열이틀은 짧지 않다. 그렇다고 넉넉하지도 않다. 정규 열 곡을 열이틀에 녹음하려면 밴드가 곡을 다 알고 들어가야 한다. 이건 내 추측이 아니라 산수다. 하루에 한 곡 조금 넘는다.</p></div>

  </div>

    <h2 class="x-h2" style="margin-top:1.4cqw">곡 순서로 읽기</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s5.1">판의 곡 목록은 이렇다. 'Point Break', 'Sandbox', 'In Flames', 'Suckerfish', 'Jan 22', 'The Lighthouse', 'Cold Front', 'Shell', 'Dreamlessness', 'Pushback'. 싱글은 세 곡이 먼저 나왔다. 9월 8일 'Sandbox', 10월 6일 'Jan 22', 11월 10일 'Shell'. 판의 2번, 5번, 8번이다. 세 곡 간격으로 하나씩 박아 둔 셈이다.</p><p data-p="s5.2">레이블과 매체의 설명을 모으면 이 판의 방향은 하나로 모인다. 슈게이즈와 90년대 얼터너티브 록이라는 기반에서 포스트하드코어 쪽으로 더 나갔다는 것. 발매 소개 글은 기준점으로 험, 페일리어(Failure), 퀵샌드를 꼽았다. 한 음악 매체는 이 판이 감정적 고립, 불확실함, 내가 아는 나와 남이 보는 나 사이의 차이를 다룬다고 정리했다. 판 제목 '바깥에서 본 풍경'과 그대로 겹친다.</p></div>

    <h2 class="x-h2" style="margin-top:1.4cqw">아쉬움에 대하여</h2>
    <div class="x-txt" style="margin-top:3cqw"><p data-p="s6.1">불평 하나 하겠다. 레이블은 이 밴드를, 영국 뉴웨이브 대신 미국 하드코어에서 진화한 더 큐어 같다고 소개한다. 레이블 홍보팀은 왜 늘 신인을 전설 두 개의 합성으로만 설명하나. 열 곡짜리 판을 내는 밴드한테 이건 칭찬이 아니라 숙제다. 판을 사기도 전에 비교부터 하게 만든다.</p><p data-p="s6.2">그리고 진짜 아쉬운 점. 이번 판 소개 글은 기준점 밴드 이름을 일곱 개쯤 줄줄이 늘어놓는다. 위르, 낫싱, 험, 페일리어, 퀵샌드, 내로 헤드, 스매싱 펌킨스. 밴드가 스스로 그런 계보를 원한 건지, 홍보 문구가 그렇게 만든 건지 우리는 모른다. 다만 이 판의 크레딧(어느 방, 어느 프로듀서)이 그 긴 목록보다 이 밴드를 더 잘 설명한다는 건 안다.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="s7.1">feedback은 밴드를 한 방의 소리라고 믿는다. 슬립워크가 지키는 건 그 믿음의 가장 문자 그대로인 버전이다. 같은 프로듀서, 좋아하는 밴드의 방, 짧고 굵은 일정. 그리고 투어. 이 판을 들고 11월 12일 시카고에서 시작해 12월까지 텍사스와 캘리포니아를 도는 일정을 잡았다.</p><p data-p="s7.2">'가벼운 마음을 위한 무거운 음악'이라는 자기소개도 지키는 것 목록에 넣겠다. 고립과 불편함에 대한 판을 내면서도 이 밴드는 스스로를 무겁게 포장하지 않는다. 나처럼 투덜대는 아재가 할 말이 별로 없어지는 태도다.</p></div>

    <div class="x-txt" style="margin-top:3cqw"><p data-p="r0.1">지난 회는 빅 핑크였다. 앨범에 이름만 주고 정작 녹음은 다른 데서 한 방. 그때 다음 회는 거실이라고 예고했다. 약속대로 거실이다. 그리즐리 베어(Grizzly Bear)의 2006년 앨범 <span class="alb">[Yellow House]</span>, 보컬 에드 드로스트의 어머니 집 거실이다.</p><p data-p="r1.1">기록부터. <span class="alb">[Yellow House]</span>는 그리즐리 베어가 드로스트, 대니얼 로슨, 크리스 테일러, 크리스토퍼 베어 네 명으로 만든 첫 앨범이다. 원래 그리즐리 베어는 드로스트 혼자 쓰던 이름이었고, 이 판에서 밴드가 됐다. 베이스와 여러 관악기를 맡은 테일러가 프로듀서를 했다. 앨범 제목은 녹음 대부분이 이뤄진 드로스트 어머니 집에서 왔다. 집은 실제로 노랗다고, 2006년 빌리지 보이스 기사가 굳이 확인해 줬다.</p></div>

<template class="art" data-id="letter" data-title="월요일이 아닌데 나왔다"><div class="x2r"><header class="rhead"><h1>월요일이 아닌데 나왔다</h1><p class="by">글 노암 갤러거</p></header><span data-p="a"></span><p data-p="a.1">이번 호는 월요일이 아니라 토요일에 나온다. 월요일은 한 주 중 가장 무거운 날이라 우리가 그날 나온다고 창간 선언에 거창하게 써 놓고, 토요일에 한 권을 더 낸다. 독자 한 분이 세 잡지를 한꺼번에 보고 싶다고 했다. 편집장이라는 사람은 이런 부탁 앞에서 원칙을 읊다가 결국 원고를 쓴다. 나도 그렇다. 정기 호는 순번대로 그대로 나온다.</p><p data-p="a.2">커버는 시카고 밴드 슬립워크(Sleepwalk)의 네 번째 정규 <span class="alb">[View From The Outside]</span>다. 일리노이 시골 마을의 스튜디오에서 열이틀 만에 녹음한 판이다. 그 스튜디오 주인이 90년대에 내 방 벽을 울리던 밴드의 기타리스트라서, 솔직히 말하면 커버를 고를 때 마음이 조금 기울었다. 그래도 고른 이유는 그것만이 아니다. 이 판은 방 하나가 밴드 소리에 무엇을 하는지 묻게 만드는 판이고, 우리 연재 이름이 마침 '방'이다.</p><span data-p="b"></span><p data-p="b.1">지난 호에서 갚겠다고 한 것 하나는 갚았다. 웨이브스의 <span class="alb">[Cherry Soda]</span>가 몇 번을 미룬 끝에 정말 나왔다. 다른 하나, 브레인스토리 <span class="alb">[Shoebox Days]</span>의 녹음 크레딧은 아직 확인하지 못했다. 다음 호로 또 넘긴다. 미안하다는 말은 한 번만 하겠다.</p><p data-p="b.2">앞줄은 이번에도 두 팀이다. 세 팀을 약속해 놓고 두 번 연속 못 채웠다. 출처 두 곳 기준을 낮추면 세 팀은 금방이다. 안 낮췄다. 그게 이 잡지의 몇 안 되는 자랑이다.</p></div></template>
<template class="art" data-id="briefs" data-title="이번 주 밴드"><div class="x2r"><header class="rhead"><h1>이번 주 밴드</h1><p class="by">글 편집부</p></header><span data-p="b0"></span><p data-p="b0.1">크릴 <span class="alb">[Secret Language]</span> (Exploding In Sound). 보스턴 DIY 신에서 2010년에 결성해 2015년에 해산한 3인조가 10년 만에 낸 정규다. 2020년 멤버들이 낸 노트(Knot)의 앨범은 이후 스트리밍에서 크릴의 판으로 이름이 바뀌었다. 지금은 조나 퍼먼, 이언 베커에 새 멤버 앤드루 클링크먼이 시카고에서 활동한다. 아홉 곡이고, 타이틀곡에 대해 퍼먼은 아들을 재우는 이야기라고 했다. 처음 몇 절의 가사를 그림책 『잘 자요, 달님』을 거꾸로 읽은 것으로 썼다고 한다.</p><p class="note" data-p="b0.2">이럴 때 들을 것: 아이를 재우고 나서 겨우 내 시간이 생긴 밤.</p><span data-p="b1"></span><p data-p="b1.1">웨이브스 <span class="alb">[Cherry Soda]</span> (I Surrender Records). 11월 13일에 나왔다. 처음엔 다른 밴드와 함께 내는 공동 앨범으로 7월에 발표됐고 발매일은 9월 18일이었다. 협업이 무산된 뒤 네이선 윌리엄스가 스튜디오로 돌아가 웨이브스 단독 앨범으로 다시 녹음했고, 발매일은 10월 30일을 거쳐 11월 13일로 밀렸다. 곡은 열두 곡이 됐고, 발매 전 마지막 싱글은 'We Get Around'였다. 윌리엄스는 이 판을 2000년대 초 쇼핑몰 에모 음반처럼 만들고 싶었다고 말했다.</p><p class="note" data-p="b1.2">이럴 때 들을 것: 열세 살 때 듣던 밴드 티셔츠를 아직 버리지 못한 날.</p></div></template>
<template class="art" data-id="cover" data-title="바깥에서 본 풍경 — 슬립워크"><div class="x2r"><header class="rhead"><h1>바깥에서 본 풍경 — 슬립워크</h1><p class="by">글 노암 갤러거</p></header><span data-p="s0"></span><p data-p="s0.1">이건 내가 그려 본 장면이다. 1월 22일, 시카고. 밴드 연습이 끝났고 눈이 온다. 한 사람이 기타 케이스를 메고 집까지 걸어간다. 지하철을 타도 되는데 걷는다(시카고 사람들은 이상하게 눈 오는 날 걷는다). 머릿속에서 방금 연습실에서 친 리프가 맴돈다. 집에 도착할 때쯤 그 리프는 노래가 되어 있다.</p><p data-p="s0.2">이 장면에서 사실은 딱 하나다. 슬립워크의 신곡 'Jan 22'는 밴드 연습을 마치고 눈 오는 길을 걸어 집에 가는 동안 쓴 곡이라고, 발매 소개 글에 적혀 있다. 나머지 지하철이니 리프니 하는 건 내가 지어 붙인 거다. 눈 오는 날 걸어서 집에 가 본 사람이라면 대충 맞을 거라고 우기겠다.</p><h2 data-p="s1">왜 지금</h2><p data-p="s1.1"><span class="alb">[View From The Outside]</span>는 11월 13일에 나왔다. 슬립워크의 네 번째 정규이고, 앞선 정규 이후 5년 만이다. 레이블은 MNRK Heavy, 이 밴드가 MNRK에서 내는 첫 판이다. 곡은 열 개. 'Point Break'로 열고 'Pushback'으로 닫는다.</p><p data-p="s1.2">녹음은 일리노이 톨로노의 어스 아날로그(Earth Analog)에서 했다. 열이틀 걸렸다. 그 스튜디오 주인이 험(Hum)의 기타리스트이자 보컬 맷 탤벗이다. 프로듀서는 잭 몬테즈인데, 위르(Whirr)와 클로크룸 작업으로 이름이 알려졌고 슬립워크의 전작 <span class="alb">[Underneath The Shade]</span>도 맡았던 사람이다.</p><p data-p="s1.3">이번 주 밴드 신보 목록에는 이름 큰 판도 꽤 있었다. 그런데 이 판을 커버로 올린 건, 판 하나에 '방'과 '사람'과 '시간'이 이렇게 또렷하게 적혀 있는 경우가 드물어서다. 어느 방에서, 누구와, 며칠 동안. 우리 잡지가 밴드를 읽는 방식이 딱 그 세 칸이다.</p><h2 data-p="s2">시카고, 2015년</h2><p data-p="s2.1">밴드 소개 자료에 따르면 슬립워크는 2015년 시카고에서 시작했다. 2021년 4월 30일 세 번째 정규 <span class="alb">[Underneath The Shade]</span>를 냈다. 그 판을 낼 무렵 바깥 매체들은 이들을 멜로딕한 슈게이즈 얼터너티브 록 밴드라고 불렀다.</p><p data-p="s2.2">2024년에는 EP <span class="alb">[Out Of Focus]</span>를 냈다. 미국 음악 매체 스테레오검은 그때 이 밴드를 슈게이즈와 포스트하드코어를 다급하게 섞는 팀이라고 소개하며, 밴드가 스스로를 '가벼운 마음을 위한 무거운 음악'이라고 부른다고 옮겼다. 솔직히 이 문장은 마음에 든다. 마케팅 문구 중에 이렇게 겸손한 건 드물다.</p><p data-p="s2.3">멤버는 넷이다. 레이블 소개와 한 음악 매체 기사를 맞춰 보면, 2015년 밴드를 만든 라이언 데이비스가 보컬과 기타를 맡고, 기타의 타일러 가굴라가 2023년에 들어왔다. 드럼 마커스 존슨과 베이스 빅 오르도네스가 2025년에 합류하면서 지금 진용이 됐다. 레이블은 멤버 구성이 크게 바뀌었다고 적었다. 그러니까 이번 판은 지금의 넷이 함께 낸 첫 정규다.</p><p data-p="s2.4">같은 해 여름 MNRK와 계약했다. 그사이 글래스조, 서스데이, 낫싱 같은 밴드와 무대를 함께했다고 레이블은 소개한다. 가굴라는 첫 싱글 'Sandbox'에서 비명 섞인 백보컬도 맡았다. 나 같은 아재는 이런 대목에서 계산을 한다. 정규 사이 5년, 그중 2년은 새 멤버를 맞추는 데 썼다는 얘기다. 그 시간을 버틴 밴드라면 열이틀짜리 녹음은 오히려 짧게 느껴졌을 것이다.</p><h2 data-p="s3">험의 방</h2><p data-p="s3.1">어스 아날로그 이야기를 하려면 험부터 해야 한다. 험은 일리노이 섐페인의 4인조다. 대략 1990년에 결성해 지역 레이블 12-Inch Records에서 독립 앨범 두 장을 내고, 1994년 메이저 레이블 RCA와 계약했다. 멤버는 제프 딤프시, 팀 래시, 브라이언 세인트 피어, 맷 탤벗.</p><p data-p="s3.2">그 뒤 험은 오래 조용했다. 2018년 자기들 레이블 어스 아날로그 레코즈에서 <span class="alb">[Downward is Heavenward]</span>를 LP 두 장으로 다시 냈고, 2020년 6월 23일 1998년 이후 처음으로 새 곡을 담은 <span class="alb">[Inlet]</span>을 냈다. <span class="alb">[Inlet]</span>은 어스 아날로그와 ELL에서 녹음했고, 엔지니어로 탤벗과 래시, 제임스 트라이클러의 이름이 올라 있다. 믹스는 래시가 했다.</p><p data-p="s3.3">그러니까 어스 아날로그는 레이블 이름이자 방 이름이다. 22년 만의 새 앨범을 그 방에서 만든 밴드가, 이번엔 그 방을 다른 밴드에게 열어 준 셈이다. 나 같은 사람은 이런 대목에서 괜히 목이 멘다. 메이저 계약하고, 사라지고, 22년 뒤에 자기 방에서 돌아온 밴드. 그리고 그 방에 시카고에서 온 젊은 밴드가 짐을 푼다.</p><blockquote class="pull" data-p="s3.4">레이블 이름이자 방 이름. 그 방이 이번엔 다른 밴드에게 열렸다.</blockquote><h2 data-p="s4">열이틀</h2><p data-p="s4.1">그 방의 소리에 대해 내가 아는 건 남이 한 말뿐이다. 한 엔지니어는 섐페인·어배너 지역 매체 인터뷰에서 탤벗에게 메일을 보내 어스 아날로그에서 작업해도 되겠냐고 물었던 일을 자기 경력의 전환점으로 꼽았다. 그는 그곳 테이프 머신이 깨끗한 편이고, 초당 15인치로 돌리면 소리의 날카로운 앞머리를 살짝 눌러 주고 저음을 두툼하게 만든다고 설명했다. 이번 판이 그 테이프를 거쳤는지는 확인하지 못했다. 그 방에 그런 기계가 있다는 것까지만 적는다.</p><p data-p="s4.2">열이틀은 짧지 않다. 그렇다고 넉넉하지도 않다. 정규 열 곡을 열이틀에 녹음하려면 밴드가 곡을 다 알고 들어가야 한다. 이건 내 추측이 아니라 산수다. 하루에 한 곡 조금 넘는다.</p><p data-p="s4.3">잭 몬테즈와의 재회도 짚어 둔다. 전작을 맡았던 프로듀서와 5년 만에 다시 만났다. 레이블이 바뀌고 녹음 장소가 바뀌어도, 소리를 붙잡는 사람은 그대로 둔 것이다. 밴드가 무엇을 바꾸고 무엇을 지켰는지는 이 한 줄에 다 들어 있다.</p><h2 data-p="s5">곡 순서로 읽기</h2><p data-p="s5.1">판의 곡 목록은 이렇다. 'Point Break', 'Sandbox', 'In Flames', 'Suckerfish', 'Jan 22', 'The Lighthouse', 'Cold Front', 'Shell', 'Dreamlessness', 'Pushback'. 싱글은 세 곡이 먼저 나왔다. 9월 8일 'Sandbox', 10월 6일 'Jan 22', 11월 10일 'Shell'. 판의 2번, 5번, 8번이다. 세 곡 간격으로 하나씩 박아 둔 셈이다.</p><p data-p="s5.2">레이블과 매체의 설명을 모으면 이 판의 방향은 하나로 모인다. 슈게이즈와 90년대 얼터너티브 록이라는 기반에서 포스트하드코어 쪽으로 더 나갔다는 것. 발매 소개 글은 기준점으로 험, 페일리어(Failure), 퀵샌드를 꼽았다. 한 음악 매체는 이 판이 감정적 고립, 불확실함, 내가 아는 나와 남이 보는 나 사이의 차이를 다룬다고 정리했다. 판 제목 '바깥에서 본 풍경'과 그대로 겹친다.</p><p data-p="s5.3">판의 뒷부분은 조금 다른 쪽으로 간다고 한다. 같은 기사에 따르면 몬테즈가 전자음 프로덕션에 관심이 많아 이번엔 편곡이 더 실험적으로 갔고, 판의 후반부가 더 사적이고 실험적인 곡들로 기운다. 가굴라는 마지막 곡에서 트립합의 영향을 짚었다. 'Pushback'이다. 포스트하드코어 쪽으로 더 나갔다는 판이 트립합으로 닫힌다는 것, 이 대목에서 나는 이 밴드가 홍보 문구보다 넓다는 걸 안다(들어 보지 않고도 안다고 우기는 게 아니다. 멤버가 그렇게 말했다).</p><p data-p="s5.4">'Shell'에 대해 데이비스는 사람들 곁에 있고 싶으면서도 사람들 사이에 있으면 불편한 마음, 나이가 들면서 조금씩 닫혀 간 자신을 썼다고 말했다. 첫 싱글 'Sandbox'는 요즘의 정치적 사고방식에 대한 그의 답답함에서 나온 곡이라고 한다. 그 매체 필자는 데이비스가 자기 안의 버릇을 알아본다고 해서 그 문제가 풀리는 척하지 않는다는 점을 짚었다. 나는 이 대목이 이 판 전체에 대한 가장 정직한 소개라고 생각한다.</p><h2 data-p="s6">아쉬움에 대하여</h2><p data-p="s6.1">불평 하나 하겠다. 레이블은 이 밴드를, 영국 뉴웨이브 대신 미국 하드코어에서 진화한 더 큐어 같다고 소개한다. 레이블 홍보팀은 왜 늘 신인을 전설 두 개의 합성으로만 설명하나. 열 곡짜리 판을 내는 밴드한테 이건 칭찬이 아니라 숙제다. 판을 사기도 전에 비교부터 하게 만든다.</p><p data-p="s6.2">그리고 진짜 아쉬운 점. 이번 판 소개 글은 기준점 밴드 이름을 일곱 개쯤 줄줄이 늘어놓는다. 위르, 낫싱, 험, 페일리어, 퀵샌드, 내로 헤드, 스매싱 펌킨스. 밴드가 스스로 그런 계보를 원한 건지, 홍보 문구가 그렇게 만든 건지 우리는 모른다. 다만 이 판의 크레딧(어느 방, 어느 프로듀서)이 그 긴 목록보다 이 밴드를 더 잘 설명한다는 건 안다.</p><p data-p="s6.3">그래도. 이 밴드는 5년 동안 정규를 내지 않았고, 그 사이 EP 한 장으로 버텼고, 결국 자기들이 좋아하는 밴드의 방에 들어가 열이틀 만에 판을 끝냈다. 비교당할 각오는 이미 한 사람들이다.</p><h2 data-p="s7">이 밴드가 지키는 것</h2><p data-p="s7.1">feedback은 밴드를 한 방의 소리라고 믿는다. 슬립워크가 지키는 건 그 믿음의 가장 문자 그대로인 버전이다. 같은 프로듀서, 좋아하는 밴드의 방, 짧고 굵은 일정. 그리고 투어. 이 판을 들고 11월 12일 시카고에서 시작해 12월까지 텍사스와 캘리포니아를 도는 일정을 잡았다.</p><p data-p="s7.2">'가벼운 마음을 위한 무거운 음악'이라는 자기소개도 지키는 것 목록에 넣겠다. 고립과 불편함에 대한 판을 내면서도 이 밴드는 스스로를 무겁게 포장하지 않는다. 나처럼 투덜대는 아재가 할 말이 별로 없어지는 태도다.</p><h2 data-p="s8">다시, 눈 오는 길</h2><p data-p="s8.1">처음 장면으로 돌아간다. 다시 말하지만 내가 그려 본 장면이다. 1월 22일 눈 오는 시카고, 연습을 마친 사람이 기타를 메고 걷는다. 그 노래는 언젠가 섐페인 근처 시골 마을의 남의 방에서 녹음된다. 그리고 11월, 판이 되어 우리한테 왔다.</p><p data-p="s8.2">바깥에서 본 풍경이라는 제목이 좀 쓸쓸하다고 생각했는데, 이렇게 적고 보니 꼭 그렇지도 않다. 바깥에서 걸어야 보이는 풍경도 있다. 눈 오는 길 같은 거.</p><p data-p="s8.3">내가 그려 넣은 그날 시카고의 날씨: 눈, 바람 조금, 걷기엔 미친 짓.</p></div></template>
<template class="art" data-id="night" data-title="이 판과 어울리는 밤 — 연습 끝난 밤"><div class="x2r"><header class="rhead"><h1>이 판과 어울리는 밤 — 연습 끝난 밤</h1><p class="by">글 노암 갤러거</p></header><span data-p="n0"></span><p data-p="n0.1">이것도 상상이다. 화요일 밤 아홉 시, 합주실 문을 잠그고 나온다. 장비는 두고 왔고 기타만 멨다. 오늘 맞춘 곡이 하나 있는데 아무도 잘 됐다는 말을 안 했다. 그런 밤이 있다. 다 같이 됐다는 걸 아는데 아무도 말을 안 하는 밤.</p><p data-p="n0.2">이 판은 그런 밤 집에 가는 길에 이어폰으로 듣는 게 어울릴 것 같다. 'Jan 22'가 그런 길에서 쓰였다는 사실 하나만 믿고 하는 소리다. 첫 곡부터 끝까지, 열 곡이면 집 앞에 도착할 것이다(우리 집이 그렇게 멀진 않다).</p><span data-p="n1"></span><p data-p="n1.1">솔직히 말하면 나는 이어폰으로 슈게이즈 듣는 걸 싫어한다. 이런 음악은 방 하나를 가득 채워야 한다고 믿는 쪽이다. 그런데 집에 가는 길만큼은 예외로 하겠다. 걸으면서 듣는 판은 귀로 듣는 게 아니라 다리로 듣는다. 누가 한 말인지는 모르겠다. 아마 내가 방금 지어낸 말이다.</p><p data-p="n1.2">그날 밤의 날씨(상상): 맑음, 영하 3도, 입김이 보이는 정도.</p></div></template>
<template class="art" data-id="serial" data-title="연재 &#x27;방&#x27; 2회 — 노란 집, 거실"><div class="x2r"><header class="rhead"><h1>연재 '방' 2회 — 노란 집, 거실</h1><p class="by">글 노암 갤러거</p></header><span data-p="r0"></span><p data-p="r0.1">지난 회는 빅 핑크였다. 앨범에 이름만 주고 정작 녹음은 다른 데서 한 방. 그때 다음 회는 거실이라고 예고했다. 약속대로 거실이다. 그리즐리 베어(Grizzly Bear)의 2006년 앨범 <span class="alb">[Yellow House]</span>, 보컬 에드 드로스트의 어머니 집 거실이다.</p><span data-p="r1"></span><p data-p="r1.1">기록부터. <span class="alb">[Yellow House]</span>는 그리즐리 베어가 드로스트, 대니얼 로슨, 크리스 테일러, 크리스토퍼 베어 네 명으로 만든 첫 앨범이다. 원래 그리즐리 베어는 드로스트 혼자 쓰던 이름이었고, 이 판에서 밴드가 됐다. 베이스와 여러 관악기를 맡은 테일러가 프로듀서를 했다. 앨범 제목은 녹음 대부분이 이뤄진 드로스트 어머니 집에서 왔다. 집은 실제로 노랗다고, 2006년 빌리지 보이스 기사가 굳이 확인해 줬다.</p><p data-p="r1.2">그 거실에 대해 여러 사람이 비슷한 말을 남겼다. 빌리지 보이스는 드로스트가 처음엔 어머니 집에서 녹음하는 걸 걱정했지만, 한 달 동안 집을 봐 주면서 녹음한 경험이 오히려 편안한 분위기를 만들었다고 썼다. 한 음악 블로그는 집의 자연스러운 울림 덕에 그 집이 다섯 번째 멤버처럼 들리고, 귀 기울이면 삐걱거리는 소리도 들린다고 했다. 테일러는 시애틀 위클리 인터뷰에서, 어릴 때 자란 집에서 작업하면 온갖 기억이 어깨에 얹혀 있어서 조금 불편한 환경이었다고 말했다. 판 안의 곡 'Marla'는 드로스트 집안의 할머니뻘 친척(great-aunt)이 쓴 노래이고, 그 사람의 초상화가 집의 한 방에 걸려 있었다고 한다.</p><span data-p="r2"></span><p data-p="r2.1">그런데 이 거실은 기록이 엇갈린다. 녹음 시기를 위키백과는 2006년 7월로, 2007년 대학 신문 기사는 2005년 여름으로 적는다. 2006년 9월에 나온 판이니 나는 2005년 쪽이 맞을 거라고 생각하지만, 이건 내 추측이다. 집 주인도 어머니라는 기록과 할머니라는 옛 기록이 있다. 위치는 더하다. 대부분 케이프 코드라고 하는데, 보스턴의 한 주간지는 2007년에 보도 자료가 케이프 코드라고 했을 뿐 그 노란 집은 사실 워터타운에 있다고 썼다.</p><p data-p="r2.2">빅 핑크는 이름만 남기고 소리는 남기지 않은 방이었다. 노란 집은 그 반대다. 소리는 확실히 거기서 났는데, 그 집이 정확히 어디였는지가 흐릿하다. 그 집은 그 뒤 매물로 나왔다고 한다. 거실은 이제 남의 거실이다. 판에는 그 집이 계속 노랗게 남아 있다.</p><p data-p="r2.3">그날 거실의 날씨(상상): 뉴잉글랜드 여름, 습도 높음, 창문 다 열어 놓음.</p><p class="note" data-p="r2.4">다음 회 예고: 3회는 퀸스의 작업실 다이아몬드 마인. 지난 호 커버 브레인스토리가 그전 판을 녹음한 방이다. 녹음 크레딧이 확인되는 대로 쓴다.</p></div></template>
<template class="art" data-id="front" data-title="앞줄 — 첫 정규를 낸 두 팀"><div class="x2r"><header class="rhead"><h1>앞줄 — 첫 정규를 낸 두 팀</h1><p class="by">글 앞줄</p></header><span data-p="f0"></span><p data-p="f0.1">이번 주 앞줄은 첫 정규를 막 낸 두 팀이다. 같은 레이블(Pure Noise)에서 한 주 간격으로 나왔다! 세 팀을 채우지 못했다. 출처 두 곳을 확인할 수 있는 신인이 이번 주엔 이 두 팀뿐이었다.</p><span data-p="f1"></span><p data-p="f1.1">되 비자주(Deux Visages). 프랑스어로 '두 얼굴'. 2019년 마이애미에서 보컬 대프니 하노노가 예전 밴드 동료 앙투안 라팽의 메시지를 받고 시작한 밴드다. 지금은 필라델피아에 산다. 지금 소개 자료에 나오는 멤버는 하노노, 기타 잭 추, 베이스 토니 주뱅 셋이다. 첫 정규 <span class="alb">[Call It Goodbye]</span>는 11월 6일 퓨어 노이즈에서 나왔고 열한 곡이다. 마이애미에서 6주 동안, 밴드의 첫 싱글을 녹음했던 아르키 칼라와 함께 녹음했다. 앞서 낸 싱글 'Always You'는 어린 시절을 떠나보내는 마음을 다룬 곡이라고 한다.</p><span data-p="f2"></span><p data-p="f2.1">코머너(Commoner). 애리조나 소노란 사막 출신의 에모·얼터너티브 밴드다. 출신 도시는 매체에 따라 투손이라고도, 피닉스라고도 적혀 있어서 사막까지만 쓴다. 2025년 EP <span class="alb">[Change Of Heart]</span>를 냈고, 그해 10월 퓨어 노이즈와 계약하며 싱글 'Breach'를 냈다. 첫 정규 <span class="alb">[Former Self]</span>는 11월 13일에 나왔다. 레이블은 이들이 하드코어, 초기 메탈코어, 슈게이즈 쪽 밴드에 기대고 데이비드 린치 영화에서 영감을 얻는다고 소개한다.</p></div></template>
<template class="art" data-id="live" data-title="공연 소식"><div class="x2r"><header class="rhead"><h1>공연 소식</h1><p class="by">글 편집부</p></header><span data-p="l0"></span><ul><li data-p="l0.1">11.12~12월 슬립워크 미국 투어(시카고 출발, 텍사스·캘리포니아)</li><li data-p="l0.2">11.21 크릴 — 메인주 키터리, Some Fest</li></ul><p class="note" data-p="l0.3">날짜는 발매 소개 글과 매체 기사 기준. 국내 공연은 이번 주 확인된 것이 없다.</p></div></template>
<template class="art" data-id="desk" data-title="편집 노트"><div class="x2r"><header class="rhead"><h1>편집 노트</h1><p class="by">글 편집부</p></header><span data-p="d0"></span><p data-p="d0.1">이번 호는 정기 순번 밖에서 독자의 요청으로 만든 특별판이다. 출처 31곳에서 사실을 모았고, 커버 출처는 9곳이다. 초고에서 세 가지를 지웠다(녹음 시점을 '몇 달 뒤'로 단정한 문장 하나, 출처가 엇갈린 코머너의 출신 도시 하나, 웨이브스의 공동 작업이 무산된 사정 하나). 소리를 묘사한 문장은 셋이고 모두 원래 쓴 사람을 밝혔다. 상상한 장면은 다섯(커버의 처음과 끝, 이 판과 어울리는 밤, 날씨 서명들)이고 문장 안에 상상이라고 적었다. 가사 인용은 없다.</p><p data-p="d0.2">갚을 것: 브레인스토리 <span class="alb">[Shoebox Days]</span> 녹음 크레딧(아직 확인 못 함).</p><span data-p="d1"></span><p data-p="d1.1">사진: 슬립워크와 어스 아날로그의 쓸 수 있는 라이선스 사진은 찾지 못했다. 대신 판을 녹음한 마을 톨로노의 사진 두 장을 실었다. 표지는 톨로노의 철길 건널목(Daniel Schwen / CC BY-SA 4.0, 위키미디어 커먼스), 커버 여는 쪽은 톨로노의 곡물 엘리베이터(Gary Lee Todd, Ph.D. / CC0, 플리커)다. 둘 다 스튜디오 사진이 아니고, 색을 바꾸고 잘랐다.</p><h2 data-p="d2">출처</h2><ul><li data-p="d2.1">Release Wave — Sleepwalk, View From The Outside <a href="https://www.releasewave.com/releases/sleepwalk/view-from-the-outside" target="_blank" rel="noopener">https://www.releasewave.com/releases/sleepwalk/view-from-the-outside</a></li><li data-p="d2.2">Release Wave — Sleepwalk 아티스트 <a href="https://www.releasewave.com/artists/sleepwalk" target="_blank" rel="noopener">https://www.releasewave.com/artists/sleepwalk</a></li><li data-p="d2.3">Release Wave — Underneath The Shade <a href="https://www.releasewave.com/releases/underneath-the-shade" target="_blank" rel="noopener">https://www.releasewave.com/releases/underneath-the-shade</a></li><li data-p="d2.4">Magnetic — Sleepwalk confront social anxiety on new single Shell <a href="https://magneticmag.com/2026/11/sleepwalk-confront-social-anxiety-on-new-single-shell/" target="_blank" rel="noopener">https://magneticmag.com/2026/11/sleepwalk-confront-social-anxiety-on-new-single-shell/</a></li><li data-p="d2.5">MNRK Heavy — Sleepwalk <a href="https://mnrkheavy.com/collections/sleepwalk" target="_blank" rel="noopener">https://mnrkheavy.com/collections/sleepwalk</a></li><li data-p="d2.6">Stere
