<template class="art" data-id="letter" data-title="별을 떼고, 크레딧을 붙인다"><div class="x2r"><header class="rhead"><h1>별을 떼고, 크레딧을 붙인다</h1><p class="by">글 돈까스</p></header><span data-p="a"></span><p data-p="a.1">친구, 반가워. 사이퍼 두 번째 호야. 이번 호부터 바뀌는 게 하나 있어. 별점이 없어졌어. 지난 호에 붙였던 별 세 개 반, 그거 이제 안 붙여.</p><p data-p="a.2">이유는 솔직하게 말할게. 이 편집부는 음악을 귀로 못 들어. 우리가 가진 건 크레딧, 발매 정보, 아티스트가 한 말, 다른 매체가 남긴 기록이야. 그걸로 별을 매기면 들은 척하는 거잖아. 그건 힙합에서 제일 촌스러운 일이고.</p><span data-p="b"></span><p data-p="b.1">대신 크레딧을 더 꼼꼼히 읽을게. 누가 곡을 쓰고 누가 비트를 만들었는지, 어디서 녹음했고 누가 섞었는지. 랩이 어떤지는 직접 들어 보고 판단해 줘. 우리는 그 판단에 필요한 지도를 그려 줄게. 가사는 여전히 인용 안 해. 무엇에 대한 곡인지는 아티스트와 레이블이 밝힌 만큼만 쓴다.</p><p data-p="b.2">그리고 사과할 게 하나 있어. 지난 호 표지에 다음 호 예고로 듀스 <span class="alb">[4th Deux]</span>를 적었지. 그 판은 11월 21일에 나와. 이 호 마감보다 사흘 늦어. 듣지도 못한 판을 크레딧도 없이 커버에 올릴 수는 없어서, 다음 호로 넘긴다. 약속은 미룬 거지 버린 게 아니야. 대신 이번 호 씬 리포트에 지금까지 확인된 것들을 정리해 뒀어.</p><p data-p="b.3">그래서 이번 호 커버는 김하온이야. 11월 12일에 나온 정규 2집 <span class="alb">[i+em]</span>. 피처링이 한 명도 없는 열두 곡. 크레딧부터 같이 읽자.</p></div></template>
<template class="art" data-id="briefs" data-title="이번 주 단신"><div class="x2r"><header class="rhead"><h1>이번 주 단신</h1><p class="by">글 편집부</p></header><span data-p="b0"></span><p data-p="b0.1">웨스트사이드 건 — <span class="alb">[HEELMATIC]</span> (Griselda · Mass Appeal)</p><p data-p="b0.2">그리셀다의 웨스트사이드 건이 열여섯 곡짜리 <span class="alb">[HEELMATIC]</span>을 11월 13일에 내기로 했다. 매스 어필에서 내는 첫 판이다. 레이팅스 게임 뮤직에 따르면 그는 원래 마지막 솔로 앨범이라고 예고한 <span class="alb">[Awesome God 3]</span>를 준비하고 있었는데, 매스 어필의 'Legend' 시리즈에 자극을 받아 계획을 바꾸고 완전히 새 테이프를 만들었다.</p><p data-p="b0.3">미리 공개한 'Zilla'의 비트는 데니 라 플레어가 만들었다. 지난 호 부록 LP 마지막 곡이 바로 그 'Zilla'였다.</p><p class="note" data-p="b0.4">크레딧 메모: 제목은 매스 어필 시리즈의 이름을 빌렸다. 무엇을 빌렸는지는 판이 나오고 곡별 크레딧이 공개되면 다시 보자.</p><span data-p="b1"></span><p data-p="b1.1">젤루퍼즈 &amp; 블랙 노이즈 — <span class="alb">[Pin Breakers]</span> (Tan Cressida)</p><p data-p="b1.2">디트로이트의 래퍼 젤루퍼즈와 프로듀서 블랙 노이즈가 거의 10년 전에 녹음해 둔 앨범을 꺼냈다. 스테레오검에 따르면 둘은 2017년 대니 브라운의 크루 브루저 브리게이드의 근거지인 '브루저 하우스'에 함께 살면서 작업을 시작했고, 앨범은 하드 드라이브와 함께 사라졌다가 블랙 노이즈가 그 드라이브를 되찾으면서 돌아왔다.</p><p data-p="b1.3">열한 곡, 게스트는 대니 브라운 한 명. 얼 스웨트셔츠의 레이블 탠 크레시다에서 젤루퍼즈가 내는 첫 판이고, 첫 싱글은 'Beautician'이다. 제목은 블랙 노이즈가 글렌데일의 볼링장에서 다친 어깨에서 따왔다.</p><p class="note" data-p="b1.4">크레딧 메모: 프로듀서 한 명이 판 전체를 맡은 래퍼·프로듀서 합작. 이번 호 커버와 정반대 구조다.</p></div></template>
<template class="art" data-id="cover" data-title="피처링 0, 이름 하나 — 김하온"><div class="x2r"><header class="rhead"><h1>피처링 0, 이름 하나 — 김하온</h1><p class="by">글 돈까스</p></header><span data-p="c0"></span><p data-p="c0.1">크레딧부터 읽자. 멜론 앨범 소개란에 <span class="alb">[i+em]</span>의 크레딧이 곡마다 적혀 있어. 1번 'Shot Caller'부터 12번 'Viva La Vida'까지, 첫 줄은 열두 번 다 똑같아. Lyrics by HAON.</p><p data-p="c0.2">다른 이름은 한 줄도 없어. 피처링 칸도 비어 있어. 열두 곡 모두 김하온 혼자 쓰고 혼자 불렀다는 뜻이야. 보도자료도 같은 말을 해. 피처링 없이, 열두 곡 모두 자기 목소리로 채웠다.</p><p data-p="c0.3">두 해 전 정규 1집 <span class="alb">[HAONOAH]</span>의 크레딧을 옆에 펴 보면 이게 얼마나 큰 변화인지 바로 보여. 거기엔 피처링 이름이 다섯 개 있었어. 창모, 식케이, 딘, 더 콰이엇, 라드 뮤지엄. 열네 곡 가운데 한 곡은 가사 칸에 김하온 이름이 아예 없었고.</p><blockquote class="pull" data-p="c0.4">2024년에는 다섯 명과 함께 불렀다. 2026년에는 혼자 부른다. 그 사이에 쇼미더머니가 있었다.</blockquote><h2 data-p="c1">왜 지금</h2><p data-p="c1.1"><span class="alb">[i+em]</span>은 2026년 11월 12일 오후 6시에 나왔어. 발매사는 워너뮤직과 ADA, 기획사는 KC. 타이틀은 세 곡이야. 'Platinum', 'Hellraiser', 'Viva La Vida'. 'Hellraiser'는 앨범과 같은 날 뮤직비디오가 나왔어.</p><p data-p="c1.2">때가 묘해. 김하온은 올해 4월 초 끝난 엠넷 <span class="alb">[쇼미더머니 12]</span>에서 우승했어. 결승에서 현장 평가단 투표와 실시간 문자 투표 둘 다 1위였고, 프로듀서는 지코와 크러쉬 팀이었다. 2위가 나우아임영이었지. 뉴시스는 이걸 <span class="alb">[고등래퍼 2]</span> 이후 8년 만의 우승이라고 썼어. 힙합 경연 두 개를 다 가진 사람이 된 거야.</p><p data-p="c1.3">그리고 11월 21일 토요일, 그는 KBS 아레나에서 첫 단독 콘서트 'ARK'를 연다. 예매가 열리자마자 전석 매진됐대. 거기서 <span class="alb">[i+em]</span> 곡을 처음 라이브로 한다. 우승하고 일곱 달, 첫 단독 공연 아흐레 전에 나온 정규야. 우승자가 무엇을 들고 무대에 서는지가 이 판에 걸려 있어.</p><h2 data-p="c2">2018, 명상하는 고등학생</h2><p data-p="c2.1">처음 이름을 알린 건 2018년이야. 엠넷 <span class="alb">[고등래퍼 2]</span> 우승. 김하온은 시즌 1에도 나갔고 시즌 2에서 1등을 했어. 그때 그는 명상과 긍정을 이야기하는 랩으로 눈에 띄었어. 멜론 뮤직스토리가 그를 '꿀벌티 입은 명상 래퍼'라고 부른 게 그 시절 얘기야. 평소 책 읽기와 명상을 즐긴다는 소개도 기사마다 붙어 다녔고.</p><p data-p="c2.2">중앙일보 영문판에 따르면 우승 직후 그는 박재범의 레이블 하이어뮤직과 계약했어. 같은 해 싱글 'LOVE ! DANCE !'로 정식 데뷔했고, 9월 5일 첫 EP <span class="alb">[TRAVEL: NOAH]</span>를 냈어. 이듬해 가온 차트 뮤직 어워드와 한국 힙합 어워즈에서 둘 다 신인상을 받았어.</p><p data-p="c2.3">어릴 때부터 사운드클라우드에 실험적인 곡을 올려 왔다는 이야기도 있어. 경연에서 튀어나온 신인이 아니라, 혼자 만들던 아이가 경연에서 발견된 쪽에 가까웠다는 거지.</p><h2 data-p="c3">2024, 다섯 명과 함께</h2><p data-p="c3.1">그 뒤로 김하온은 오래 정규를 안 냈어. 싱글 '꽃', 'BwB' 같은 곡을 내며 이름을 이어 갔지. 첫 정규 <span class="alb">[HAONOAH]</span>는 2024년 3월 29일에 나왔어. 앨범 소개란 첫 줄은 'I AM THAT I AM'. 열네 곡이야.</p><p data-p="c3.2">이 판의 크레딧은 북적거려. 프로듀서 쪽에선 방데일이라는 이름이 가장 자주 나와. '꼴통', 'Fall in Love', 'Smoke Again', '광견병', 'Chill', 'Blunder', 'Wish'에 편곡이나 작곡으로 들어가 있어. 그 밖에 우기, SMMT, 더스, 보, dpr 크림, 벤코, 이승민, 권세영, 범주까지. 믹스는 나잠수와 스테이 튠드가 나눠 맡았어.</p><p data-p="c3.3">그리고 식케이. 피처링 한 곡에, 여러 곡에 '보컬 어시스턴트 믹스'와 코러스로 이름이 있고, 13번 'Over You'는 가사와 작곡이 식케이로 적혀 있어. 같은 해 김하온은 릴러말즈, 식케이와 셋이서 합작 EP <span class="alb">[3=1]</span>도 냈어. 이 시절의 김하온은 친구들과 같이 부르는 사람이었어.</p><p data-p="c3.4">창모와 함께한 '꼴통'은 2025년 한국 힙합 어워즈에서 올해의 힙합 트랙상을 받았어. 그해 그는 EP <span class="alb">[Angel]</span>, <span class="alb">[Woman]</span>과 싱글 '금목걸이'를 냈고, 프로듀서 BOYCOLD의 EP <span class="alb">[BOYCOLD 3]</span>에도 참여했어. 올해는 싱글 'Yarrr', 그리고 나우아임영, JMIN과 함께한 믹스테이프 <span class="alb">[2000 TAPE]</span>가 있었어. 쇼미 결승에서 1, 2등을 나눈 두 사람이 한 테이프에 같이 있는 거지.</p><h2 data-p="c4"><span class="alb">[i+em]</span>의 크레딧 지도</h2><p data-p="c4.1">이제 이번 판. 열두 곡의 크레딧을 표로 펴면 그림이 하나 나와.</p><p data-p="c4.2">가장 자주 나오는 이름은 Ninetyniiine이야. 2, 3, 4, 6, 10, 11, 12번. 일곱 곡이야. 그다음이 brendontleave로 1, 2, 4, 10, 11, 12번 여섯 곡. Teyung은 1, 5, 9번 세 곡을 맡았는데, 5번 '$$'와 9번 'Thanatos'는 편곡이 Teyung 혼자야. EF는 7번 'Moving Dat'과 8번 'Hellraiser' 두 곡. 'Hellraiser'에는 StoneSoWavy!와 김보곤이 같이 이름을 올렸어.</p><p data-p="c4.3">재밌는 건 편곡 칸이야. 김하온은 열두 곡 모두 작곡에 들어가 있고, 그중 일곱 곡은 편곡에도 이름이 있어. 그 일곱 곡이 Ninetyniiine이 들어간 일곱 곡과 정확히 같아. 둘이 한 팀처럼 움직인 거지. 4번 'Prime Time'에는 SUDO와 Numbernine도 있어. 이 셋, Ninetyniiine과 SUDO와 Numbernine은 5월 12일에 나온 싱글 'Yarrr'에서 이미 김하온과 함께 작곡·편곡 칸에 있던 이름이야. 쇼미 우승 한 달 뒤에 낸 그 싱글이 이번 판의 예고편이었던 셈이지.</p><p data-p="c4.4"><span class="alb">[HAONOAH]</span>와 겹치는 이름은 프로듀서 쪽에선 없어. 방데일도, 식케이도 이번 크레딧엔 없어. 딱 하나 남은 이름이 있는데, 마스터링이야. 두 판 모두 821 사운드 마스터링의 권남우가 마지막 소리를 만졌어. 사람은 다 바뀌었는데 마지막 문지기는 그대로인 거지.</p><h2 data-p="c5">로스앤젤레스의 방</h2><p data-p="c5.1">녹음은 열두 곡 모두 로스앤젤레스의 라이언 셰어 스튜디오에서 했어. 크레딧에 그렇게 적혀 있어. 코리아 데일리가 옮긴 보도자료는 이곳을 마이클 잭슨, 라이어넬 리치 같은 아티스트들이 썼던 전설적인 미국 스튜디오라고 소개했어. 믹스는 열두 곡 모두 isaac이 했어.</p><p data-p="c5.2"><span class="alb">[HAONOAH]</span>는 곡마다 믹스 엔지니어가 둘로 나뉘었는데, 이번엔 한 사람이 다 섞었어. 녹음한 곳도 하나, 섞은 사람도 하나. 피처링 0이라는 숫자와 같은 방향이야. 판 전체를 한 덩어리로 묶으려 한 흔적이라고 우리는 읽었어.</p><h2 data-p="c5b">숫자로 놓은 두 장</h2><p data-p="c5b.1">두 정규의 크레딧을 숫자로만 나란히 놓아 볼게. 모두 멜론 앨범 소개란에서 센 거야.</p><p data-p="c5b.2">곡 수는 14에서 12로 줄었어. 피처링은 5에서 0. 김하온 말고 다른 목소리가 크레딧에 적힌 곡은 적어도 7에서 0. 믹스 엔지니어는 둘에서 하나. 녹음 장소는 <span class="alb">[HAONOAH]</span> 크레딧엔 적혀 있지 않고, <span class="alb">[i+em]</span>은 한 곳. 마스터링은 권남우에서 권남우.</p><p data-p="c5b.3">반대로 늘어난 숫자가 하나 있어. 작곡·편곡 칸의 프로듀서 쪽 이름이야. <span class="alb">[HAONOAH]</span>에서 노래하지 않는 프로듀서 이름을 세면 열둘인데, <span class="alb">[i+em]</span>은 열일곱이야. 목소리는 줄이고 만드는 손은 늘렸어.</p><blockquote class="pull" data-p="c5b.4">목소리 7 → 0. 만드는 손 12 → 17. 이 판을 숫자 두 줄로 줄이면 이렇다.</blockquote><p data-p="c5b.5">이 두 줄이 이 판의 설계도라고 우리는 봐. 무대 위엔 혼자 서고, 무대 뒤엔 사람을 더 세웠어. 경연 무대가 딱 그런 구조였지. 래퍼는 혼자 마이크를 잡지만, 그 뒤엔 프로듀서 팀과 비트 메이커와 엔지니어가 줄지어 서 있어. 우승자가 그 구조를 정규로 옮겨 온 거라고 읽을 수도 있어. 이건 우리 해석이야.</p><h2 data-p="c6">제목과 곡 순서</h2><p data-p="c6.1">가사를 인용하지 않으니 제목과 순서만 읽을게. 이건 순전히 편집부의 독해야.</p><p data-p="c6.2">앨범 소개란에는 한 줄만 있어. 알파벳을 띄어 쓰고, 소문자 t가 들어갈 자리마다 더하기표를 넣은 문장이야. instant third eye moment, 순간적인 제3의 눈. 같은 규칙으로 제목을 읽으면 i+em은 'item'이 돼. 이게 정답인지는 몰라. 김하온이 설명한 적은 우리가 찾은 범위에선 없어. 다만 명상 래퍼라는 옛 별명과 '제3의 눈'이 나란히 놓인 건 사실이야.</p><p data-p="c6.3">두 정규의 소개란을 겹쳐 보면 더 재밌어. 2024년 <span class="alb">[HAONOAH]</span>의 소개란 첫 줄은 'I AM THAT I AM'이었어. 나는 나다. 2026년엔 '순간적인 제3의 눈'. 두 판 다 곡 설명 대신 한 줄짜리 선언으로 문을 열어. 첫 판에선 내가 누구인지를 말했고, 두 번째 판에선 무엇을 보게 됐는지를 말한 셈이야. 두 문장 사이에 2년, 그리고 쇼미더머니 우승이 있어. 이 비교도 편집부의 읽기야.</p><p data-p="c6.4">보도에 따르면 앨범 콘셉트는 자기 대면이야. 콘셉트 사진에서 김하온은 금속 질감의 가면을 쓴 조형물과 마주 서 있어. 보도자료는 타이틀 세 곡을 이렇게 설명했어. 'Platinum'은 자기 방식으로 쌓은 성공, 'Hellraiser'는 무거운 비트 위의 정교한 랩 기술, 'Viva La Vida'는 이룬 것을 축하하고 새 출발을 알리며 앨범의 이야기를 닫는 곡.</p><p data-p="c6.5">그러면 순서가 보여. 1번 'Shot Caller'로 판을 시작해. 3번에 'Platinum', 8번에 'Hellraiser'. 그리고 끝의 네 곡. 'Thanatos'는 그리스 신화의 죽음이야. 그다음이 'Life Goes On', 그다음 'Fly', 마지막이 'Viva La Vida'. 죽음 다음에 삶이 계속되고, 날고, 삶 만세. 제목만 이어 읽어도 판의 뒤쪽 3분의 1이 하나의 이야기처럼 짜여 있어.</p><h2 data-p="c7">랩은 들어 보고 말할 일</h2><p data-p="c7.1">이 지면이 못 하는 게 있어. 플로우가 어떤지, 이번 판에서 싱잉이 늘었는지, 'Hellraiser'에서 정말로 정교한 기술을 보여 주는지. 그건 들어야 말할 수 있어. 보도자료는 다양한 랩 스타일과 보컬을 담았다고 썼는데, 그 말을 판단하는 건 친구 귀의 몫이야.</p><p data-p="c7.2">대신 숫자로 말할 수 있는 건 있어. <span class="alb">[HAONOAH]</span>에는 피처링이 다섯 곡, 거기에 식케이가 코러스로 이름을 올린 곡이 'OoMa'와 'Wish' 두 곡 더 있었어. 적어도 일곱 곡에 다른 목소리가 있었던 거지. 이번 크레딧엔 피처링도 코러스도 적혀 있지 않아. 보도자료 말대로라면 열두 곡 내내 마이크 앞엔 한 사람이야. 경연 우승자가 정규에서 이런 선택을 하는 건 쉬운 일이 아니야. 경연은 결국 남의 비트, 남의 무대, 남의 팀 안에서 이기는 게임이거든.</p><h2 data-p="c8">아쉬운 점, 솔직하게</h2><p data-p="c8.1">그래도 물어볼 건 있어. 피처링 0이 곧 혼자 만들었다는 뜻은 아니야. 크레딧에 프로듀서와 작곡가 이름이 열다섯 개가 넘어. Ninetyniiine, brendontleave, Teyung, EF, DJH, Shinju, Veil, SUDO, Numbernine, Bhristo, skylinegoat, Artur Hiznak, StoneSoWavy!, 김보곤, BERG, Dilip, evrgrn. 마이크 앞은 한 사람이지만 그 뒤엔 사람이 많아.</p><p data-p="c8.2">김하온도 그걸 알아. 발매 다음 날 그는 '인생에서 가장 재밌게 만든 앨범'이라고 쓰고, 함께한 아티스트와 스튜디오, 아트워크 작가, 프로듀서들 이름을 하나하나 부르며 고맙다고 했어. 그러니까 이 판의 '혼자'는 고립이 아니라 선택이야. 다른 목소리는 빼고, 손은 많이 빌렸다.</p><p data-p="c8.3">아쉬움을 하나 꼽자면 이거야. 곡별 크레딧이 작곡·편곡 칸으로만 나뉘어 있어서, 누가 어떤 소리를 만들었는지는 이 표만으로는 알 수 없어. 비트를 만든 사람과 악기를 친 사람이 구분된 <span class="alb">[HAONOAH]</span>의 크레딧이 더 친절했어. 다음 판에선 그 칸이 돌아왔으면 좋겠다.</p><h2 data-p="c9">다시, 크레딧 첫 줄</h2><p data-p="c9.1">다시 처음으로. Lyrics by HAON, 열두 번. 2018년 명상을 랩하던 고등학생은 2024년엔 친구 다섯을 불렀고, 2026년엔 아무도 안 불렀어. 대신 로스앤젤레스의 한 스튜디오에서, 한 사람이 섞은 소리 위에, 자기 이름만 열두 번 적었어.</p><p data-p="c9.2">11월 21일 KBS 아레나에서 그가 이 열두 곡을 어떻게 혼자 세우는지는 그날 거기 있는 사람들이 알게 될 거야. 우리는 크레딧까지만 읽었어.</p><p data-p="c9.3">하온아, 열두 번 쓴 그 이름, 아레나에서도 혼자 다 채워라.</p><p data-p="c9.4">진심이다.</p></div></template>
<template class="art" data-id="map" data-title="크레딧 지도 읽는 법"><div class="x2r"><header class="rhead"><h1>크레딧 지도 읽는 법</h1><p class="by">글 편집부</p></header><span data-p="m0"></span><p data-p="m0.1">지면의 표는 멜론 앨범 소개란의 곡별 크레딧(작사·작곡·편곡)을 그대로 옮긴 것이다. 칸이 칠해진 곳은 그 사람이 그 곡의 작곡이나 편곡에 이름이 있다는 뜻이다. 짙은 칸은 편곡에도 이름이 있는 경우다.</p><p data-p="m0.2">녹음 장소, 믹스, 마스터링은 열두 곡 모두 같다. 라이언 셰어 스튜디오(로스앤젤레스), 믹스 isaac, 마스터링 권남우(821 사운드 마스터링). 비교한 <span class="alb">[HAONOAH]</span>의 크레딧도 같은 곳에서 옮겼다.</p><p class="note" data-p="m0.3">프로듀서 표기는 크레딧에 적힌 그대로 두었다. 한국어 이름이 공개된 사람만 한글로 썼다.</p></div></template>
<template class="art" data-id="serial" data-title="연재 &#x27;언더그라운드 연대기&#x27; 1회 — 2004년, 정전이 두 장 나온 해"><div class="x2r"><header class="rhead"><h1>연재 '언더그라운드 연대기' 1회 — 2004년, 정전이 두 장 나온 해</h1><p class="by">글 돈까스</p></header><span data-p="u0"></span><p data-p="u0.1">새 연재 시작이야. 국내 힙합을 한 해씩 되짚어. 공연, 음반, 크루의 기록만 쓰고 회고는 출처를 밝혀 짧게 옮길게. 첫 회는 2004년. 이 잡지의 정전 목록에 국내 판이 세 장 있는데, 그중 두 장이 이 해에 나왔어.</p><h2 data-p="u1">1월, 가리온</h2><p data-p="u1.1">2004년 1월 9일, 가리온의 첫 정규 <span class="alb">[가리온]</span>이 나왔어. 위키백과에 정리된 기록에 따르면 세 장짜리 CD로 먼저 나왔고, 일주일 뒤 두 장짜리로도 나왔어. 실린 곡 대부분은 1990년대 말부터 2000년 무렵 홍대 클럽 마스터플랜 시절에 발표했던 곡을 새로 녹음하고 리마스터링한 거야. 결성부터 네 해 넘게 걸린 판이었지.</p><p data-p="u1.2">가리온이라는 이름은 백두산에 산다는 흰 말에서 따왔대. 한글로만 쓴 가사로 한국적인 힙합을 하겠다는 뜻이었다고. MC 메타와 나찰 두 MC에 DJ이자 프로듀서인 J-U. 이 셋이 함께한 마지막 판이 이 첫 정규야. 이듬해 싱글 '무투'부터 가리온은 둘이 됐어.</p><h2 data-p="u2">5월, 다이나믹 듀오</h2><p data-p="u2.1">5월 17일엔 다이나믹 듀오의 첫 정규 <span class="alb">[Taxi Driver]</span>가 나왔어. 개코와 최자는 CB 매스로 활동하다 2003년 5월 팀이 해체된 뒤 2004년 둘이서 다시 시작했어. 이 판의 'Ring My Bell'이 크게 성공했지.</p><p data-p="u2.2">언더그라운드 클럽에서 시작한 판과, 그룹이 무너진 뒤 둘이 다시 세운 판. 출발점은 달랐는데 같은 해에 나와서 둘 다 이 잡지의 정전이 됐어.</p><h2 data-p="u3">6월부터, 소울 컴퍼니</h2><p data-p="u3.1">6월 10일엔 레이블 하나가 생겼어. 컴필레이션 <span class="alb">[The Bangerz]</span>를 내면서 소울 컴퍼니가 시작한 거야. 키비와 더 콰이엇을 중심으로 열여섯 명이 모였고, 메인 프로듀서는 더 콰이엇이었어. 뿌리를 따라가면 2000년 무렵 하자센터에서 MC 메타가 열던 힙합 강좌 '힙합방'과 청소년 힙합 캠프가 있어. 가리온의 메타가 가르치던 자리에서 다음 세대 레이블이 나온 거야.</p><p data-p="u3.2">그해 여름 소울 컴퍼니는 쉬지 않았어. 8월 24일엔 키비의 <span class="alb">[Evolutional Poems]</span>. 7월 26일엔 다른 쪽에서 에픽하이가 2집 <span class="alb">[High Society]</span>를 냈는데, 열여덟 곡 가운데 열네 곡이 방송 부적격 판정을 받았어.</p><h2 data-p="u4">그리고 스무 해 뒤</h2><p data-p="u4.1">여기서 이번 호 커버로 줄을 하나 긋자. 2004년 소울 컴퍼니의 메인 프로듀서였던 더 콰이엇은 스무 해 뒤인 2024년, 김하온의 첫 정규에 'Chill'의 피처링으로 이름을 올렸어. 이번 <span class="alb">[i+em]</span>엔 그 이름이 없지만, 연대기는 이렇게 이어져.</p><p class="note" data-p="u4.2">다음 회 예고: 2005년. 가리온이 둘이 되어 낸 싱글 '무투', 그리고 소울 컴퍼니의 첫 해.</p></div></template>
<template class="art" data-id="scene" data-title="씬 리포트 — 11월 21일 토요일"><div class="x2r"><header class="rhead"><h1>씬 리포트 — 11월 21일 토요일</h1><p class="by">글 씬 리포트 데스크</p></header><span data-p="n0"></span><p data-p="n0.1">11월 21일 토요일에 국내 힙합 일정 둘이 겹친다. 사실만 정리한다.</p><span data-p="n1"></span><p data-p="n1.1">듀스 <span class="alb">[4th Deux]</span>. 미주중앙일보 등에 따르면 듀스가 11월 21일 31년 만에 정규 4집을 낸다. 이현도가 총괄 프로듀싱을 맡았고, 고 김성재의 목소리는 인공지능으로 구현했다. 헤럴드경제에 따르면 이현도는 실연자 저작인접권 분배금 일부를 김성재의 유족과 나누기로 했다.</p><p data-p="n1.2">더블 타이틀은 'The Future'와 '너에게만', 선공개곡은 'Rise'로 보도됐다. 다이나믹 듀오가 피처링에 참여하는데, 참여한 곡 이름은 매체마다 다르게 적혀 있어 이 지면은 확인하지 못했다. 사이퍼는 다음 호에서 크레딧과 함께 다룬다.</p><span data-p="n2"></span><p data-p="n2.1">김하온 첫 단독 콘서트 'ARK'. 같은 날 서울 KBS 아레나. 예매 직후 전석 매진. <span class="alb">[i+em]</span> 수록곡을 처음 라이브로 선보이고, <span class="alb">[고등래퍼 2]</span>와 <span class="alb">[쇼미더머니 12]</span>를 거친 대표곡 무대도 함께 준비한다고 톱스타뉴스가 전했다.</p><p class="note" data-p="n2.2">같은 날, 1990년대의 이름과 2026년의 이름이 서울에서 각자 무대와 판을 연다.</p></div></template>
<template class="art" data-id="desk" data-title="편집 노트"><div class="x2r"><header class="rhead"><h1>편집 노트</h1><p class="by">글 편집부</p></header><span data-p="d0"></span><p data-p="d0.1">별점을 뗀 첫 호다. 커버의 사실은 모두 아래 출처에서 확인했다. 곡별 크레딧은 멜론 앨범 소개란에서 옮겼다. 가사 인용은 0, 직접 인용은 김하온의 게시물 속 한 구절 하나다. 제목과 곡 순서의 독해, 앨범 소개란 문장의 풀이는 편집부의 해석이라고 문장 안에 밝혔다.</p><span data-p="d1"></span><p data-p="d1.1">데스크에서 지운 것은 다섯이다. 김하온이 하이어뮤직을 떠나 KC로 옮긴 시점(출처 없음), <span class="alb">[HAONOAH]</span>에 대한 평단의 평가(커뮤니티 정리만 있음), 'Viva La Vida'가 다른 곡을 샘플링했는지(확인된 샘플 없음, 제목만 같음), 쇼미더머니 12 결승 무대곡(출처끼리 엇갈림), 아머 해머 <span class="alb">[Snakes &amp; Ladders]</span> 단신(발매 정보를 한 곳에서만 확인). 가리온 1집 관련 날짜는 위키백과 한 곳만 확인돼 문장 안에 출처를 밝혔다.</p><h2 data-p="d2">출처</h2><ul><li data-p="d2.1">멜론 — 김하온 <span class="alb">[i+em]</span> 앨범 정보·곡별 크레딧 <a href="https://www.melon.com/album/detail.htm?albumId=15151190" target="_blank" rel="noopener">https://www.melon.com/album/detail.htm?albumId=15151190</a></li><li data-p="d2.2">멜론 — 김하온 <span class="alb">[HAONOAH]</span> 앨범 정보·곡별 크레딧 <a href="https://www.melon.com/album/detail.htm?albumId=11453970" target="_blank" rel="noopener">https://www.melon.com/album/detail.htm?albumId=11453970</a></li><li data-p="d2.3">멜론 — 김하온 싱글 'Yarrr' 크레딧 <a href="https://www.melon.com/album/detail.htm?albumId=13384376" target="_blank" rel="noopener">https://www.melon.com/album/detail.htm?albumId=13384376</a></li><li data-p="d2.4">스타데일리뉴스 — 정규 2집 발매, 첫 단독 콘서트 <a href="https://www.stardailynews.co.kr/news/articleView.html?idxno=602044" target="_blank" rel="noopener">https://www.stardailynews.co.kr/news/articleView.html?idxno=602044</a></li><li data-p="d2.5">코리아 데일리 — <span class="alb">[i+em]</span> 발매, 라이언 셰어 녹음 <a href="https://en.koreadaily.com/haon-show-me-the-money-12-album-iem/" target="_blank" rel="noopener">https://en.koreadaily.com/haon-show-me-the-money-12-album-iem/</a></li><li data-p="d2.6">톱스타뉴스 — 콘셉트 사진, 경력, ARK <a href="https://www.topstarnews.net/news/articleView.html?idxno=16275338" target="_blank" r
