<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#f4efe6; --ink:#141414; --mute:#6d675e; --rule:rgba(20,20,20,.18);
  --cy:#2bb3d9; --cy2:#137a99; --red:#d23a26; --kraft:#c49a63; --kraft2:#a97d47; --night:#0f1724; --pink:#ef9fb4;
  --mono:'IBM Plex Mono',monospace; --serif:'Noto Serif KR',Georgia,serif; --sans:'Noto Sans KR',system-ui,sans-serif; --it:'Instrument Serif',Georgia,serif; --slab:'Alfa Slab One',serif;
  /* 읽기 모드 */
  --rd-bg:#f6f1e7; --rd-ink:#1b1a18; --rd-accent:#137a99; --rd-rule:rgba(20,20,20,.14); --rd-on:#fff; --rd-hit:rgba(43,179,217,.22);
}
/* ── 지면 ── */
.x2{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size;font-family:var(--serif);-webkit-font-smoothing:antialiased}
.x2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.x2 *{box-sizing:border-box}
.x2 :is(h1,h2,h3){color:inherit;text-align:left}
.x2 .x-in{position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:12cqw;display:flex;flex-direction:column}
.x2 .x-rh{position:absolute;left:7cqw;right:7cqw;top:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:.2cqw solid var(--rule);padding-bottom:1.6cqw}
.x2 .x-rh b{color:var(--cy2);font-weight:600}
.x2 .x-folio{position:absolute;left:7cqw;right:7cqw;bottom:4.6cqw;display:flex;justify-content:space-between;font:400 2.3cqw/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.x2 .x-kick{font:600 2.6cqw/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cy2)}
.x2 .x-h{font:900 8cqw/1.18 var(--serif);letter-spacing:-.03em;margin:2.4cqw 0 0;word-break:keep-all}
.x2 .x-h2{font:900 5.6cqw/1.25 var(--serif);letter-spacing:-.02em;margin:0;word-break:keep-all}
.x2 .x-en{font:italic 400 4.4cqw/1.1 var(--it);color:var(--mute)}
.x2 .x-dek{font:500 3.3cqw/1.6 var(--sans);color:#3a3631;margin:2.6cqw 0 0;word-break:keep-all}
.x2 .x-by{font:400 2.5cqw/1.4 var(--mono);color:var(--mute);margin-top:2cqw;letter-spacing:.04em}
.x2 .x-txt{font-size:3.5cqw;line-height:1.72;word-break:keep-all;color:#1f1d1a}
.x2 .x-txt p{margin:0 0 2.4cqw}
.x2 .x-txt .alb,.x2r .alb{font-feature-settings:"palt"}
.x2 .x-txt .note{font-family:var(--sans);font-size:3cqw;color:var(--mute)}
.x2 .x-txt ul{margin:0;padding:0;list-style:none}
.x2 .x-txt li{padding:2cqw 0;border-top:.2cqw solid var(--rule);font-family:var(--sans);font-size:3.1cqw;line-height:1.55}
.x2 .x-drop>p:first-child::first-letter{float:left;font:900 12cqw/.86 var(--serif);padding:1.2cqw 1.8cqw 0 0;color:var(--cy2)}
.x2 .x-more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:1.6cqw;border:.35cqw solid var(--cy2);border-radius:99cqw;background:none;color:var(--cy2);font:700 3.2cqw/1 var(--sans);padding:3.2cqw 4.6cqw;cursor:pointer;min-height:11cqw}
.x2 .x-more i{font-style:normal;font-size:2.4cqw}
.x2 .x-more:focus-visible{outline:.5cqw solid var(--red);outline-offset:.8cqw}
.x2 .x-dark .x-more,.x2.x-dark .x-more{border-color:#9fe0f2;color:#9fe0f2}
.x2 .x-pull{font:900 4.6cqw/1.45 var(--serif);letter-spacing:-.02em;word-break:keep-all;color:var(--ink);padding:3cqw 0;border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink)}
.x2 .x-pull p{margin:0}
.x2 .x-cap{font:400 2.5cqw/1.5 var(--sans);color:var(--mute);word-break:keep-all}
.x2 .x-cap b{color:var(--ink);font-weight:700}
.x2 .x-tag{display:inline-block;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;padding:1.2cqw 1.8cqw;border:.25cqw solid currentColor;border-radius:.6cqw}
/* 리소 판 어긋남: 같은 글자를 하늘색으로 한 번 더 찍고 살짝 민다 */
.x2 .x-riso{position:relative;display:inline-block}
.x2 .x-riso::before{content:attr(data-t);position:absolute;left:.7cqw;top:.45cqw;color:var(--cy);mix-blend-mode:multiply;white-space:pre-line;z-index:-1}
.x2 .x-dots{background-image:radial-gradient(circle,var(--ink) 34%,transparent 36%);background-size:1.8cqw 1.8cqw}

/* 0 표지 — 신발 상자 끝면 라벨 */
.x2.x-cover{background:linear-gradient(180deg,#cfa86f 0,#c49a63 46%,#b88c55 100%)}
.x2.x-cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(80,50,20,.05) 0 .3cqw,transparent .3cqw 1.9cqw),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 .2cqw,transparent .2cqw 3cqw)}
.x2 .x-lid{position:absolute;left:0;right:0;top:36cqw;height:2.4cqw;background:linear-gradient(180deg,rgba(60,35,10,.38),rgba(60,35,10,0));border-top:.3cqw solid rgba(255,240,215,.45)}
.x2 .x-mast{position:absolute;left:4.5cqw;top:1cqw;font:400 21.5cqw/1 var(--slab);letter-spacing:-.045em;color:var(--cy);text-shadow:.7cqw .7cqw 0 rgba(20,20,20,.9)}
.x2 .x-issue{position:absolute;left:6cqw;right:6cqw;top:29.5cqw;display:flex;justify-content:space-between;font:600 2.3cqw/1 var(--mono);letter-spacing:.1em;color:#2b1d0d}
.x2 .x-stamp{position:absolute;right:6cqw;top:44cqw;width:19cqw;height:19cqw;border-radius:50%;border:.7cqw solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font:900 3.6cqw/1.15 var(--sans);transform:rotate(12deg);mix-blend-mode:multiply;z-index:3}
.x2 .x-label{position:absolute;left:7cqw;right:13cqw;top:42cqw;background:#fbf8f1;color:#1a1612;padding:3cqw 3.6cqw 2.6cqw;transform:rotate(-1.4deg);box-shadow:0 .5cqw 1.4cqw rgba(60,35,10,.35)}
.x2 .x-label .r{display:flex;gap:2.4cqw;align-items:baseline;border-bottom:.25cqw solid #1a1612;padding:1cqw 0}
.x2 .x-label .r span{font:400 2.1cqw/1 var(--mono);letter-spacing:.12em;color:#6b6157;width:12cqw;flex:0 0 auto}
.x2 .x-label .r b{font:400 5.6cqw/1 var(--slab);letter-spacing:-.01em}
.x2 .x-label .g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-top:1.8cqw}
.x2 .x-label .g div{font:400 1.9cqw/1.35 var(--mono);color:#6b6157;letter-spacing:.06em}
.x2 .x-label .g b{display:block;font:600 2.6cqw/1.2 var(--mono);color:#1a1612;letter-spacing:0}
.x2 .x-bar{height:6.4cqw;margin-top:2.2cqw;background:repeating-linear-gradient(90deg,#1a1612 0 .35cqw,transparent .35cqw .7cqw,#1a1612 .7cqw .9cqw,transparent .9cqw 1.5cqw,#1a1612 1.5cqw 2.2cqw,transparent 2.2cqw 2.6cqw,#1a1612 2.6cqw 2.8cqw,transparent 2.8cqw 3.6cqw)}
.x2 .x-barn{display:flex;justify-content:space-between;font:400 1.9cqw/1 var(--mono);margin-top:1cqw;letter-spacing:.08em}
.x2 .x-cvh{position:absolute;left:7cqw;right:7cqw;top:90cqw;margin:0;font:900 11.4cqw/1.12 var(--serif);letter-spacing:-.045em;color:#141414}
.x2 .x-cvdek{position:absolute;left:7cqw;right:22cqw;top:117.5cqw;margin:0;font:700 3cqw/1.5 var(--sans);color:#2b1d0d;word-break:keep-all}
.x2 .x-cvl{position:absolute;left:7cqw;right:7cqw;bottom:6cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw 4cqw;border-top:.35cqw solid #2b1d0d;padding-top:2.4cqw}
.x2 .x-cvl div{font:500 2.5cqw/1.35 var(--sans);color:#2b1d0d}
.x2 .x-cvl b{display:block;font:600 2cqw/1.2 var(--mono);letter-spacing:.12em;color:#5b3d17}
.x2 .x-lp{position:absolute;right:6cqw;top:116cqw;width:14cqw;height:14cqw;border-radius:50%;background:radial-gradient(circle,#f4efe6 0 8%,var(--cy) 8% 32%,#141414 32% 36%,#2a2a2a 36% 40%,#141414 40%);display:flex;align-items:center;justify-content:center;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.35)}
.x2 .x-lp span{position:absolute;bottom:-4.4cqw;left:-4cqw;right:-4cqw;text-align:center;font:600 2cqw/1 var(--mono);color:#2b1d0d;letter-spacing:.06em}

/* 1 차례 */
.x2 .x-toc{list-style:none;margin:3cqw 0 0;padding:0}
.x2 .x-toc li{display:grid;grid-template-columns:10cqw 1fr;gap:2cqw;padding:1.25cqw 0;border-top:.2cqw solid var(--rule);align-items:baseline}
.x2 .x-toc li b{font:400 5cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-toc li span{font:700 3.1cqw/1.3 var(--sans)}
.x2 .x-toc li small{display:block;font:400 2.6cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-how{margin-top:2.4cqw;background:#e6f4f8;border-left:1cqw solid var(--cy);padding:3cqw 3.4cqw;font:500 2.8cqw/1.55 var(--sans);color:#1f3a42}
.x2 .x-how b{color:var(--cy2)}

/* 2 편집장의 글 */
.x2 .x-knob{width:30cqw;height:30cqw;margin:0 auto 1cqw;display:block}

/* 4 커버 스토리 첫 쪽 */
.x2 .x-room{position:absolute;left:7cqw;right:7cqw;top:12cqw;height:52cqw;border:1.2cqw solid var(--ink)}
.x2 .x-room::before{content:"";position:absolute;inset:0;opacity:.13}
.x2 .x-room .d{position:absolute;bottom:-1.2cqw;left:12%;width:16%;height:1.2cqw;background:var(--paper)}
.x2 .x-room .p{position:absolute;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--ink)}
.x2 .x-room .p.g{background:none;border:.5cqw dashed var(--ink)}
.x2 .x-room .t{position:absolute;right:2.4cqw;top:2cqw;font:600 2.2cqw/1.4 var(--mono);text-align:right;color:var(--mute)}

/* 지도 · 평면도 · 집 */
.x2 svg text{font-family:var(--sans)}
.x2 .x-fig{display:block;width:100%;height:auto;flex:0 0 auto;margin:2cqw 0 1.6cqw;border:.25cqw solid var(--ink);background:#efe8da}

/* 5 사실 상자 */
.x2 .x-facts{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 3cqw;font:400 2.7cqw/1.45 var(--sans);border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink);padding:2.4cqw 0;margin:2.4cqw 0}
.x2 .x-facts dt{font:600 2.3cqw/1.6 var(--mono);color:var(--mute);letter-spacing:.08em}
.x2 .x-facts dd{margin:0;font-weight:500}
.x2 .x-say{font:900 6.6cqw/1.3 var(--serif);letter-spacing:-.03em;margin:1cqw 0 3cqw;word-break:keep-all}
.x2 .x-say em{font-style:normal;color:var(--cy2)}

/* 8 연표 */
.x2 .x-tl{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.x2 .x-tl::before{content:"";position:absolute;left:19.2cqw;top:1cqw;bottom:1cqw;width:.5cqw;background:var(--ink)}
.x2 .x-tl li{display:grid;grid-template-columns:17cqw 1fr;gap:5cqw;padding:1.15cqw 0;position:relative}
.x2 .x-tl li::before{content:"";position:absolute;left:18cqw;top:2.2cqw;width:2.9cqw;height:2.9cqw;border-radius:50%;background:var(--paper);border:.5cqw solid var(--ink)}
.x2 .x-tl li.rm::before{background:var(--cy);border-color:var(--ink)}
.x2 .x-tl li.end::before{background:var(--red)}
.x2 .x-tl b{font:600 2.5cqw/1.5 var(--mono);text-align:right;white-space:nowrap}
.x2 .x-tl span{font:500 2.9cqw/1.45 var(--sans);word-break:keep-all}
.x2 .x-tl small{display:block;font-size:2.4cqw;color:var(--mute);font-weight:400}
.x2 .x-key{display:flex;gap:4cqw;font:400 2.3cqw/1 var(--sans);color:var(--mute);margin-top:2cqw}
.x2 .x-key i{display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;border:.4cqw solid var(--ink);vertical-align:-.3cqw;margin-right:1cqw}

/* 10 곡 목록 */
.x2 .x-tracks{list-style:none;margin:2cqw 0;padding:0;counter-reset:t}
.x2 .x-tracks li{display:grid;grid-template-columns:9cqw 1fr;align-items:baseline;padding:1.5cqw 0;border-bottom:.2cqw solid var(--rule)}
.x2 .x-tracks li::before{counter-increment:t;content:"0" counter(t);font:400 3.8cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-tracks li b{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-tracks li small{display:block;font:400 2.5cqw/1.4 var(--sans);color:var(--mute);margin-top:.6cqw}
.x2 .x-tracks li.hl b{color:var(--red)}

/* 11 끝 */
.x2 .x-when{background:var(--ink);color:#f4efe6;padding:3.4cqw 3.8cqw;margin:2cqw 0;font:500 3.1cqw/1.55 var(--sans)}
.x2 .x-when b{display:block;font:600 2.3cqw/1 var(--mono);letter-spacing:.14em;color:#9fe0f2;margin-bottom:1.6cqw}
.x2 .x-wx{font:italic 400 4cqw/1.35 var(--it);color:var(--mute);border-left:.6cqw solid var(--cy);padding-left:3cqw}

/* 12 밤 */
.x2.x-dark{background:var(--night);color:#e8edf2}
.x2.x-dark::after{opacity:.25;mix-blend-mode:screen}
.x2.x-dark .x-rh,.x2.x-dark .x-folio{color:#8b97a8;border-color:rgba(232,237,242,.2)}
.x2.x-dark .x-rh b{color:#9fe0f2}
.x2 .x-clock{font:400 22cqw/1 var(--slab);letter-spacing:-.04em;color:#9fe0f2;margin:0}
.x2 .x-meta{display:grid;grid-template-columns:auto 1fr;gap:1cqw 3cqw;font:400 2.8cqw/1.45 var(--sans);margin:2cqw 0 3cqw;color:#c9d2dd}
.x2 .x-meta dt{font:600 2.3cqw/1.65 var(--mono);color:#8b97a8;letter-spacing:.1em}
.x2 .x-meta dd{margin:0}
.x2.x-dark .x-txt{color:#dfe5ec}
.x2 .x-three{list-style:none;margin:0 0 2.4cqw;padding:0;border-top:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li{display:flex;gap:3cqw;align-items:baseline;padding:2cqw 0;border-bottom:.2cqw solid rgba(232,237,242,.25)}
.x2 .x-three li b{font:400 3.4cqw/1 var(--slab);color:#9fe0f2}
.x2 .x-three li span{font:italic 400 5.4cqw/1.1 var(--it)}
.x2 .x-three li small{margin-left:auto;font:400 2.3cqw/1.3 var(--mono);color:#8b97a8;text-align:right}

/* 13 연재 */
.x2.x-pinkp{background:#f7e9ea}
.x2 .x-ser{display:flex;align-items:flex-end;gap:3cqw}
.x2 .x-ser b{font:400 17cqw/.85 var(--slab);color:var(--pink);-webkit-text-stroke:.35cqw var(--ink)}
.x2 .x-ser span{font:600 2.5cqw/1.5 var(--mono);letter-spacing:.12em;color:var(--mute);padding-bottom:1cqw}

/* 14 앞줄 */
.x2 .x-front{display:inline-block;background:#ffe14d;color:var(--ink);font:900 5.2cqw/1 var(--sans);padding:1.6cqw 3cqw;transform:rotate(-3deg);box-shadow:.6cqw .6cqw 0 var(--ink);margin-bottom:2.4cqw}
.x2 .x-band{border-top:.6cqw solid var(--ink);padding:2cqw 0 1.4cqw}
.x2 .x-band h3{margin:0;font:900 4.6cqw/1.2 var(--serif);letter-spacing:-.02em}
.x2 .x-band h3 small{font:500 2.7cqw/1 var(--sans);color:var(--mute);margin-left:1.4cqw;letter-spacing:0}
.x2 .x-band p{margin:1cqw 0 0;font:400 2.9cqw/1.6 var(--sans);word-break:keep-all}
.x2 .x-live{background:#ece5d6;padding:2.6cqw 3.4cqw 0;margin-top:1.6cqw}
.x2 .x-live .x-kick{color:var(--red)}
.x2 .x-live .x-txt li{font-size:2.6cqw;padding:1.4cqw 0}

/* 15 편집 노트 */
.x2 .x-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:3cqw 0;border-top:.6cqw solid var(--ink)}
.x2 .x-nums div{padding:2.6cqw 1cqw 2.4cqw;border-bottom:.2cqw solid var(--rule);border-right:.2cqw solid var(--rule)}
.x2 .x-nums div:nth-child(3n){border-right:0}
.x2 .x-nums b{display:block;font:400 9cqw/1 var(--slab);color:var(--cy2)}
.x2 .x-nums span{display:block;font:500 2.5cqw/1.4 var(--sans);margin-top:1.2cqw;word-break:keep-all}
.x2 .x-colo{margin-top:auto;font:400 2.4cqw/1.7 var(--mono);color:var(--mute);border-top:.2cqw solid var(--rule);padding-top:2.4cqw}
.x2 .x-colo b{color:var(--ink);font-weight:600}

/* 16 부록 LP (single7 구조는 mag.js가 LP 그림으로 바꿔 끼운다) */
.x2 .single7{position:absolute;width:var(--w);aspect-ratio:1;transform:rotate(var(--r));cursor:pointer}
.x2 .single7 .sl{position:absolute;inset:0;background:#d4bf9e}
.x2 .single7 .bg{position:absolute;inset:-4% -4% -7%}
.x2 .single7 .tp{position:absolute;height:calc(var(--w)*.16);background:rgba(255,248,214,.55);border-left:1px dashed rgba(200,190,150,.6);border-right:1px dashed rgba(200,190,150,.6)}
.x2 .single7 .c2{position:absolute;left:-4cqw;right:-4cqw;top:calc(100% + 3cqw);text-align:center;font:700 3cqw/1.4 var(--sans);color:var(--ink)}
.x2 .single7 .c2 small{display:block;color:var(--mute);font-weight:400;font-size:2.5cqw}
.x2 .x-lpl{list-style:none;margin:2cqw 0 0;padding:0;columns:2;column-gap:5cqw}
.x2 .x-lpl li{break-inside:avoid;padding:1.2cqw 0;border-top:.2cqw solid var(--rule);font:400 2.5cqw/1.35 var(--sans)}
.x2 .x-lpl li b{display:block;font:600 2.2cqw/1.3 var(--mono);color:var(--cy2)}
.x2 .x-lpl li i{font:italic 400 3.6cqw/1.15 var(--it)}

/* ── 읽기 모드 (mag.js 읽기 창 안) ── */
.x2r{font-family:var(--serif);color:var(--rd-ink)}
.x2r :is(h1,h2){text-align:left}
.x2r .rhead{margin:0 0 1.8em;padding-bottom:1.2em;border-bottom:3px solid var(--rd-ink)}

<template class="art" data-id="letter" data-title="점수를 내려놓으며"><div class="x2r"><header class="rhead"><h1>점수를 내려놓으며</h1><p class="by">글 윤서해</p></header><span data-p="a"></span><p data-p="a.1">월요일 아침에 나오는 잡지가 두 번째 월요일을 맞았다. 그사이 우리는 하나를 내려놓기로 했다. 지난 호까지 판마다 달던 볼륨 숫자, 1부터 11까지의 그 눈금이다.</p><p data-p="a.2">이유는 단순하다. 이 지면을 만드는 편집부는 음악을 직접 듣지 못한다. 우리가 가진 것은 밴드가 한 말, 함께 일한 사람들의 이름, 녹음한 장소와 날짜, 다른 귀들이 남긴 기록이다. 그것만으로 판에 숫자를 매기는 것은 들은 척하는 일에 가깝다고 우리는 판단했다. 그래서 숫자 대신 이야기를 더 길게 쓰기로 했다.</p><span data-p="b"></span><p data-p="b.1">이번 호부터 커버 스토리는 한 밴드를 처음부터 끝까지 따라가는 긴 글이 된다. 모든 사실에는 출처가 붙고, 출처가 없는 것은 쓰지 않는다. 장면은 여전히 우리가 그려 넣지만, 그것이 우리의 상상이라는 것을 문장 안에서 밝힌다. 호를 넘어 이어지는 연재도 하나 시작한다. 밴드가 소리를 만든 방들에 대한 이야기다.</p><p data-p="b.2">긴 글이 휴대폰 화면에서 읽기 힘들다는 말도 들었다. 지면 아래의 '계속' 표시를 누르면 큰 글씨로 한 줄씩 이어 읽을 수 있게 고쳤다. 지면은 넘겨 보는 곳, 본문은 앉아서 읽는 곳이다.</p><p data-p="b.3">이번 호의 주인공은 공교롭게도 방 하나를 막 떠나보낸 밴드다. 개편 첫 호에 이보다 어울리는 이야기는 없었다.</p></div></template>
<template class="art" data-id="briefs" data-title="이번 주 밴드"><div class="x2r"><header class="rhead"><h1>이번 주 밴드</h1><p class="by">글 편집부</p></header><span data-p="b0"></span><p data-p="b0.1">웨이브스 — <span class="alb">[Cherry Soda]</span> (I Surrender)</p><p data-p="b0.2">샌디에이고의 웨이브스가 새 앨범을 냈다. 처음에는 세이 애니싱 쪽과 함께 만든 협업 앨범으로 9월에 나올 예정이었지만, 협업이 무산되자 네이선 윌리엄스는 이 앨범을 웨이브스 단독 앨범으로 다시 녹음하겠다고 밝혔다.</p><p data-p="b0.3">새로 공개된 싱글은 'Pinesol'. 발매일은 여러 번 바뀌었고, 위키백과 음반 목록과 얼터너티브 프레스는 11월 13일로 적고 있다. 발매를 앞두고 윌리엄스는 한 대담 프로그램에 나와 어린 시절과 자기 레이블 고스트 램프를 세운 이유를 이야기했다.</p><p class="note" data-p="b0.4">이럴 때 들을 것: 다시 처음부터 해야 하는 일을 앞둔 월요일 아침.</p><span data-p="b1"></span><p data-p="b1.1">앤벌린 — <span class="alb">[CURRENCY]</span></p><p data-p="b1.2">플로리다의 앤벌린이 매티 멀린스를 리드 보컬로 맞은 첫 정규를 냈다. 멤피스 메이 파이어의 보컬이기도 한 멀린스는 원년 보컬 스티븐 크리스천이 투어에서 물러난 뒤 공연 보컬로 합류했고, 그 자리가 녹음으로 이어졌다.</p><p data-p="b1.3">뉴 노이즈 매거진에 따르면 크리스천이 직접 멀린스에게 보컬을 맡아 달라고 청했다. 밴드는 <span class="alb">[Never Take Friendship Personal]</span>, <span class="alb">[Cities]</span>, <span class="alb">[Vital]</span> 시절에 끝내지 못한 아이디어들을 다시 손봤다고 한다. 스위치풋과 함께한 'Trenches'가 실렸다.</p><p class="note" data-p="b1.4">이럴 때 들을 것: 오래된 친구가 다른 사람에게 자리를 넘겨주는 장면을 지켜본 날.</p></div></template>
<template class="art" data-id="cover" data-title="방 하나를 비우는 일 — 브레인스토리"><div class="x2r"><header class="rhead"><h1>방 하나를 비우는 일 — 브레인스토리</h1><p class="by">글 윤서해</p></header><span data-p="s0"></span><p data-p="s0.1">이건 내가 그려 본 장면이다. 롱비치의 어느 작은 방, 바닥에는 마스킹테이프 자국이 남아 있다. 드럼 스탠드가 서 있던 자리, 앰프를 밀어 넣던 구석, 케이블이 늘 엉켜 있던 문턱. 짐을 다 뺀 방은 생각보다 넓어 보인다. 셋이 들어가면 꽉 차고 다섯이 들어가면 겨우 몸을 돌리던 방이었는데, 비우고 나니 그저 네모난 빈 공간일 뿐이다. 마지막으로 나가는 사람이 불을 끄기 전에 한 번 돌아본다. 오후의 바다 안개가 창에 붙어 있다.</p><p data-p="s0.2">밴드는 그 방을 슈박스, 신발 상자라고 불렀다.</p><h2 data-p="s1">왜 지금</h2><p data-p="s1.1">11월 13일 금요일, 캘리포니아의 3인조 브레인스토리가 일곱 곡짜리 EP <span class="alb">[Shoebox Days]</span>를 빅 크라운 레코드에서 냈다. 제목은 그 방에서 왔다. 레이블의 소개에 따르면 슈박스는 밴드가 오랫동안 써 온 롱비치의 작업실이었고, 이 EP는 그 방에서 보낸 시간과 거기서 만든 녹음에 바치는 인사다.</p><p data-p="s1.2">사정은 이렇다. 밴드는 몇 해 전 그 방에서 시작했다가 끝내지 못한 곡들을 다시 꺼내 마무리했고, 완성한 녹음을 레이블에 넘겼다. 그리고 얼마 지나지 않아 그 방을 비워야 한다는 소식을 들었다. 마지막 녹음이 끝나자마자 방이 사라진 셈이다. 음반점들의 소개 글은 이 판을 한 시절의 끝이라고 적었다.</p><p data-p="s1.3">정규 앨범도 아니고, 일곱 곡짜리 EP다. 그런데도 이 판을 개편 첫 호의 표지에 올린 데는 이유가 있다. 이 잡지는 밴드를 한 방의 소리라고 믿는다. 여기 정말로 방 하나에 대한 판이 나왔다. 그리고 그 방이 어떻게 생겼고 왜 사라졌는지를 따라가다 보면, 한 밴드가 십 몇 년에 걸쳐 스스로 녹음하는 법을 배운 이야기가 나온다.</p><h2 data-p="s2">리알토</h2><p data-p="s2.1">이야기는 롱비치보다 한참 내륙에서 시작한다. 로스앤젤레스 동쪽, 사람들이 인랜드 엠파이어라고 부르는 넓은 분지의 도시 리알토다. 케빈 마틴과 토니 마틴 형제가 거기서 자랐다. 케빈이 기타, 토니가 베이스를 맡고 둘 다 노래한다.</p><p data-p="s2.2">음악은 집 안에서 먼저 왔다. 케빈은 여러 인터뷰에서 형제가 음악을 처음 접한 곳으로 아버지를 꼽았다. 교회에서 노래하던 아버지였다. 올봄 한 대학 잡지와의 인터뷰에서 그는 집안에 가스펠 가수와 색소폰 연주자가 함께 있었고, 그 두 세계를 하나로 합치는 것이 처음부터의 목표였다고 말했다.</p><p data-p="s2.3">다만 그 동네에는 무대가 별로 없었다. 케빈은 인랜드 엠파이어에 기회랄 것이 거의 없었다고, 만날 사람도 설 무대도 드물었다고 돌아본 적이 있다. 그래서 형제는 동네 밖으로 나가 연주하기 시작했다. 대신 동네는 다른 것을 줬다. 밴드는 같은 인터뷰에서 그 지역을 자신들의 소리를 키운 인큐베이터처럼 설명했다. 펑크, 디제이 퀵 같은 서부 힙합, 뒷마당 파티에서 울리던 부기 음악이 한데 뒤섞이던 곳이었다고.</p><h2 data-p="s3">세 번째 사람</h2><p data-p="s3.1">드러머 에릭 해그스트롬은 형제가 아니지만 밴드는 그를 형제처럼 소개한다. 케빈과 에릭은 음악 학교에서 처음 만났다. 같은 시기 토니는 재즈 베이스를 공부하러 샌프란시스코로 떠나 있었다. 한 인터뷰는 셋이 지역 커뮤니티 칼리지에서 공부하던 2010년 무렵 밴드의 모양이 갖춰졌다고 적는다.</p><p data-p="s3.2">이 조합이 브레인스토리의 소리를 설명한다고 나는 생각한다. 형제는 스케이트보드와 펑크를 대하던 방식으로 음악을 했고, 에릭은 재즈를 좋아했다. 거칠게 부딪치는 쪽과 정확하게 맞추는 쪽이 한 방에 들어간 것이다. 그들의 음악을 소개하는 글들이 재즈, 소울, 펑크(funk), 사이키델리아를 한 줄에 늘어놓는 데는 이런 내력이 있다.</p><h2 data-p="s4">포터스튜디오에서 퀸스까지</h2><p data-p="s4.1">처음에는 녹음도 직접 했다. 케빈은 한 인터뷰에서 밴드가 8트랙 포터스튜디오, 카세트테이프에 여러 트랙을 겹쳐 녹음하는 작은 기계로 첫 녹음들을 만들었다고 말했다.</p><p data-p="s4.2">2017년 5월에 나온 첫 미니 앨범은 친구 밴드의 손을 거쳤다. 치카노 배트맨의 베이시스트 에두아르도 아레나스가 프로듀서를 맡았고, 초기 음반들은 치카노 배트맨이 운영하던 레이블 엘 레예노에서 나왔다. 그해 여름 LA 레코드와의 인터뷰에서 케빈은 공연이 밴드의 주된 수입이 됐다고 말했다. 그 인터뷰의 제목이 된 그의 말이 있다. "Our souls are infinite." 우리의 영혼은 끝이 없다는 뜻이다.</p><blockquote class="pull" data-p="s4.3">셋이 들어가면 꽉 차고, 다섯이 들어가면 겨우 몸을 돌리던 방. 브레인스토리는 그 방에서 스스로 녹음하는 법을 배웠다.</blockquote><p data-p="s4.4">치카노 배트맨은 다리도 놓아 줬다. 그들의 소개로 브레인스토리는 뉴욕의 빅 크라운 레코드, 그리고 레이블의 공동 운영자이자 프로듀서인 리언 미셸스를 만났다. 셋은 퀸스로 날아가 미셸스가 운영하는 다이아몬드 마인 스튜디오에서 열흘 동안 열 곡을 녹음했다. 그것이 2019년 11월 15일에 나온 첫 정규 <span class="alb">[Buck]</span>이다. 크레딧에 따르면 미셸스는 프로듀서를 맡은 데 더해 오르간과 건반, 퍼커션, 플루트까지 직접 연주했다.</p><p data-p="s4.5">반응은 따뜻했다. 영국의 소울 웹진 UK 바이브는 이 판을 질 좋은 현대 소울 음반으로 평가하면서, 곡들이 꽤 엉뚱하고 별난데도 잘난 척하는 구석이 없다는 점을 짚었다. 레이블과 음반점들은 첫 곡 'Breathe'와 'Dead End'를 앞세웠다.</p><h2 data-p="s5">봉쇄, 그리고 방</h2><p data-p="s5.1">그다음은 모두가 아는 시간이다. 2021년 6월 25일에 나온 EP <span class="alb">[Ripe]</span>는 레이블 설명대로 코로나19 봉쇄가 한창일 때 녹음됐다. 레이블은 이 판이 재즈와 힙합, 70년대 펑크, 60년대 소울, 그리고 2021년 남부 캘리포니아의 삶에서 재료를 끌어왔다고 소개했다. 'Seasons'가 그 판에 있다.</p><p data-p="s5.2">이 무렵 밴드는 과감한 결정을 내렸다. 롱비치에 자기들의 작업실을 직접 짓기로 한 것이다. 기술적인 일은 에릭이 앞장섰다. 한 라디오 인터뷰에서 형제는 에릭이 롱비치에 우리 스튜디오를 지었고, 거기서 데모와 다른 작업들을 녹음해 왔다고 말했다. 그 방이 슈박스다.</p><p data-p="s5.3">케빈은 앞의 인터뷰에서 녹음하는 법을 제대로 배운 것은 리언 미셸스를 만나고부터였고, 아레나스도 오랫동안 스튜디오에서 일하는 법을 보여 줬다고 말했다. 퀸스에서 열흘 동안 어깨너머로 본 것을 롱비치의 작은 방에서 하나씩 손에 익힌 셈이다.</p><h2 data-p="s6">한 방의 소리</h2><p data-p="s6.1">이 잡지가 밴드를 볼 때 꼭 찾는 장면이 있다. 멤버들이 같은 순간에 같은 소리를 내는 장면이다. 브레인스토리의 경우 그 장면은 그들의 작업 순서에 있다. 토니는 한 인터뷰에서 밴드가 보통 반주를 셋이 함께 녹음하고, 노래는 케빈이 나중에 얹는다고 설명했다. 곡의 몸통은 한 방에서 셋이 동시에 만든다는 뜻이다. 케빈은 다른 인터뷰에서 어떤 곡은 한 사람이 혼자 쌓아 올리고, 어떤 곡은 스튜디오에서 다 같이 맞춰 본다고 덧붙였다.</p><p data-p="s6.2">두 번째 정규 <span class="alb">[Sounds Good]</span>은 2024년 4월 19일에 나왔다. 프로듀서는 다시 미셸스였다. 여러 음반점 소개 글은 이 판이 롱비치의 자기 작업실에서 쉬지 않고 작업할 수 있었던 덕을 봤다고 적었다. UCLA 라디오 인터뷰에 따르면 제목은 녹음실 습관에서 나왔다. 테이크가 괜찮은지 확인할 때마다 서로에게 하던 말이 "사운즈 굿"이었다는 것이다. 좁은 방에서 셋이 서로를 쳐다보며 고개를 끄덕이는 모습이, 제목 하나에 들어 있다.</p><p data-p="s6.3">그해 10월 4일, 밴드는 <span class="alb">[Sounds Good]</span>의 노래를 뺀 연주판을 따로 냈다. 첫 정규 <span class="alb">[Buck]</span>에도 같은 연주판이 있다. 셋이 함께 녹음한 반주만으로 한 장이 된다고 밴드 스스로 판단했다는 뜻이고, 이 잡지는 그 판단을 반가워한다. 목소리를 걷어 내면 남는 것이 바로 그 방에서 셋이 동시에 낸 소리이기 때문이다.</p><p data-p="s6.4">케빈은 그 무렵 한 인터뷰에서 밴드의 소리가 마침내 모두가 자신 있어 하는 단단한 자리로 자랐다고 말했다. 밴드가 자기 곡을 직접 소개한 글도 있다. 'Peach Optimo'를 두고 밴드는 남부 힙합의 튀는 리듬과 캘리포니아 지펑크, 재즈를 섞은 느긋한 하프타임 곡이라고 적었다. 앨범의 마지막 곡 제목은 'Rialto Winds', 고향 리알토의 바람이다. 롱비치의 방에서 만든 판이 고향 이름으로 끝난다.</p><p data-p="s6.5">발매에 맞춰 로스앤젤레스의 공연장 로지 룸에서 연 기념 행사는 매진됐다. UCLA 라디오에 따르면 그 자리는 연주 대신 레코드를 틀어 새 앨범을 함께 듣는 자리로 꾸렸다. 그해 9월에는 브라질의 마르코스 발리, 아지무스의 미국 서부 공연에 함께 섰다. 로스앤젤레스의 포드 극장, 샌디에이고, 버클리로 이어진 무대였다.</p><h2 data-p="s6b">곡 목록으로 읽는 십 년</h2><p data-p="s6b.1">나는 이 밴드의 판을 들을 수 없어서 곡 목록을 오래 들여다봤다. 이름만으로도 보이는 것이 있다.</p><p data-p="s6b.2"><span class="alb">[Buck]</span>의 A면은 'Breathe', 'Mnemophobia', 'Sorry', 'Dead End', 'Peter Pan'으로 흘러간다. 숨 쉬라는 말로 시작해서 기억을 두려워하는 병, 사과, 막다른 길을 지나 자라지 않는 소년에서 멈춘다. 첫 정규를 내는 밴드의 불안과 고집이 다섯 개의 단어에 다 들어 있다. B면은 철자를 일부러 비튼 'Beautyful Beauti'로 연다.</p><p data-p="s6b.3">봉쇄 중에 만든 <span class="alb">[Ripe]</span>에는 'Seasons', 'Long Day', 'Bye Bye' 같은 이름이 있고, 'Long Day'는 판 안에서 한 번 더 돌아온다. 같은 하루가 반복되던 그 시절을 생각하면 우연으로만 보이지 않는다.</p><p data-p="s6b.4"><span class="alb">[Sounds Good]</span>은 'Nobody But You'로 열고 'Gift Of Life', 'I Will Be', 'Stay'를 거쳐 'Rialto Winds'로 닫는다. 붙잡고, 머물고, 고향으로 돌아가는 단어들이다. 세 장을 나란히 놓으면 불안에서 머묾으로 옮겨 가는 십 년이 보인다. 이건 곡 이름으로 읽은 내 해석이다. 노래가 실제로 무엇을 말하는지는 각자의 귀에 맡긴다.</p><h2 data-p="s7">슈박스의 나날</h2><p data-p="s7.1">그리고 이번 EP다. 레이블 소개를 따라 방을 다시 그려 보면 이렇다. 장비와 매력과 온갖 제약이 빽빽하게 들어찬 작은 방. 밴드가 자기 방식으로 음반 만드는 법을 배우는 동안 악기와 녹음 장비와 쌓인 잡동사니가 그 좁은 공간을 채웠다. 사람이 가장 많이 들어갔을 때는 다섯이 겨우 움직일 수 있었다.</p><p data-p="s7.2">곡 목록은 'The Watchers'로 시작해 'Blend', 'Twin Kitchen', 'Home Alone', 'Lone Traveler', 'Gravity Hill'을 지나 'Necessary Loss'로 끝난다. 첫 곡에는 이야기가 있다. 레이블에 따르면 'The Watchers'는 인랜드 엠파이어에 떠돌던 도시 전설, 막다른 골목을 지나는 차를 정체 모를 사람들이 쫓아온다는 이야기에서 나왔다. 한 음반점은 이 곡이 곧장 귀에 걸리는 관악 후렴과 거친 드럼, 지펑크 베이스, 풍성한 현악 편곡으로 열린다고 소개했다. 나는 이 곡을 들어 보지 못했으니, 그 말은 음반점의 것으로 남겨 둔다.</p><p data-p="s7.3">내가 할 수 있는 말은 곡 순서에 대한 것이다. 롱비치의 방에 대한 판이 리알토의 골목 이야기로 시작한다. 지난 앨범이 고향의 바람으로 끝났던 것처럼, 이 밴드는 어디서 녹음하든 출발점을 잊지 않는다. 그리고 마지막 곡의 이름은 '필요한 상실'이다. 방을 잃은 밴드가 판의 끝에 그 이름을 붙였다는 것, 나는 그것을 하나의 대답으로 읽는다.</p><h2 data-p="s8">아쉬움에 대하여</h2><p data-p="s8.1">솔직히 적어 둘 것도 있다. 이 판은 새로 쓴 곡들의 모음이라기보다 끝내지 못한 녹음을 정리한 판에 가깝다. 레이블도 상당수가 몇 해 전 재료에서 출발했다고 밝혔다. 2년 반 넘게 새 판을 기다린 사람이라면 일곱 곡짜리 정리 앨범이 조금 아쉬울 수 있다. 이 밴드라면 슈박스에서 새 정규 한 장을 더 만들 수 있었을 것이다.</p><p data-p="s8.2">또 하나. 이 글을 쓰는 동안 우리는 이번 판을 누가 녹음하고 다듬었는지에 대한 공식 크레딧을 확인하지 못했다. 그 방의 마지막 녹음을 누가 걸었는지, 밴드가 끝까지 직접 했는지는 지금 우리가 말할 수 없다. 확인되면 다음 호에 적겠다.</p><p data-p="s8.3">그래도 나는 이 판이 정리 앨범이라는 사실이 곧 이 판의 의미라고 생각한다. 이사를 앞둔 사람이 서랍 깊은 곳의 사진을 꺼내 앨범에 끼우듯, 밴드는 그 방에서 시작한 것들을 끝까지 마무리하고서야 방을 떠났다. 시작한 곡을 끝내는 것도 밴드의 일이다. 그리고 그 일을, 그 방이 아직 있을 때 해냈다.</p><h2 data-p="s9">이 밴드가 지키는 것</h2><p data-p="s9.1">열 몇 해를 따라오면 하나의 선이 보인다. 포터스튜디오로 혼자 녹음하던 밴드가 친구의 손을 빌렸고, 퀸스에서 열흘 동안 배웠고, 봉쇄의 시간에 자기 방을 지었고, 그 방에서 스스로 판을 만들었다. 매번 녹음하는 방이 바뀌었지만 셋은 바뀌지 않았다. 형제 둘과, 형제처럼 불리는 친구 하나.</p><p data-p="s9.2">방은 사라져도 방에서 배운 것은 남는다. 셋이 같은 공간에서 반주를 먼저 맞추고, 누군가 "사운즈 굿" 하고 고개를 끄덕이는 그 순서는 다음 방에서도 그대로일 것이다.</p><h2 data-p="s10">다시, 빈 방</h2><p data-p="s10.1">판이 나온 금요일 밤, 공연 일정표(Shazam·Bandsintown)에 따르면 브레인스토리는 리버사이드의 팜 하우스 콜렉티브에서 연주했다. 형제가 자란 인랜드 엠파이어 안이다. 내년 2월에는 북부 캘리포니아 세바스토폴, 5월에는 마드리드와 산세바스티안, 쾰른, 뮌헨, 베를린으로 이어지는 유럽 일정이 잡혀 있다.</p><p data-p="s10.2">다시 처음의 장면으로 돌아간다. 이것도 내가 그려 본 장면이다. 바닥의 테이프 자국을 떼어 내고, 열쇠를 돌려주고, 차에 마지막 상자를 싣는다. 상자 하나가 유난히 작다. 셋은 그 상자에 무엇이 들었는지 안다. 그리고 차는 고속도로를 타고 동쪽, 리알토 쪽으로 간다.</p><p class="note" data-p="s10.3">이럴 때 들을 것: 이사 전날 밤, 짐을 다 싼 방에서 마지막 상자의 테이프를 붙이기 전.</p><p class="note" data-p="s10.4">그 빈 방에 내가 그려 넣은 날씨 — 롱비치, 바다 안개, 해 질 무렵 갬.</p></div></template>
<template class="art" data-id="night" data-title="이 판과 어울리는 밤 — 마지막 상자를 묶는 밤"><div class="x2r"><header class="rhead"><h1>이 판과 어울리는 밤 — 마지막 상자를 묶는 밤</h1><p class="by">글 윤서해</p></header><span data-p="n0"></span><p data-p="n0.1">시간: 밤 11시 20분. 날씨: 늦가을 비, 그친 뒤의 젖은 공기. 장소: 내일 이사 나가는 원룸.</p><p data-p="n0.2">이건 내가 그려 본 장면이다. 짐은 거의 다 쌌다. 책은 상자 세 개, 그릇은 신문지에 싸서 하나, 남은 것은 책상 위의 작은 스피커와 휴대폰, 그리고 아직 테이프를 붙이지 않은 마지막 상자다. 커튼을 떼어 낸 창이 생각보다 크다. 가로등 불빛이 바닥에 그대로 떨어진다.</p><span data-p="n1"></span><p data-p="n1.1">처음 거는 곡은 'The Watchers'다. 막다른 골목을 지나는 차를 누군가 쫓아온다는, 리알토의 오래된 동네 이야기에서 나온 곡이라고 레이블은 설명한다. 이삿날 전야에는 어쩐지 어릴 적 동네 생각이 난다. 이 집에 오기 전의 집, 그 전의 골목.</p><p data-p="n1.2">두 번째는 'Blend'. 섞는다는 뜻의 제목이다. 이 방에서 지낸 몇 해의 물건들이 상자 안에서 뒤섞여 있다. 영수증과 편지와 공연 티켓이 같은 봉투에 들어가는 밤이다.</p><p data-p="n1.3">마지막은 'Necessary Loss'. 판의 마지막 곡이고, 마지막 상자에 테이프를 붙일 때 맞춰 두면 좋겠다. 곡이 끝나면 스피커도 상자에 넣는다. 방에는 이제 아무 소리도 없다.</p><span data-p="n2"></span><p data-p="n2.1">세 곡을 고른 이유는 소리가 아니라 이름과 순서다. 우리는 이 곡들을 들을 수 없어서, 밴드가 붙인 이름과 곡을 놓은 차례를 따라 밤을 짰다. 들어 보고 장면이 다르게 떠오른다면 그 장면이 맞다.</p></div></template>
<template class="art" data-id="rooms" data-title="연재 &#x27;방&#x27; 1회 — 빅 핑크, 이름만 남긴 방"><div class="x2r"><header class="rhead"><h1>연재 '방' 1회 — 빅 핑크, 이름만 남긴 방</h1><p class="by">글 윤서해</p></header><span data-p="r0"></span><p data-p="r0.1">이번 호부터 이 잡지가 나올 때마다, 밴드가 소리를 만든 방들을 하나씩 찾아간다. 녹음실일 때도 있고, 지하실이나 거실일 때도 있을 것이다. 첫 회는 슈박스와 반대쪽 끝에 있는 방이다. 앨범에 이름을 주었지만 정작 그 앨범은 거기서 녹음되지 않은 방.</p><span data-p="r1"></span><p data-p="r1.1">뉴욕주 웨스트 소거티스에 분홍색 집이 한 채 있다. 사람들은 그 집을 빅 핑크라고 불렀다. 1967년 6월부터 10월까지 밥 딜런과, 곧 더 밴드라는 이름을 갖게 될 연주자들이 그 집 지하실에서 수많은 곡을 녹음했다. 남의 노래와 딜런의 새 곡이 섞인 그 녹음들이 훗날 <span class="alb">[The Basement Tapes]</span>로 알려진다. 집에는 릭 댄코, 리처드 매뉴얼, 가스 허드슨이 함께 살았다.</p><span data-p="r2"></span><p data-p="r2.1">이듬해 나온 더 밴드의 첫 앨범 제목이 <span class="alb">[Music from Big Pink]</span>다. 곡의 일부가 그 집에서 쓰였다. 그런데 앨범 자체는 그 지하실에서 녹음되지 않았다. 기록에 따르면 1968년 초, 뉴욕의 A&amp;R 레코딩과 로스앤젤레스의 캐피톨 스튜디오에서 만들어졌다. 한 신문 기사는 그 지하실이 녹음하기에 좋은 공간이 아니었던 것도 이유라고 전한다. 'The Weight'가 그 앨범에 있다.</p><span data-p="r3"></span><p data-p="r3.1">그러니까 빅 핑크는 소리를 만든 방이라기보다 소리가 태어난 방이다. 다섯이 모여 매일 연주하고, 곡을 쓰고, 서로의 버릇을 익힌 곳. 정식 녹음은 더 좋은 방에서 했지만, 앨범은 그 집의 이름을 달았다. 밴드가 자기 소리의 출처를 어디로 기억하는지 보여 주는 이름 짓기다.</p><p data-p="r3.2">슈박스는 그 반대다. 브레인스토리는 그 방에서 실제로 녹음했고, 방이 사라진 뒤 그 녹음을 묶어 방의 이름을 붙였다. 하나는 이름만 남긴 방, 하나는 소리와 이름을 함께 남긴 방이다. 이 연재는 그 사이 어딘가에 있는 방들을 찾아다닐 것이다.</p><p class="note" data-p="r3.3">다음 회 예고: 2회는 거실이다. 집 안에서 녹음한 밴드 앨범 하나를 골라 그 거실을 찾아간다.</p></div></template>
<template class="art" data-id="front" data-title="앞줄 — 신인 두 팀"><div class="x2r"><header class="rhead"><h1>앞줄 — 신인 두 팀</h1><p class="by">글 앞줄</p></header><span data-p="f0"></span><p data-p="f0.1">매주 신인 세 팀을 약속했는데, 이번 주는 두 팀이다. 출처 두 곳 이상으로 확인된 첫 EP와 첫 정규를 찾다 보니 그렇게 됐다. 모자라게 채우느니 정직하게 두 팀만 싣는다.</p><span data-p="f1"></span><p data-p="f1.1">잔물결 — 첫 정규 <span class="alb">[사랑의 히치하이커]</span></p><p data-p="f1.2">창원에서 활동하는 밴드다. 경남도민일보에 따르면 2023년 첫 EP 이후 3년 만에 낸 첫 정규로, 열 곡이 담겼다. 경남음악창작소의 음반 제작 지원 사업에 선정돼 만들었고 음원은 미러볼뮤직으로 나왔다. 2023년 11월에 나온 첫 EP의 제목은 <span class="alb">[꿈은 없던 일]</span>. 경남음악창작소 웹진은 이 밴드가 2022년 결성 이후 창원을 중심으로 활동해 왔다고 적었다. 서울이 아닌 도시에서 첫 정규까지 온 밴드, 앞줄은 이런 이야기에 약하다!</p><span data-p="f2"></span><p data-p="f2.1">아이우에오 — 첫 EP <span class="alb">[BE MY HUG]</span></p><p data-p="f2.2">드림, 다영, 현수, 서유. 네 명의 밴드가 10월 1일 첫 EP를 냈다. 뉴스엔에 따르면 일곱 곡 모두 멤버들이 작사·작곡에 참여했고, '신발끈'은 같은 소속사 선배 한로로가 가사를 함께 썼다. 데뷔 한 달여 만에 연 첫 단독 공연 표가 다 팔렸다는 소식도 여러 매체에 실렸다. 첫 EP부터 일곱 곡을 직접 쓴 밴드라니, 다음 판이 벌써 궁금하다.</p><p class="note" data-p="f2.3">들을 곡 하나: 아이우에오는 '신발끈'. 잔물결은 아직 한 곡을 고르지 못했다. 첫 곡부터 차례로 듣기를 권한다.</p></div></template>
<template class="art" data-id="live" data-title="공연 소식"><div class="x2r"><header class="rhead"><h1>공연 소식</h1><p class="by">글 편집부</p></header><span data-p="l0"></span><p data-p="l0.1">확인된 것만 싣는다. 날짜와 장소는 예매처와 공연 일정표에서 다시 확인하고 가자.</p><ul><li data-p="l0.2">슬로우다이브 내한 — 12월 8일(화) 오후 8시. 장소는 KBS 아레나로 알려졌지만 예매처 주소 표기가 엇갈린다. 표를 사기 전에 예매처 공지를 확인할 것.</li><li data-p="l0.3">5 세컨즈 오브 서머 — 11월 19일(목) 오후 7시 30분, 킨텍스 제1전시장 1홀(NOL 인터파크).</li><li data-p="l0.4">브레인스토리 — 이번 호 커버의 밴드. 2027년 2월 12일 세바스토폴(미국), 5월 마드리드·산세바스티안·쾰른·뮌헨·베를린. 아시아 일정은 아직 없다.</li></ul></div></template>
<template class="art" data-id="desk" data-title="편집 노트"><div class="x2r"><header class="rhead"><h1>편집 노트</h1><p class="by">글 편집부</p></header><span data-p="d0"></span><p data-p="d0.1">이번 호를 만든 방법을 적어 둔다.</p><ul><li data-p="d0.2">커버 스토리의 사실 문장은 모두 아래 출처 가운데 하나 이상을 가리킨다. 커버 스토리에 쓴 출처는 서로 다른 곳 18곳, 호 전체로는 31곳이다.</li><li data-p="d0.3">소리를 묘사한 문장은 둘이다. 둘 다 출처(밴드 자신의 곡 소개, 음반점 소개 글)를 문장 안에 밝혔다. 편집부는 이 판을 듣지 못했다.</li><li data-p="d0.4">장면 세 곳(커버 스토리 처음과 끝, 이 판과 어울리는 밤)은 편집부의 상상이며, 문장 안에 그렇게 적었다.</li><li data-p="d0.5">가사 인용은 없다. 직접 인용은 케빈 마틴의 한 문장(LA 레코드, 2017)뿐이다.</li><li data-p="d0.6">초고에서 지운 것: 출처가 한 곳뿐이거나 서로 엇갈린 사실 일곱 가지. 집안의 음악 취향 목록, 케빈의 창법 변화에 대한 발언, 'Peach Optimo'의 작곡자 표기, 이번 EP의 녹음·엔지니어 크레딧, 아이우에오의 단독 공연 날짜, 잔물결의 정확한 발매일, 이번 주 다른 밴드 한 팀의 발매일.</li><li data-p="d0.7">이번 호부터 점수(볼륨)를 싣지 않는다. 이유는 편집장의 글에.</li></ul><span data-p="d1"></span><p data-p="d1.1">다음 호 예고: 연재 '방' 2회는 거실. 신인 데스크는 세 팀을 다시 채우는 것을 목표로 한다.</p><h2 data-p="d2">출처</h2><ul><li data-p="d2.1">Big Crown Records, 브레인스토리 소개·<span class="alb">[Shoebox Days]</span> 소개 <a href="https://bigcrownrecords.com/artists/brainstory/" target="_blank" rel="noopener">https://bigcrownrecords.com/artists/brainstory/</a></li><li data-p="d2.2">Big Crown Records, Shoebox Days EP <a href="https://bigcrownrecords.com/store/shoebox-days-ep/" target="_blank" rel="noopener">https://bigcrownrecords.com/store/shoebox-days-ep/</a></li><li data-p="d2.3">Rough Trade, Shoebox Days <a href="https://www.roughtrade.com/en-us/product/brainstory/shoebox-days" target="_blank" rel="noopener">https://www.roughtrade.com/en-us/product/brainstory/shoebox-days</a></li><li data-p="d2.4">Horizons Music, Shoebox Days(곡 목록) <a href="https://www.horizonsmusic.co.uk/products/brainstory-shoebox-days-12ep-bottle-clear-vinyl" target="_blank" rel="noopener">https://www.horizonsmusic.co.uk/products/brainstory-shoebox-days-12ep-bottle-clear-vinyl</a></li><li data-p="d2.5">Talon Marks / Wings Magazine, 2026-05-22 <a href="https://www.talonmarks.com/wings-magazine/20
