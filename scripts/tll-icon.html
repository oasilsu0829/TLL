<!doctype html>
<!-- T/L/L 앱 아이콘 4안. tll-icon.cjs가 #<안> 하나를 잘라 public/icon-*.png로 뽑는다 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=block">
<style>
body { margin: 0; background: #e4e4e7; font-family: 'Space Grotesk', sans-serif; }
.sheet { display: flex; gap: 40px; padding: 40px; flex-wrap: wrap; }
.cell { text-align: center; font: 700 22px 'JetBrains Mono', monospace; color: #3f3f46; }
.ic { width: 512px; height: 512px; position: relative; overflow: hidden; margin-bottom: 14px; }
.sheet .ic { border-radius: 112px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.w { position: absolute; inset: 0; display: grid; place-items: center; }
.t { font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.t i { font-style: normal; }
/* A 명판: 검정 바탕, 흰 글자, 빨간 사선 */
#A { background: #18181b; }
#A .t { color: #fafafa; font-size: 168px; } #A .t i { color: #ef4444; margin: 0 -8px; }
#A .sub { position: absolute; bottom: 92px; width: 100%; text-align: center; font: 700 22px 'JetBrains Mono'; letter-spacing: .5em; color: #71717a; padding-left: .5em; }
/* B 판: 검은 LP + 빨간 라벨 */
#B { background: #f4f4f5; }
#B .lp { position: absolute; inset: 36px; border-radius: 50%; background: repeating-radial-gradient(circle, #111 0 3px, #1c1c1f 3px 5px); box-shadow: inset 0 0 0 6px #0a0a0a; }
#B .lp::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 40deg, rgba(255,255,255,.14) 60deg, transparent 80deg 220deg, rgba(255,255,255,.1) 240deg, transparent 260deg); }
#B .lbl { position: absolute; left: 50%; top: 50%; width: 236px; height: 236px; margin: -118px; border-radius: 50%; background: #e11d2a; display: grid; place-items: center; z-index: 1; }
#B .t { color: #fff; font-size: 58px; } #B .t i { opacity: .55; margin: 0 -3px; }
#B .hole { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: #f4f4f5; z-index: 2; }
#B .lbl .t { transform: translateY(-46px); }
/* C 세로 쌓기: 흰 바탕, 글자 셋을 사선으로 */
#C { background: #fafafa; }
#C .st { position: absolute; inset: 0; }
#C .st b { position: absolute; font-size: 210px; color: #18181b; line-height: 1; font-weight: 700; }
#C .st b:nth-child(1) { left: 70px; top: 40px; } #C .st b:nth-child(2) { left: 196px; top: 150px; } #C .st b:nth-child(3) { left: 322px; top: 260px; }
#C .sl { position: absolute; width: 10px; height: 640px; background: #ef4444; left: 251px; top: -64px; transform: rotate(-45deg); transform-origin: center; opacity: .9; }
/* D 각인: 헤어라인 알루미늄 */
#D { background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 1px, rgba(0,0,0,.035) 1px 3px), linear-gradient(160deg, #e7e7ea, #b9bac0 55%, #d9d9dd); }
#D .t { font-size: 150px; color: #3a3b40; text-shadow: 0 2px 0 rgba(255,255,255,.75), 0 -1px 0 rgba(0,0,0,.25); letter-spacing: .02em; }
#D .t i { color: #c81e1e; }
#D .dot { position: absolute; right: 70px; top: 70px; width: 22px; height: 22px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 18px #ef4444; }
#D .sub { position: absolute; bottom: 86px; width: 100%; text-align: center; font: 700 20px 'JetBrains Mono'; letter-spacing: .4em; color: #55565c; padding-left: .4em; }
</style></head><body>
<div class="sheet">
  <div class="cell"><div class="ic" id="A"><div class="w"><div class="t">T<i>/</i>L<i>/</i>L</div></div><div class="sub">RECORDS</div></div>A 명판</div>
  <div class="cell"><div class="ic" id="B"><div class="lp"></div><div class="lbl"><div class="t">T<i>/</i>L<i>/</i>L</div></div><div class="hole"></div></div>B 판 라벨</div>
  <div class="cell"><div class="ic" id="C"><div class="sl"></div><div class="st"><b>T</b><b>L</b><b>L</b></div></div>C 계단</div>
  <div class="cell"><div class="ic" id="D"><div class="w"><div class="t">T<i>/</i>L<i>/</i>L</div></div><div class="dot"></div><div class="sub">DIRECT DRIVE</div></div>D 각인</div>
</div>
</body></html>
