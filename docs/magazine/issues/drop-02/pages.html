<!--
Drop Vol.02 지면 (판형 2: 2:3, 쪽마다 <template class="pg">). 단위 cqw = 쪽 폭의 1%(쪽 높이 = 150cqw).
글은 articles.md에서 {{p ...}}로 가져온다. 만들기: python3 scripts/mag-issue.py docs/magazine/issues/drop-02
같은 Shadow DOM에 다른 판형 2 호(fb-02 등)의 CSS가 함께 들어온다. 그래서 이 호의 규칙은 모두 .iss-drop-02 아래에 걸고,
공용 이름(.x2 .x-in .x-rh .x-folio .x-more .x-txt)은 속성을 전부 다시 정한다. 이 호만의 장치는 d- 접두어.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;900&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#fbfaf6; --ink:#121212; --mute:#6b665e; --rule:rgba(18,18,18,.16);
  --pink:#f59ad6; --pink2:#b8306f; --blue:#2a2fb0; --orange:#f08a16; --navy:#16185a; --hall:#1b1a22;
  --dl:'Archivo Black',sans-serif; --dk:'Black Han Sans',sans-serif; --it:'Instrument Serif',Georgia,serif; --body:'Noto Serif KR',Georgia,serif; --ui:'Noto Sans KR',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --rd-bg:#fbfaf6; --rd-ink:#151515; --rd-accent:#b8306f; --rd-rule:rgba(18,18,18,.14); --rd-on:#fff; --rd-hit:rgba(245,154,214,.28);
}
/* ── 지면 공용 ── */
.iss-drop-02 .x2{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size;font-family:var(--body);-webkit-font-smoothing:antialiased}
.iss-drop-02 .x2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .4  0 0 0 0 .42  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.iss-drop-02 .x2 *{box-sizing:border-box}
.iss-drop-02 .x2 :is(h1,h2,h3){color:inherit;text-align:left;font-weight:400}
.iss-drop-02 .x2 .x-in{position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:12cqw;display:flex;flex-direction:column}
.iss-drop-02 .x2 .x-rh{position:absolute;left:7cqw;right:7cqw;top:4.6cqw;display:flex;justify-content:space-between;align-items:baseline;font:400 2.2cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:.5cqw solid var(--ink);padding-bottom:1.5cqw}
.iss-drop-02 .x2 .x-rh b{font:400 3cqw/1 var(--dl);letter-spacing:-.02em;text-transform:none;color:var(--ink)}
.iss-drop-02 .x2 .x-rh b i{font-style:normal;color:var(--pink2)}
.iss-drop-02 .x2 .x-folio{position:absolute;left:7cqw;right:7cqw;bottom:4.6cqw;display:flex;justify-content:space-between;font:400 2.2cqw/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.iss-drop-02 .x2 .x-folio span:first-child{font:400 2.6cqw/1 var(--dl);color:var(--ink)}
.iss-drop-02 .x2 .x-txt{font:400 3.45cqw/1.74 var(--body);word-break:keep-all;color:#1d1c1a}
.iss-drop-02 .x2 .x-txt p{margin:0 0 2.3cqw}
.iss-drop-02 .x2 .x-txt .note{font:400 2.9cqw/1.6 var(--ui);color:var(--mute)}
.iss-drop-02 .x2 .x-txt ul{margin:0;padding:0;list-style:none}
.iss-drop-02 .x2 .x-txt li{padding:1.8cqw 0;border-top:.2cqw solid var(--rule);font:400 3cqw/1.55 var(--ui)}
.iss-drop-02 .x2 .x-txt .pull,.iss-drop-02 .x2 .x-txt blockquote{margin:0}
.iss-drop-02 .x2 .x-more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:1.6cqw;border:0;border-radius:0;background:var(--ink);color:var(--paper);font:700 3.1cqw/1 var(--ui);padding:3.2cqw 4.4cqw;cursor:pointer;min-height:11cqw;box-shadow:1cqw 1cqw 0 var(--pink)}
.iss-drop-02 .x2 .x-more i{font-style:normal;font-size:2.3cqw;color:var(--pink)}
.iss-drop-02 .x2 .x-more:focus-visible{outline:.6cqw solid var(--blue);outline-offset:.8cqw}
.iss-drop-02 .x2.d-dark .x-more{background:var(--pink);color:var(--ink);box-shadow:1cqw 1cqw 0 rgba(255,255,255,.25)}
.iss-drop-02 .x2.d-dark .x-more i{color:var(--ink)}
.iss-drop-02 .x2 .d-row{display:flex;gap:3cqw;flex-wrap:wrap;margin-top:auto;align-items:flex-end}
.iss-drop-02 .x2 .d-row .x-more{margin-top:0}
/* 글자 장치 */
.iss-drop-02 .x2 .d-kick{font:600 2.4cqw/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--pink2)}
.iss-drop-02 .x2 .d-h{font:400 9.6cqw/1.08 var(--dk);letter-spacing:-.01em;margin:2cqw 0 0;word-break:keep-all}
.iss-drop-02 .x2 .d-h2{font:400 6.6cqw/1.15 var(--dk);margin:0;word-break:keep-all}
.iss-drop-02 .x2 .d-en{font:italic 400 4.6cqw/1.1 var(--it);color:var(--mute)}
.iss-drop-02 .x2 .d-dek{font:500 3.3cqw/1.6 var(--ui);color:#3b3833;margin:2.4cqw 0 0;word-break:keep-all}
.iss-drop-02 .x2 .d-by{font:400 2.4cqw/1.5 var(--mono);color:var(--mute);margin-top:2cqw;letter-spacing:.04em}
.iss-drop-02 .x2 .d-cap{font:400 2.45cqw/1.5 var(--ui);color:var(--mute);word-break:keep-all;margin:0}
.iss-drop-02 .x2 .d-cap b{color:var(--ink);font-weight:700}
.iss-drop-02 .x2 .d-drop>p:first-child::first-letter{float:left;font:400 13cqw/.82 var(--dk);padding:1.2cqw 2cqw 0 0;color:var(--pink2)}
.iss-drop-02 .x2 .d-pull{font:400 5.6cqw/1.32 var(--dk);word-break:keep-all;border-top:1.2cqw solid var(--ink);padding:2.6cqw 0 0;margin:1cqw 0 3cqw}
.iss-drop-02 .x2 .d-pull p,.iss-drop-02 .x2 .d-pull blockquote{margin:0;font:inherit}
.iss-drop-02 .x2 .d-big{font:400 23cqw/.86 var(--dl);letter-spacing:-.06em;margin:0}
.iss-drop-02 .x2 .d-big s{text-decoration:line-through;text-decoration-color:var(--pink2);text-decoration-thickness:2.4cqw}
.iss-drop-02 .x2 .d-big small{font:400 4cqw/1 var(--mono);letter-spacing:0;color:var(--mute);margin-left:2cqw;vertical-align:.8em}
.iss-drop-02 .x2 .d-box{border:.4cqw solid var(--ink);padding:3cqw 3.4cqw;margin:2.4cqw 0;background:#fff}
.iss-drop-02 .x2 .d-box h3{margin:0 0 1.4cqw;font:400 4.6cqw/1.2 var(--dk)}
.iss-drop-02 .x2 .d-box h3 small{font:italic 400 3.4cqw/1 var(--it);color:var(--mute);margin-left:1.2cqw}
.iss-drop-02 .x2 .d-box .x-txt{font-size:3cqw;line-height:1.65}
.iss-drop-02 .x2 .d-box .x-txt p{margin:0 0 1.4cqw}
.iss-drop-02 .x2 .d-why{font:500 2.7cqw/1.5 var(--ui);background:var(--pink);padding:1.6cqw 2.2cqw;margin:1cqw 0 0;word-break:keep-all}
.iss-drop-02 .x2 .d-why b{font:600 2.1cqw/1 var(--mono);letter-spacing:.12em;margin-right:1.4cqw}
.iss-drop-02 .x2 svg text{font-family:var(--ui)}

/* 0 표지 */
.iss-drop-02 .x2.d-cover{background:var(--paper)}
.iss-drop-02 .x2 .d-top{position:absolute;left:5cqw;right:5cqw;top:3.4cqw;display:flex;justify-content:space-between;font:600 2.2cqw/1 var(--mono);letter-spacing:.12em}
.iss-drop-02 .x2 .d-mast{position:absolute;left:3.4cqw;top:5.6cqw;margin:0;font:400 31cqw/.8 var(--dl);letter-spacing:-.075em;color:var(--ink)}
.iss-drop-02 .x2 .d-mast::before{content:"Drop";position:absolute;left:1.3cqw;top:1.1cqw;color:var(--pink);z-index:-1}
.iss-drop-02 .x2 .d-mtag{position:absolute;left:5cqw;right:5cqw;top:34cqw;margin:0;display:flex;justify-content:space-between;align-items:baseline;font:500 2.4cqw/1.3 var(--ui);color:var(--ink);border-top:.35cqw solid var(--ink);padding-top:1.2cqw}
.iss-drop-02 .x2 .d-mtag b{font:400 3.2cqw/1 var(--dk);color:var(--pink2)}
.iss-drop-02 .x2 .d-keys{position:absolute;left:5cqw;right:5cqw;top:39.5cqw;height:56cqw}
.iss-drop-02 .x2 .d-cvh{position:absolute;left:5cqw;right:5cqw;top:97cqw;margin:0;font:400 14.6cqw/1 var(--dk);letter-spacing:-.02em}
.iss-drop-02 .x2 .d-cvh em{font-style:normal;color:var(--pink2)}
.iss-drop-02 .x2 .d-cvn{position:absolute;left:5cqw;top:113cqw;font:italic 400 6cqw/1 var(--it)}
.iss-drop-02 .x2 .d-cvn b{font:400 3cqw/1 var(--dl);font-style:normal;letter-spacing:.02em;margin-right:1.6cqw}
.iss-drop-02 .x2 .d-stk{position:absolute;right:8cqw;top:43cqw;width:21cqw;height:21cqw;border-radius:50%;background:var(--orange);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:400 3.7cqw/1.08 var(--dk);transform:rotate(-10deg);box-shadow:.6cqw .8cqw 0 var(--ink)}
.iss-drop-02 .x2 .d-stk small{font:600 1.8cqw/1 var(--mono);letter-spacing:.1em;margin-top:1cqw}
.iss-drop-02 .x2 .d-cvl{position:absolute;left:5cqw;right:5cqw;top:121cqw;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3cqw;border-top:.6cqw solid var(--ink);padding-top:2cqw}
.iss-drop-02 .x2 .d-cvl div{font:500 2.35cqw/1.4 var(--ui);word-break:keep-all}
.iss-drop-02 .x2 .d-cvl b{display:block;font:600 1.9cqw/1.2 var(--mono);letter-spacing:.1em;color:var(--pink2);margin-bottom:.6cqw}
.iss-drop-02 .x2 .d-bar{position:absolute;right:5cqw;bottom:3.2cqw;width:24cqw;background:#fff;padding:1.2cqw 1.4cqw .8cqw;border:.2cqw solid var(--ink)}
.iss-drop-02 .x2 .d-bar i{display:block;height:5cqw;background:repeating-linear-gradient(90deg,#121212 0 .3cqw,transparent .3cqw .6cqw,#121212 .6cqw .8cqw,transparent .8cqw 1.4cqw,#121212 1.4cqw 2cqw,transparent 2cqw 2.3cqw,#121212 2.3cqw 2.5cqw,transparent 2.5cqw 3.2cqw)}
.iss-drop-02 .x2 .d-bar span{display:flex;justify-content:space-between;font:400 1.6cqw/1 var(--mono);margin-top:.7cqw}
.iss-drop-02 .x2 .d-lp{position:absolute;left:5cqw;bottom:3.4cqw;display:flex;align-items:center;gap:2cqw;font:600 2.1cqw/1.3 var(--mono);letter-spacing:.06em}
.iss-drop-02 .x2 .d-lp i{width:7.4cqw;height:7.4cqw;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 9%,var(--pink) 9% 33%,#121212 33% 37%,#2b2b2b 37% 41%,#121212 41%)}

/* 1 차례 */
.iss-drop-02 .x2 .d-toc{list-style:none;margin:2.6cqw 0 0;padding:0}
.iss-drop-02 .x2 .d-toc li{display:grid;grid-template-columns:12cqw 1fr;gap:2cqw;padding:1.3cqw 0;border-top:.2cqw solid var(--rule);align-items:baseline}
.iss-drop-02 .x2 .d-toc li:first-child{border-top:.6cqw solid var(--ink)}
.iss-drop-02 .x2 .d-toc li b{font:400 5.4cqw/1 var(--dl);letter-spacing:-.04em}
.iss-drop-02 .x2 .d-toc li.k b{color:var(--pink2)}
.iss-drop-02 .x2 .d-toc li span{font:700 3.1cqw/1.3 var(--ui)}
.iss-drop-02 .x2 .d-toc li small{display:block;font:400 2.5cqw/1.4 var(--ui);color:var(--mute);margin-top:.5cqw}
.iss-drop-02 .x2 .d-how{margin-top:auto;border:.4cqw solid var(--ink);padding:2.8cqw 3.2cqw;font:500 2.75cqw/1.55 var(--ui);background:#fff;box-shadow:1cqw 1cqw 0 var(--pink)}
.iss-drop-02 .x2 .d-how b{font:400 3cqw/1 var(--dk);margin-right:1cqw}

/* 4 커버 첫 쪽 — 빈 홀 */
.iss-drop-02 .x2.d-dark{background:var(--hall);color:#ecebf2}
.iss-drop-02 .x2.d-dark::after{opacity:.2;mix-blend-mode:screen}
.iss-drop-02 .x2.d-dark .x-rh{color:#9a98ab;border-color:#ecebf2}
.iss-drop-02 .x2.d-dark .x-rh b{color:#ecebf2}
.iss-drop-02 .x2.d-dark .x-folio,.iss-drop-02 .x2.d-dark .x-folio span:first-child{color:#9a98ab}
.iss-drop-02 .x2.d-dark .x-txt{color:#dcdbe6}
.iss-drop-02 .x2.d-dark .d-kick{color:var(--pink)}
.iss-drop-02 .x2.d-dark .d-dek{color:#c9c7d6}
.iss-drop-02 .x2.d-dark .d-by,.iss-drop-02 .x2.d-dark .d-cap{color:#9a98ab}
.iss-drop-02 .x2 .d-hall{display:block;width:100%;height:auto;margin:0 0 2cqw}

/* 5 사실 상자 */
.iss-drop-02 .x2 .d-facts{display:grid;grid-template-columns:auto 1fr;gap:1.1cqw 3cqw;font:400 2.65cqw/1.45 var(--ui);border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink);padding:2.2cqw 0;margin:1.6cqw 0 2.4cqw}
.iss-drop-02 .x2 .d-facts dt{font:600 2.2cqw/1.6 var(--mono);color:var(--mute);letter-spacing:.08em}
.iss-drop-02 .x2 .d-facts dd{margin:0;font-weight:500}

/* 8 연표 */
.iss-drop-02 .x2 .d-tl{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.iss-drop-02 .x2 .d-tl::before{content:"";position:absolute;left:14.4cqw;top:1cqw;bottom:1cqw;width:.4cqw;background:var(--ink)}
.iss-drop-02 .x2 .d-tl li{display:grid;grid-template-columns:12cqw 1fr;gap:5cqw;padding:1.05cqw 0;position:relative}
.iss-drop-02 .x2 .d-tl li::before{content:"";position:absolute;left:13.3cqw;top:2.1cqw;width:2.6cqw;height:2.6cqw;background:var(--paper);border:.45cqw solid var(--ink)}
.iss-drop-02 .x2 .d-tl li.s::before{background:var(--pink)}
.iss-drop-02 .x2 .d-tl li.now::before{background:var(--orange);border-radius:50%;width:3.2cqw;height:3.2cqw;left:13cqw}
.iss-drop-02 .x2 .d-tl b{font:400 3.4cqw/1.3 var(--dl);text-align:right;letter-spacing:-.03em}
.iss-drop-02 .x2 .d-tl span{font:italic 400 4.1cqw/1.2 var(--it)}
.iss-drop-02 .x2 .d-tl small{display:block;font:400 2.35cqw/1.4 var(--ui);color:var(--mute);font-style:normal;margin-top:.3cqw}
.iss-drop-02 .x2 .d-key{display:flex;gap:4cqw;font:400 2.3cqw/1 var(--ui);color:var(--mute);margin:1.6cqw 0 2cqw}
.iss-drop-02 .x2 .d-key i{display:inline-block;width:2.4cqw;height:2.4cqw;border:.4cqw solid var(--ink);vertical-align:-.3cqw;margin-right:1cqw}

/* 9 두 판 비교 */
.iss-drop-02 .x2 .d-vs{width:100%;border-collapse:collapse;margin:2cqw 0 2.4cqw;font:400 2.65cqw/1.35 var(--ui)}
.iss-drop-02 .x2 .d-vs th{font:400 3.2cqw/1.15 var(--dl);text-align:left;padding:1.4cqw 1cqw;border-bottom:.6cqw solid var(--ink);letter-spacing:-.02em}
.iss-drop-02 .x2 .d-vs th small{display:block;font:italic 400 3cqw/1 var(--it);letter-spacing:0;color:var(--mute);margin-top:.6cqw}
.iss-drop-02 .x2 .d-vs td{padding:1.5cqw 1cqw;border-bottom:.2cqw solid var(--rule);vertical-align:top;word-break:keep-all}
.iss-drop-02 .x2 .d-vs td:first-child{font:600 2.1cqw/1.5 var(--mono);color:var(--mute);letter-spacing:.06em;width:18cqw}
.iss-drop-02 .x2 .d-vs td.hi{background:var(--pink);font-weight:700}

/* 10 곡 길이 그래프 */
.iss-drop-02 .x2 .d-bars{position:relative;margin:2cqw 0 1.4cqw}
.iss-drop-02 .x2 .d-bars .r{display:grid;grid-template-columns:9cqw 1fr 9cqw;align-items:center;gap:1.6cqw;height:3.65cqw}
.iss-drop-02 .x2 .d-bars .r b{font:600 2.1cqw/1 var(--mono);text-align:right;color:var(--mute)}
.iss-drop-02 .x2 .d-bars .r i{display:block;height:2.5cqw;background:var(--ink);width:var(--w)}
.iss-drop-02 .x2 .d-bars .r.f i{background:var(--pink2)}
.iss-drop-02 .x2 .d-bars .r.mid i{background:linear-gradient(90deg,var(--ink) 0 var(--m),var(--orange) var(--m))}
.iss-drop-02 .x2 .d-bars .r span{font:400 2.1cqw/1 var(--mono)}
.iss-drop-02 .x2 .d-bars .r.f b,.iss-drop-02 .x2 .d-bars .r.f span{color:var(--pink2)}
.iss-drop-02 .x2 .d-axis{display:flex;justify-content:space-between;font:400 1.9cqw/1 var(--mono);color:var(--mute);margin-left:10.6cqw;margin-right:10.6cqw;border-top:.2cqw solid var(--ink);padding-top:.8cqw}
.iss-drop-02 .x2 .d-strip{display:flex;height:5cqw;margin:2.6cqw 0 .6cqw;border:.3cqw solid var(--ink);position:relative}
.iss-drop-02 .x2 .d-strip i{display:block;height:100%;border-right:.2cqw solid var(--paper);background:var(--ink)}
.iss-drop-02 .x2 .d-strip i.f{background:var(--pink2)}
.iss-drop-02 .x2 .d-strip i.l{background:var(--orange)}
.iss-drop-02 .x2 .d-strip::after{content:"";position:absolute;left:50%;top:-1.6cqw;bottom:-1.6cqw;width:.5cqw;background:var(--blue)}
.iss-drop-02 .x2 .d-sl{display:flex;justify-content:space-between;font:400 2cqw/1.3 var(--mono);color:var(--mute)}
.iss-drop-02 .x2 .d-sl b{color:var(--blue);font-weight:600}

/* 11 7/4 */
.iss-drop-02 .x2 .d-beats{display:flex;flex-direction:column;gap:2cqw;margin:2.6cqw 0}
.iss-drop-02 .x2 .d-beats .m{display:flex;align-items:center;gap:1.2cqw}
.iss-drop-02 .x2 .d-beats .m span{font:600 2.2cqw/1 var(--mono);width:13cqw;color:var(--mute)}
.iss-drop-02 .x2 .d-beats .g{display:flex;gap:.8cqw;padding:1cqw;border:.35cqw solid var(--ink);border-radius:99cqw;margin-right:.6cqw}
.iss-drop-02 .x2 .d-beats .g i{width:5.2cqw;height:5.2cqw;border-radius:50%;background:var(--ink)}
.iss-drop-02 .x2 .d-beats .g i:first-child{background:var(--pink2)}

/* 12 몽상 */
.iss-drop-02 .x2.d-pinkp{background:var(--pink)}
.iss-drop-02 .x2.d-pinkp .x-rh{border-color:var(--ink);color:#4a2a3b}
.iss-drop-02 .x2.d-pinkp .x-folio{color:#4a2a3b}
.iss-drop-02 .x2.d-pinkp .x-more{box-shadow:1cqw 1cqw 0 var(--paper)}
.iss-drop-02 .x2 .d-moods{list-style:none;margin:2cqw 0 3cqw;padding:0;display:flex;flex-wrap:wrap;gap:1.6cqw 2.4cqw}
.iss-drop-02 .x2 .d-moods li{font:400 7.2cqw/1 var(--dk)}
.iss-drop-02 .x2 .d-moods li:nth-child(even){font:italic 400 7.6cqw/1 var(--it)}
