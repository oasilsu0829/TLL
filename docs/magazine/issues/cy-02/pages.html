<!--
Cypher Vol.02 지면 (판형 2: 2:3, 쪽마다 <template class="pg">). 단위 cqw = 쪽 폭의 1%(쪽 높이 = 150cqw).
글은 articles.md에서 {{p ...}}로 가져온다. 만들기: python3 scripts/mag-issue.py docs/magazine/issues/cy-02
같은 Shadow DOM에 다른 판형 2 호의 CSS가 함께 들어온다. 이 호의 규칙은 모두 .iss-cy-02 아래에 걸고,
공용 이름(.x2 .x-in .x-rh .x-folio .x-more .x-txt)은 속성을 전부 다시 정한다. 이 호만의 장치는 c- 접두어.
점수 기호(별 문자)는 쓰지 않는다: 별 그림은 SVG 도형으로.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Jost:wght@500;700;900&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#efebe3; --ink:#121212; --mute:#6b665e; --rule:rgba(18,18,18,.17);
  --red:#b0201e; --red2:#e23a2c; --steel:#8b939c; --night:#101012;
  --dl:'Archivo Black',sans-serif; --jo:'Jost',sans-serif; --dk:'Black Han Sans',sans-serif; --it:'Instrument Serif',Georgia,serif; --body:'Noto Serif KR',Georgia,serif; --ui:'Noto Sans KR',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --rd-bg:#f3efe7; --rd-ink:#141414; --rd-accent:#b0201e; --rd-rule:rgba(18,18,18,.14); --rd-on:#fff; --rd-hit:rgba(176,32,30,.16);
}
/* ── 지면 공용 ── */
.iss-cy-02 .x2{position:absolute;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);container-type:size;font-family:var(--body);-webkit-font-smoothing:antialiased}
.iss-cy-02 .x2::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.5;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .38  0 0 0 0 .35  0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.iss-cy-02 .x2 *{box-sizing:border-box}
.iss-cy-02 .x2 :is(h1,h2,h3){color:inherit;text-align:left;font-weight:400}
.iss-cy-02 .x2 .x-in{position:absolute;left:7cqw;right:7cqw;top:12cqw;bottom:12cqw;display:flex;flex-direction:column}
.iss-cy-02 .x2 .x-rh{position:absolute;left:7cqw;right:7cqw;top:4.4cqw;display:flex;justify-content:space-between;align-items:center;font:600 2.2cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:0;padding-bottom:0}
.iss-cy-02 .x2 .x-rh b{font:400 2.6cqw/1 var(--dl);letter-spacing:.02em;color:var(--paper);background:var(--red);padding:1cqw 1.6cqw;text-transform:uppercase}
.iss-cy-02 .x2 .x-folio{position:absolute;left:7cqw;right:7cqw;bottom:4.6cqw;display:flex;justify-content:space-between;font:400 2.2cqw/1 var(--mono);letter-spacing:.08em;color:var(--mute);border-top:.25cqw solid var(--ink);padding-top:1.4cqw}
.iss-cy-02 .x2 .x-folio span:first-child{font:900 2.8cqw/1 var(--jo);color:var(--red)}
.iss-cy-02 .x2 .x-txt{font:400 3.45cqw/1.74 var(--body);word-break:keep-all;color:#1d1c1a}
.iss-cy-02 .x2 .x-txt p{margin:0 0 2.3cqw}
.iss-cy-02 .x2 .x-txt .note{font:400 2.9cqw/1.6 var(--ui);color:var(--mute)}
.iss-cy-02 .x2 .x-txt ul{margin:0;padding:0;list-style:none}
.iss-cy-02 .x2 .x-txt li{padding:1.8cqw 0;border-top:.2cqw solid var(--rule);font:400 3cqw/1.55 var(--ui)}
.iss-cy-02 .x2 .x-txt .pull,.iss-cy-02 .x2 .x-txt blockquote{margin:0}
.iss-cy-02 .x2 .x-more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:1.6cqw;border:.5cqw solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:700 3.1cqw/1 var(--ui);padding:3cqw 4.2cqw;cursor:pointer;min-height:11cqw;text-transform:none}
.iss-cy-02 .x2 .x-more i{font-style:normal;font-size:2.3cqw;color:var(--red)}
.iss-cy-02 .x2 .x-more:focus-visible{outline:.6cqw solid var(--red);outline-offset:.8cqw}
.iss-cy-02 .x2.c-dark .x-more,.iss-cy-02 .x2.c-redp .x-more{background:transparent;border-color:var(--paper);color:var(--paper)}
.iss-cy-02 .x2.c-dark .x-more i,.iss-cy-02 .x2.c-redp .x-more i{color:var(--paper)}
.iss-cy-02 .x2 .c-row{display:flex;gap:3cqw;flex-wrap:wrap;margin-top:auto;align-items:flex-end}
.iss-cy-02 .x2 .c-row .x-more{margin-top:0}
/* 글자 장치 */
.iss-cy-02 .x2 .c-kick{font:600 2.4cqw/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.iss-cy-02 .x2 .c-h{font:400 10cqw/1.06 var(--dk);margin:1.6cqw 0 0;word-break:keep-all}
.iss-cy-02 .x2 .c-h2{font:400 6.8cqw/1.14 var(--dk);margin:0;word-break:keep-all}
.iss-cy-02 .x2 .c-en{font:900 3.2cqw/1.1 var(--jo);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.iss-cy-02 .x2 .c-dek{font:500 3.3cqw/1.6 var(--ui);color:#3b3833;margin:2.4cqw 0 0;word-break:keep-all}
.iss-cy-02 .x2 .c-by{font:400 2.4cqw/1.5 var(--mono);color:var(--mute);margin-top:2cqw;letter-spacing:.04em}
.iss-cy-02 .x2 .c-cap{font:400 2.45cqw/1.5 var(--ui);color:var(--mute);word-break:keep-all;margin:0}
.iss-cy-02 .x2 .c-cap b{color:var(--ink);font-weight:700}
.iss-cy-02 .x2 .c-drop>p:first-child::first-letter{float:left;font:400 13cqw/.82 var(--dk);padding:1.2cqw 2cqw 0 0;color:var(--red)}
.iss-cy-02 .x2 .c-pull{font:400 5.4cqw/1.34 var(--dk);word-break:keep-all;border-left:1.6cqw solid var(--red);padding:.6cqw 0 .6cqw 3cqw;margin:1cqw 0 3cqw}
.iss-cy-02 .x2 .c-pull p,.iss-cy-02 .x2 .c-pull blockquote{margin:0;font:inherit}
.iss-cy-02 .x2 .c-big{font:900 24cqw/.86 var(--jo);letter-spacing:-.05em;margin:0}
.iss-cy-02 .x2 .c-box{border:.5cqw solid var(--ink);padding:3cqw 3.4cqw;margin:2.4cqw 0;background:#f8f5ef}
.iss-cy-02 .x2 .c-box h3{margin:0 0 1.4cqw;font:400 4.6cqw/1.2 var(--dk)}
.iss-cy-02 .x2 .c-box h3 small{font:900 2.4cqw/1 var(--jo);letter-spacing:.06em;color:var(--red);margin-left:1.2cqw;text-transform:uppercase}
.iss-cy-02 .x2 .c-box .x-txt{font-size:3cqw;line-height:1.65}
.iss-cy-02 .x2 .c-box .x-txt p{margin:0 0 1.4cqw}
.iss-cy-02 .x2 .c-memo{font:500 2.6cqw/1.5 var(--ui);border-top:.25cqw dashed var(--ink);padding-top:1.4cqw;margin:.6cqw 0 0;word-break:keep-all}
.iss-cy-02 .x2 .c-memo b{font:600 2.1cqw/1 var(--mono);letter-spacing:.12em;color:var(--red);margin-right:1.2cqw}
.iss-cy-02 .x2 svg text{font-family:var(--ui)}

/* 0 표지 */
.iss-cy-02 .x2.c-cover{background:var(--paper)}
.iss-cy-02 .x2 .c-top{position:absolute;left:5cqw;right:5cqw;top:3.4cqw;display:flex;justify-content:space-between;font:600 2.2cqw/1 var(--mono);letter-spacing:.12em}
.iss-cy-02 .x2 .c-mast{position:absolute;left:4cqw;right:4cqw;top:6.6cqw;margin:0;font:400 20.4cqw/.84 var(--dl);letter-spacing:-.05em;color:var(--red);text-transform:uppercase}
.iss-cy-02 .x2 .c-cred{position:absolute;left:5cqw;top:28.6cqw;width:56cqw;margin:0;padding:0;list-style:none;font:600 2.6cqw/1 var(--mono);color:var(--ink)}
.iss-cy-02 .x2 .c-cred li{display:flex;gap:2cqw;align-items:baseline;padding:.62cqw 0;border-bottom:.2cqw solid var(--rule);white-space:nowrap}
.iss-cy-02 .x2 .c-cred li i{font-style:normal;color:var(--mute);width:5cqw;flex:0 0 auto}
.iss-cy-02 .x2 .c-cred li b{font-weight:600}
.iss-cy-02 .x2 .c-cred li b em{font-style:normal;background:var(--ink);color:var(--paper);padding:0 .8cqw}
.iss-cy-02 .x2 .c-zero{position:absolute;right:4cqw;top:34cqw;width:34cqw;text-align:center}
.iss-cy-02 .x2 .c-zero b{display:block;font:900 44cqw/.78 var(--jo);color:var(--red);letter-spacing:-.06em}
.iss-cy-02 .x2 .c-zero span{display:block;font:400 3.4cqw/1 var(--dl);letter-spacing:.04em;margin-top:1cqw}
.iss-cy-02 .x2 .c-zero small{display:block;font:500 2.2cqw/1.4 var(--ui);color:var(--mute);margin-top:1cqw}
.iss-cy-02 .x2 .c-cvh{position:absolute;left:5cqw;right:5cqw;top:87cqw;margin:0;font:400 12.6cqw/1.02 var(--dk);letter-spacing:-.02em}
.iss-cy-02 .x2 .c-cvh em{font-style:normal;color:var(--red)}
.iss-cy-02 .x2 .c-cvn{position:absolute;left:5cqw;top:113cqw;font:900 4.6cqw/1 var(--jo);letter-spacing:.02em}
.iss-cy-02 .x2 .c-cvn span{font:italic 400 5.6cqw/1 var(--it);letter-spacing:0;margin-left:1.4cqw;color:var(--red)}
.iss-cy-02 .x2 .c-cvl{position:absolute;left:5cqw;right:5cqw;top:120cqw;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3cqw;border-top:.6cqw solid var(--ink);padding-top:2cqw}
.iss-cy-02 .x2 .c-cvl div{font:500 2.35cqw/1.4 var(--ui);word-break:keep-all}
.iss-cy-02 .x2 .c-cvl b{display:block;font:600 1.9cqw/1.2 var(--mono);letter-spacing:.1em;color:var(--red);margin-bottom:.6cqw}
.iss-cy-02 .x2 .c-bar{position:absolute;right:5cqw;bottom:3.2cqw;width:24cqw;background:#fff;padding:1.2cqw 1.4cqw .8cqw;border:.2cqw solid var(--ink)}
.iss-cy-02 .x2 .c-bar i{display:block;height:5cqw;background:repeating-linear-gradient(90deg,#121212 0 .3cqw,transparent .3cqw .7cqw,#121212 .7cqw 1.1cqw,transparent 1.1cqw 1.4cqw,#121212 1.4cqw 2.1cqw,transparent 2.1cqw 2.5cqw,#121212 2.5cqw 2.7cqw,transparent 2.7cqw 3.3cqw)}
.iss-cy-02 .x2 .c-bar span{display:flex;justify-content:space-between;font:400 1.6cqw/1 var(--mono);margin-top:.7cqw}
.iss-cy-02 .x2 .c-lp{position:absolute;left:5cqw;bottom:3.4cqw;display:flex;align-items:center;gap:2cqw;font:600 2.1cqw/1.3 var(--mono);letter-spacing:.06em}
.iss-cy-02 .x2 .c-lp i{width:7.4cqw;height:7.4cqw;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 9%,var(--red) 9% 33%,#121212 33% 37%,#2b2b2b 37% 41%,#121212 41%)}
.iss-cy-02 .x2 .c-stamp{position:absolute;right:5cqw;top:5.6cqw;transform:rotate(8deg);border:.5cqw solid var(--ink);padding:1cqw 1.6cqw;font:600 2cqw/1.2 var(--mono);letter-spacing:.08em;background:var(--paper);text-align:center}

/* 1 차례 */
.iss-cy-02 .x2 .c-toc{list-style:none;margin:2.6cqw 0 0;padding:0}
.iss-cy-02 .x2 .c-toc li{display:grid;grid-template-columns:12cqw 1fr;gap:2cqw;padding:1.3cqw 0;border-top:.2cqw solid var(--rule);align-items:baseline}
.iss-cy-02 .x2 .c-toc li:first-child{border-top:.6cqw solid var(--ink)}
.iss-cy-02 .x2 .c-toc li b{font:900 5.4cqw/1 var(--jo);letter-spacing:-.03em}
.iss-cy-02 .x2 .c-toc li.k b{color:var(--red)}
.iss-cy-02 .x2 .c-toc li span{font:700 3.1cqw/1.3 var(--ui)}
.iss-cy-02 .x2 .c-toc li small{display:block;font:400 2.5cqw/1.4 var(--ui);color:var(--mute);margin-top:.5cqw}
.iss-cy-02 .x2 .c-how{margin-top:auto;background:var(--ink);color:var(--paper);padding:2.8cqw 3.2cqw;font:500 2.75cqw/1.55 var(--ui)}
.iss-cy-02 .x2 .c-how b{font:400 3cqw/1 var(--dk);color:var(--red2);margin-right:1cqw}

/* 2 편집장의 글 */
.iss-cy-02 .x2 .c-stars{display:block;width:70%;height:auto;margin:0 0 2cqw}

/* 4 커버 첫 쪽 */
.iss-cy-02 .x2.c-dark{background:var(--night);color:#ecebea}
.iss-cy-02 .x2.c-dark::after{opacity:.22;mix-blend-mode:screen}
.iss-cy-02 .x2.c-dark .x-rh{color:#97928b}
.iss-cy-02 .x2.c-dark .x-folio{color:#97928b;border-color:#5a5650}
.iss-cy-02 .x2.c-dark .x-txt{color:#dedbd6}
.iss-cy-02 .x2.c-dark .c-dek{color:#cfcac2}
.iss-cy-02 .x2.c-dark .c-by,.iss-cy-02 .x2.c-dark .c-cap{color:#97928b}
.iss-cy-02 .x2.c-dark .c-kick{color:var(--red2)}
.iss-cy-02 .x2 .c-sheet{list-style:none;margin:0 0 2.4cqw;padding:0;font:600 3cqw/1 var(--mono);counter-reset:n}
.iss-cy-02 .x2 .c-sheet li{display:flex;gap:2.4cqw;padding:.85cqw 0;border-bottom:.2cqw solid rgba(236,235,234,.14);white-space:nowrap}
.iss-cy-02 .x2 .c-sheet li::before{counter-increment:n;content:counter(n,decimal-leading-zero);color:#6f6a63;width:4.6cqw}
.iss-cy-02 .x2 .c-sheet li b{color:var(--red2);font-weight:600}
.iss-cy-02 .x2 .c-sheet li span{color:#8f8a83;margin-left:auto}

/* 사실 상자 · 결승 표 */
.iss-cy-02 .x2 .c-facts{display:grid;grid-template-columns:auto 1fr;gap:1.1cqw 3cqw;font:400 2.65cqw/1.45 var(--ui);border-top:.6cqw solid var(--ink);border-bottom:.2cqw solid var(--ink);padding:2.2cqw 0;margin:1.6cqw 0 2.4cqw}
.iss-cy-02 .x2 .c-facts dt{font:600 2.2cqw/1.6 var(--mono);color:var(--mute);letter-spacing:.08em}
.iss-cy-02 .x2 .c-facts dd{margin:0;font-weight:500}
.iss-cy-02 .x2 .c-rank{list-style:none;margin:2cqw 0 2.6cqw;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:1.4cqw;align-items:end}
.iss-cy-02 .x2 .c-rank li{text-align:center;font:500 2.3cqw/1.25 var(--ui);word-break:keep-all}
.iss-cy-02 .x2 .c-rank li i{display:block;background:var(--ink);margin-bottom:1cqw;height:var(--h)}
.iss-cy-02 .x2 .c-rank li:first-child i{background:var(--red)}
.iss-cy-02 .x2 .c-rank li b{display:block;font:900 3.6cqw/1 var(--jo);margin-bottom:.6cqw}

/* 7 연표 */
.iss-cy-02 .x2 .c-tl{list-style:none;margin:2.4cqw 0 0;padding:0;position:relative}
.iss-cy-02 .x2 .c-tl::before{content:"";position:absolute;left:16.4cqw;top:1cqw;bottom:1cqw;width:.5cqw;background:var(--ink)}
.iss-cy-02 .x2 .c-tl li{display:grid;grid-template-columns:14cqw 1fr;gap:5cqw;padding:1.05cqw 0;position:relative}
.iss-cy-02 .x2 .c-tl li::before{content:"";position:absolute;left:15.4cqw;top:2cqw;width:2.5cqw;height:2.5cqw;border-radius:50%;background:var(--paper);border:.5cqw solid var(--ink)}
.iss-cy-02 .x2 .c-tl li.w::before{background:var(--red);border-color:var(--red)}
.iss-cy-02 .x2 .c-tl li.lp::before{background:var(--ink)}
.iss-cy-02 .x2 .c-tl b{font:900 2.9cqw/1.45 var(--jo);text-align:right}
.iss-cy-02 .x2 .c-tl span{font:700 3cqw/1.35 var(--ui);word-break:keep-all}
.iss-cy-02 .x2 .c-tl small{display:block;font:400 2.35cqw/1.4 var(--ui);color:var(--mute);margin-top:.3cqw}
.iss-cy-02 .x2 .c-key{display:flex;gap:4cqw;font:400 2.3cqw/1 var(--ui);color:var(--mute);margin:1.6cqw 0 2cqw}
.iss-cy-02 .x2 .c-key i{display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;border:.4cqw solid var(--ink);vertical-align:-.3cqw;margin-right:1cqw}

/* 8 피처링 별자리 */
.iss-cy-02 .x2 .c-fig{display:block;width:100%;height:auto;margin:1.6cqw 0 1.4cqw}

/* 9 크레딧 지도 */
.iss-cy-02 .x2.c-mapp{background:#f6f2ea}
.iss-cy-02 .x2 .c-mx{width:100%;border-collapse:collapse;margin:2cqw 0 1.4cqw;table-layout:fixed}
.iss-cy-02 .x2 .c-mx th{font:600 1.85cqw/1.1 var(--mono);color:var(--ink);height:15cqw;vertical-align:bottom;padding:0 0 1cqw;letter-spacing:.02em}
.iss-cy-02 .x2 .c-mx th span{display:inline-block;transform:rotate(-62deg);transform-origin:0 100%;white-space:nowrap;margin-left:2.6cqw;width:0}
.iss-cy-02 .x2 .c-mx th:first-child{width:25cqw}
.iss-cy-02 .x2 .c-mx th.h{color:var(--red)}
.iss-cy-02 .x2 .c-mx td{height:5.5cqw;border-top:.2cqw solid var(--rule);text-align:center;padding:0;font:400 2cqw/1 var(--mono)}
.iss-cy-02 .x2 .c-mx td:first-child{text-align:left;font:600 2.35cqw/1.1 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iss-cy-02 .x2 .c-mx td:first-child i{font:400 1.9cqw/1 var(--mono);font-style:normal;color:var(--mute);margin-right:1cqw}
.iss-cy-02 .x2 .c-mx td.t{font-weight:900}
.iss-cy-02 .x2 .c-mx td b{display:inline-block;width:3.6cqw;height:3.6cqw;background:var(--ink);vertical-align:middle}
.iss-cy-02 .x2 .c-mx td b.r{background:var(--red);border-radius:50%}
.iss-cy-02 .x2 .c-mx tr.tot td{border-top:.6cqw solid var(--ink);font:900 2.8cqw/1 var(--jo);height:6cqw}
.iss-cy-02 .x2 .c-mx tr.tot td:first-child{font:600 2.1cqw/1 var(--mono)}

/* 11 숫자 두 줄 */
.iss-cy-02 .x2.c-redp{background:var(--red);color:var(--paper)}
.iss-cy-02 .x2.c-redp::after{opacity:.25}
.iss-cy-02 .x2.c-redp .x-rh{color:#f3c9c2}
.iss-cy-02 .x2.c-redp .x-rh b{background:var(--ink)}
.iss-cy-02 .x2.c-redp .x-folio{color:#f3c9c2;border-color:#f3c9c2}
.iss-cy-02 .x2.c-redp .x-folio span:first-child{color:var(--paper)}
.iss-cy-02 .x2.c-redp .x-txt{color:#fff3ef}
.iss-cy-02 .x2.c-redp .c-cap{color:#f3c9c2}
.iss-cy-02 .x2 .c-two{margin:1cqw 0 3cqw}
.iss-cy-02 .x2 .c-two div{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:.5cqw solid var(--paper);padding:2.2cqw 0 1.6cqw}
.iss-cy-02 .x2 .c-two b{font:900 18cqw/.82 var(--jo);letter-spacing:-.05em}
.iss-cy-02 .x2 .c-two span{font:400 3.6cqw/1.2 var(--dk);text-align:right;padding-bottom:1cqw}
